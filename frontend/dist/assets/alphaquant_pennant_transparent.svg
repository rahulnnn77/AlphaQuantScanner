<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pImpulse" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="pFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="pGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <filter id="pSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Impulse Flagpole -->
  <path d="M 16 84 L 16 20" stroke="url(#pImpulse)" stroke-width="7" stroke-linecap="round"/>
  <!-- Foundation Node -->
  <circle cx="16" cy="84" r="5" fill="#1D4ED8"/>
  <circle cx="16" cy="84" r="2.5" fill="#60A5FA"/>

  <!-- Converging Pennant Triangle -->
  <polygon points="16,20 62,42 16,64" fill="url(#pFill)" stroke="#1E3A8A" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="16" y1="20" x2="62" y2="42" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="16" y1="64" x2="62" y2="42" stroke="#0284C7" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Internal Harmonic Wave Cycle -->
  <path d="M 21 57 L 31 28 L 41 50 L 51 37 L 62 42" 
        stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <circle cx="31" cy="28" r="2" fill="#BAE6FD"/>
  <circle cx="41" cy="50" r="2" fill="#BAE6FD"/>
  <circle cx="51" cy="37" r="2" fill="#BAE6FD"/>

  <!-- Breakout Impulse & Arrow -->
  <g filter="url(#pSoftGlow)">
    <path d="M 62 42 L 88 15" stroke="url(#pGreen)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 72 11 L 91 12 L 90 31 Z" fill="url(#pGreen)"/>
    <circle cx="62" cy="42" r="4.5" fill="#00F5A0"/>
    <circle cx="62" cy="42" r="2" fill="#FFFFFF"/>
  </g>
</svg>