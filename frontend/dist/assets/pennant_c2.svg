<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="c2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="c2_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#c2_bg)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Grid -->
  <line x1="16" y1="78" x2="84" y2="78" stroke="#162032" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="16" y1="50" x2="84" y2="50" stroke="#162032" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Candlestick Flagpole (Strong Momentum Candles) -->
  <!-- Candle 1 -->
  <line x1="22" y1="84" x2="22" y2="60" stroke="#10B981" stroke-width="1.5"/>
  <rect x="19.5" y="65" width="5" height="15" rx="1" fill="#10B981"/>
  <!-- Candle 2 -->
  <line x1="29" y1="70" x2="29" y2="42" stroke="#10B981" stroke-width="1.5"/>
  <rect x="26.5" y="47" width="5" height="19" rx="1" fill="#10B981"/>
  <!-- Candle 3 (Apex of pole) -->
  <line x1="36" y1="52" x2="36" y2="28" stroke="#10B981" stroke-width="1.5"/>
  <rect x="33.5" y="32" width="5" height="17" rx="1" fill="#10B981"/>

  <!-- Pennant Converging Trendlines -->
  <line x1="36" y1="30" x2="68" y2="44" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="58" x2="68" y2="44" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Consolidation Candles inside Pennant -->
  <!-- Red candle 1 -->
  <rect x="43" y="36" width="4" height="10" rx="0.5" fill="#F43F5E"/>
  <!-- Green candle 2 -->
  <rect x="49.5" y="42" width="4" height="7" rx="0.5" fill="#10B981"/>
  <!-- Small neutral candle 3 -->
  <rect x="56" y="42" width="3.5" height="5" rx="0.5" fill="#38BDF8"/>

  <!-- Explosive Breakout Arrow from Apex -->
  <g filter="url(#c2_glow)">
    <path d="M 68 44 L 84 20" stroke="#10B981" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 74 18 L 88 17 L 86 31 Z" fill="#10B981"/>
    <circle cx="68" cy="44" r="3.5" fill="#00F5A0"/>
  </g>
</svg>