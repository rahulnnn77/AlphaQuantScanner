<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="aq_p_badge_bg" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#111A2E" />
      <stop offset="100%" stop-color="#06090F" />
    </radialGradient>
    <linearGradient id="aq_p_badge_stroke" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1E293B" stroke-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="aq_p_badge_pole" x1="16" y1="50" x2="16" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="aq_p_badge_breakout" x1="38" y1="32" x2="54" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#aq_p_badge_bg)" stroke="url(#aq_p_badge_stroke)" stroke-width="1.5" />

  <!-- Technical Chart Grid -->
  <line x1="10" y1="50" x2="54" y2="50" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round" />
  <line x1="10" y1="34" x2="54" y2="34" stroke="#162235" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round" />

  <!-- Flagpole -->
  <line x1="16" y1="50" x2="16" y2="18" stroke="url(#aq_p_badge_pole)" stroke-width="4.2" stroke-linecap="round" />
  <circle cx="16" cy="50" r="2.5" fill="#2563EB" />

  <!-- Symmetrical Pennant Triangle -->
  <polygon points="16,18 38,32 16,46" fill="#3B82F6" fill-opacity="0.2" stroke="#1D4ED8" stroke-width="1.2" stroke-linejoin="round" />
  <line x1="16" y1="18" x2="38" y2="32" stroke="#60A5FA" stroke-width="2.4" stroke-linecap="round" />
  <line x1="16" y1="46" x2="38" y2="32" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" />

  <!-- Internal Price Waves -->
  <path d="M 19 43 L 24 23 L 29 38 L 34 29 L 38 32" 
        stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85" />

  <!-- Breakout Vector & Arrowhead -->
  <line x1="38" y1="32" x2="53" y2="17" stroke="url(#aq_p_badge_breakout)" stroke-width="4.2" stroke-linecap="round" />
  <path d="M 44 15 L 54 16 L 53 26 Z" fill="url(#aq_p_badge_breakout)" />
  
  <circle cx="38" cy="32" r="2.4" fill="#10B981" />
  <circle cx="53" cy="17" r="1.8" fill="#34D399" />
</svg>