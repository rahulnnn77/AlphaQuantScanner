<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="c3_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="35%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="c3_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#080D1A" stroke="#1E293B" stroke-width="2"/>

  <!-- Dynamic Continuous Pennant Ribbon -->
  <g filter="url(#c3_glow)">
    <!-- Base to apex upward stroke -->
    <path d="M 22 78 L 48 24 L 74 54 L 48 54 L 82 20" 
          stroke="url(#c3_grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Triangle pennant cross-tie -->
    <polygon points="48,24 74,54 48,54" fill="#06B6D4" fill-opacity="0.25"/>
    <!-- Arrowhead -->
    <path d="M 70 18 L 88 16 L 86 34 Z" fill="#4ADE80"/>
  </g>
  <circle cx="48" cy="54" r="4" fill="#06B6D4"/>
</svg>