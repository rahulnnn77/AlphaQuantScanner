<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="aq_p_badge_bg_light" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <linearGradient id="aq_p_badge_stroke_light" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="aq_p_light_pole" x1="16" y1="50" x2="16" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="aq_p_light_breakout" x1="38" y1="32" x2="54" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#aq_p_badge_bg_light)" stroke="url(#aq_p_badge_stroke_light)" stroke-width="1.5" />

  <!-- Grid -->
  <line x1="10" y1="50" x2="54" y2="50" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round" />

  <!-- Flagpole -->
  <line x1="16" y1="50" x2="16" y2="18" stroke="url(#aq_p_light_pole)" stroke-width="4.2" stroke-linecap="round" />
  <circle cx="16" cy="50" r="2.5" fill="#1E40AF" />

  <!-- Pennant Triangle -->
  <polygon points="16,18 38,32 16,46" fill="#3B82F6" fill-opacity="0.14" stroke="#2563EB" stroke-width="1.2" stroke-linejoin="round" />
  <line x1="16" y1="18" x2="38" y2="32" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" />
  <line x1="16" y1="46" x2="38" y2="32" stroke="#0284C7" stroke-width="2.4" stroke-linecap="round" />

  <!-- Price Wave -->
  <path d="M 19 43 L 24 23 L 29 38 L 34 29 L 38 32" 
        stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75" />

  <!-- Breakout Vector -->
  <line x1="38" y1="32" x2="53" y2="17" stroke="url(#aq_p_light_breakout)" stroke-width="4.2" stroke-linecap="round" />
  <path d="M 44 15 L 54 16 L 53 26 Z" fill="url(#aq_p_light_breakout)" />

  <circle cx="38" cy="32" r="2.4" fill="#047857" />
  <circle cx="53" cy="17" r="1.8" fill="#10B981" />
</svg>