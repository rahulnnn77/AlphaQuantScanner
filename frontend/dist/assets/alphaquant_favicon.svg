<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="aq_fav_pole" x1="7" y1="26" x2="7" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="aq_fav_breakout" x1="19" y1="16" x2="28" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0A0E17" />
  
  <!-- Flagpole -->
  <line x1="7" y1="26" x2="7" y2="9" stroke="url(#aq_fav_pole)" stroke-width="2.6" stroke-linecap="round" />
  
  <!-- Pennant triangle -->
  <polygon points="7,9 19,16 7,23" fill="#3B82F6" fill-opacity="0.3" stroke="#60A5FA" stroke-width="1.2" stroke-linejoin="round" />
  
  <!-- Breakout vector -->
  <line x1="19" y1="16" x2="27" y2="8" stroke="url(#aq_fav_breakout)" stroke-width="2.6" stroke-linecap="round" />
  <circle cx="19" cy="16" r="1.5" fill="#10B981" />
  <circle cx="27" cy="8" r="1.4" fill="#34D399" />
</svg>