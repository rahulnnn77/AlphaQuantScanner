<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="qRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <linearGradient id="pennantGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="flagArea" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="114" height="114" rx="26" fill="#0C121E" stroke="#1E293B" stroke-width="2"/>

  <!-- Left Side: Quantitative Orbit Ring -->
  <path d="M 44 24 C 25 24 14 38 14 58 C 14 78 28 92 48 92 C 64 92 74 82 78 70" 
        stroke="url(#qRing)" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Center Flagpole: Rising from base of Q up to breakout level -->
  <line x1="48" y1="92" x2="48" y2="34" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

  <!-- Symmetrical Pennant Triangle -->
  <polygon points="48,34 82,48 48,64" fill="url(#flagArea)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Candlesticks / waves inside pennant -->
  <line x1="56" y1="40" x2="56" y2="58" stroke="#60A5FA" stroke-width="2"/>
  <line x1="66" y1="44" x2="66" y2="53" stroke="#93C5FD" stroke-width="2"/>

  <!-- Bullish Breakout Arrow out of Pennant Apex -->
  <g filter="url(#pGlow)">
    <path d="M 82 48 L 102 26" stroke="url(#pennantGreen)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 87 23 L 106 22 L 105 41 Z" fill="url(#pennantGreen)"/>
    <circle cx="82" cy="48" r="4" fill="#34D399"/>
  </g>
</svg>