<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="c4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="c4_flag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="c4_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#c4_bg)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Circular Technical Track -->
  <circle cx="50" cy="50" r="38" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="50" cy="50" r="38" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="60 180" stroke-linecap="round"/>

  <!-- Strong Center Flagpole -->
  <line x1="30" y1="76" x2="30" y2="24" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="30" cy="24" r="3.5" fill="#38BDF8"/>

  <!-- 3D Flowing Pennant Triangular Flag -->
  <path d="M 30 26 Q 48 34 68 44 Q 48 52 30 58 Z" fill="url(#c4_flag)" stroke="#60A5FA" stroke-width="1.5"/>

  <!-- Breakout Arrow slicing upwards -->
  <g filter="url(#c4_glow)">
    <path d="M 40 68 L 68 44 L 86 22" stroke="#10B981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 74 19 L 90 18 L 89 34 Z" fill="#10B981"/>
  </g>
</svg>