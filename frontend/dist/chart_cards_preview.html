<html lang="en">

  <title>AlphaQuant — Chart Cards Grid Preview</title>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A0E17;
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 22px 26px 48px;
    }
    .wrap { max-width: 1360px; margin: 0 auto; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .toolbar h1 { font-size: 22px; font-weight: 600; color: #fff; }
    .toolbar p { font-size: 12.5px; color: #94A3B8; margin-top: 3px; }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .view-toggle {
      display: inline-flex;
      background: #070B13;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9px;
      padding: 3px;
    }
    .vt-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .vt-btn.on {
      background: rgba(6, 182, 212, 0.16);
      color: #22D3EE;
      border: 1px solid rgba(6, 182, 212, 0.35);
    }
    .pg-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #94A3B8;
    }

    /* 2-Column Card Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 1000px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    .chart-card {
      background: #0B101B;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease;
    }
    .chart-card:hover {
      border-color: rgba(34, 211, 238, 0.32);
    }

    .cc-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .cc-setup {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
      color: #22D3EE;
      margin-bottom: 2px;
    }
    .cc-title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cc-name { font-size: 15px; font-weight: 700; color: #fff; }
    .cc-sym {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #94A3B8;
      font-weight: 600;
    }
    .cc-sec {
      font-size: 11px;
      color: #34D399;
      text-decoration: underline;
      text-decoration-color: rgba(52, 211, 153, 0.35);
      text-underline-offset: 3px;
      margin-top: 2px;
      display: inline-block;
    }

    .cc-right { text-align: right; }
    .cc-tech-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: #22D3EE;
      background: transparent;
      border: none;
      cursor: pointer;
      margin-bottom: 3px;
    }
    .cc-tech-btn:hover { text-decoration: underline; }
    .cc-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 700;
      color: #F8FAFC;
    }

    .cc-ohlc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94A3B8;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .cc-ohlc strong { color: #E2E8F0; font-weight: 600; }
    .rs-pill {
      color: #34D399;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 0 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .cc-chart-box {
      width: 100%;
      height: 230px;
      background: #070B13;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .cc-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 11px;
    }
    .cc-foot-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #070B13;
      color: #CBD5E1;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .cc-foot-btn:hover {
      border-color: rgba(34, 211, 238, 0.4);
      color: #22D3EE;
    }
    .cc-status-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.12);
      color: #34D399;
      border: 1px solid rgba(52, 211, 153, 0.25);
    }
  </style>
</head>

        </div>
        <div class="cc-chart-box" id="chartBox_${idx}"></div>
        <div class="cc-foot">
          <button class="cc-foot-btn" onclick="saveCardChart(${idx})">Save Chart PNG</button>
          <span class="cc-status-pill">${stk.setup}</span>
        </div>
      `;
      grid.appendChild(card);

      const box = document.getElementById('chartBox_' + idx);
      const chart = LightweightCharts.createChart(box, {
        width: box.clientWidth || 600,
        height: 230,
        layout: { background: { color: '#070B13' }, textColor: '#94A3B8', fontFamily: 'Inter, sans-serif', fontSize: 10 },
        grid: { vertLines: { color: 'rgba(255,255,255,0.03)' }, horzLines: { color: 'rgba(255,255,255,0.03)' } },
        rightPriceScale: { borderColor: 'rgba(255,255,255,0.08)' },
        timeScale: { borderColor: 'rgba(255,255,255,0.08)' }
      });
      const cs = chart.addCandlestickSeries({
        upColor: '#10B981', downColor: '#F43F5E',
        borderUpColor: '#10B981', borderDownColor: '#F43F5E',
        wickUpColor: '#10B981', wickDownColor: '#F43F5E'
      });
      cs.setData(stk.candles.map(c => ({ time: c[0], open: c[1], high: c[2], low: c[3], close: c[4] })));

      const hps = chart.addLineSeries({ color: '#06B6D4', lineWidth: 1.8 });
      let ema = stk.candles[0][4];
      const k = 2 / 64;
      hps.setData(stk.candles.map((c, i) => {
        ema = i === 0 ? c[4] : (c[4] * k + ema * (1 - k));
        return { time: c[0], value: +ema.toFixed(2) };
      }));
      chart.timeScale().fitContent();
      stk._chart = chart;
    });

    function saveCardChart(idx) {
      const stk = CARDS[idx];
      if (!stk || !stk._chart) return;
      const chartCanvas = stk._chart.takeScreenshot();
      const dpr = 2;
      const headerH = 40 * dpr;
      const out = document.createElement('canvas');
      out.width = chartCanvas.width;
      out.height = chartCanvas.height + headerH;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#070B13';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.fillStyle = '#0B101B';
      ctx.fillRect(0, 0, out.width, headerH);
      ctx.fillStyle = '#F8FAFC';
      ctx.font = `700 ${14 * dpr}px Inter, sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.fillText(`${stk.symbol} · ${stk.sector}`, 16 * dpr, headerH / 2);
      ctx.fillStyle = '#94A3B8';
      ctx.font = `500 ${10 * dpr}px "JetBrains Mono", monospace`;
      ctx.textAlign = 'right';
      ctx.fillText('alphaquanttechnology.com', out.width - 16 * dpr, headerH / 2);
      ctx.textAlign = 'left';
      ctx.drawImage(chartCanvas, 0, headerH);
      const a = document.createElement('a');
      a.href = out.toDataURL('image/png', 1.0);
      a.download = `${stk.symbol}_alphaquant.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
