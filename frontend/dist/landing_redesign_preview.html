<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlphaQuant | Landing Preview</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>html,body{margin:0;background:#0B0D10}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ==================== AQ LANDING (portable into index.html) ==================== */
const AQ_LANDING_CSS = `
.aq{--ink:#0B0D10;--ink2:#101317;--paper:#E8E6E1;--mute:#8A8F98;--dim:#5A606A;--rule:#1C2026;--sig:#3ECF7D;--neg:#E5675B;
  --ease:cubic-bezier(.22,1,.36,1);background:var(--ink);color:var(--paper);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.aq *{box-sizing:border-box}
.aq a{color:inherit;text-decoration:none}
.aq .serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.01em}
.aq .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.aq .wrap{max-width:1220px;margin:0 auto;padding:0 40px}
.aq .eyebrow{font:500 11px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.aq :focus-visible{outline:1px solid var(--sig);outline-offset:3px}

/* nav */
.aq-nav{position:fixed;inset:0 0 auto 0;z-index:50;height:64px;display:flex;align-items:center;transition:background .42s var(--ease),border-color .42s var(--ease);border-bottom:1px solid transparent}
.aq-nav.on{background:rgba(11,13,16,.92);border-color:var(--rule)}
.aq-nav .wrap{display:flex;align-items:center;justify-content:space-between;width:100%}
.aq-brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.aq-brand img{width:26px;height:26px}
.aq-links{display:flex;gap:30px;align-items:center;font-size:13.5px;color:var(--mute)}
.aq-links a{position:relative;transition:color .18s var(--ease)}
.aq-links a:hover{color:var(--paper)}
.aq-links a.ul::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--paper);transform:scaleX(0);transform-origin:left;transition:transform .32s var(--ease)}
.aq-links a.ul:hover::after{transform:scaleX(1)}

/* buttons */
.aq-btn{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 22px;border-radius:4px;font:600 14px/1 inherit;cursor:pointer;border:1px solid transparent;
  transition:transform .18s var(--ease),background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease)}
.aq-btn:active{transform:scale(.97)}
.aq-btn.solid{background:var(--paper);color:var(--ink)}
.aq-btn.solid:hover{background:#fff}
.aq-btn.line{border-color:#2A2F37;color:var(--paper);background:transparent}
.aq-btn.line:hover{border-color:var(--paper)}
.aq-btn .arr{transition:transform .28s var(--ease)}
.aq-btn:hover .arr{transform:translateX(3px)}
.aq-btn.sm{height:34px;padding:0 14px;font-size:13px}

/* hero */
.aq-hero{min-height:100vh;display:flex;align-items:center;padding:120px 0 72px;position:relative}
.aq-hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center;width:100%}
.aq-hero h1{font-size:clamp(48px,6.4vw,92px);line-height:.98;margin:22px 0 26px}
.aq-hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.aq-hero h1 .w>span{display:inline-block;transform:translateY(105%);transition:transform .9s var(--ease)}
.aq-hero.go h1 .w>span{transform:none}
.aq-hero h1 em{font-style:italic;color:var(--mute)}
.aq-hero .sub{color:var(--mute);font-size:15px;max-width:460px}
.aq-hero .ctas{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.aq-fade{opacity:0;transform:translateY(10px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.aq-hero.go .aq-fade{opacity:1;transform:none}
.aq-mark{width:44px;height:44px}
.aq-mark path{stroke-dasharray:240;stroke-dashoffset:240;transition:stroke-dashoffset .9s var(--ease)}
.aq-hero.go .aq-mark path{stroke-dashoffset:0}

.aq-chartpanel{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:22px 0}
.aq-chartpanel .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.aq-chartpanel .px{font-size:30px}
.aq-line path.l{stroke-dasharray:3000;stroke-dashoffset:3000;transition:stroke-dashoffset 2.2s var(--ease) .5s}
.aq-hero.go .aq-line path.l{stroke-dashoffset:0}
.aq-line path.a{opacity:0;transition:opacity 1.2s var(--ease) 1.6s}
.aq-hero.go .aq-line path.a{opacity:1}
.aq-adbar{display:flex;height:4px;margin-top:6px;background:#1A1E24}
.aq-adbar i{display:block;height:100%}
.up{color:var(--sig)}.dn{color:var(--neg)}

/* index strip */
.aq-index{padding:12px 0 100px}
.aq-index ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid var(--rule)}
.aq-index li a{display:block;padding:18px 12px 0 0;color:var(--mute);font-size:12.5px;transition:color .18s var(--ease)}
.aq-index li a:hover{color:var(--paper)}
.aq-index li .n{display:block;font:500 11px ui-monospace,monospace;color:var(--dim);margin-bottom:8px}

/* sections */
.aq-sec{padding:116px 0;border-top:1px solid var(--rule)}
.aq-sec h2{font-size:clamp(38px,4.5vw,62px);line-height:1.02;margin:14px 0 18px}
.aq-sec p.lede{color:var(--mute);max-width:520px;margin:0;font-size:15px}
.aq-rv{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.aq-rv.in{opacity:1;transform:none}
.aq-rv.d1{transition-delay:.08s}.aq-rv.d2{transition-delay:.16s}.aq-rv.d3{transition-delay:.24s}

/* product screenshot frames */
.aq-shot{background:var(--ink2);border:1px solid var(--rule);border-radius:6px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.45)}
.aq-shot .bar{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--rule);font:500 11.5px ui-monospace,monospace;color:var(--mute);letter-spacing:.04em}
.aq-shot .imgw{overflow:hidden;background:#090C11}
.aq-shot img{display:block;width:100%;height:auto;transition:transform .9s var(--ease)}
.aq-shot:hover img{transform:scale(1.01)}
.aq-scale{transform:scale(.95);opacity:.35;transition:transform 1.1s var(--ease),opacity 1.1s var(--ease)}
.aq-scale.in{transform:none;opacity:1}
.aq-live{display:inline-flex;align-items:center;gap:7px}
.aq-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sig)}

/* editorial layouts (each module distinct) */
.aq-head-split{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end}
.aq-split-lr{display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:center}
.aq-split-rl{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center}
.aq-specs{list-style:none;margin:28px 0 0;padding:0}
.aq-specs li{padding:12px 0;border-top:1px solid var(--rule);font-size:13.5px;color:var(--mute);display:grid;grid-template-columns:120px 1fr;gap:16px}
.aq-specs li b{color:var(--paper);font-weight:500;font-family:ui-monospace,monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}

/* screener annotations */
.aq-anno{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:40px}
.aq-anno div{border-top:1px solid var(--rule);padding-top:16px;position:relative}
.aq-anno div::before{content:"";position:absolute;top:-1px;left:0;height:1px;width:100%;background:var(--paper);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease)}
.aq-anno.in div::before{transform:scaleX(1)}
.aq-anno div:nth-child(2)::before{transition-delay:.15s}.aq-anno div:nth-child(3)::before{transition-delay:.3s}
.aq-anno .n{font:500 11px ui-monospace,monospace;color:var(--dim)}
.aq-anno h4{margin:8px 0 6px;font-size:15px;font-weight:600}
.aq-anno p{margin:0;color:var(--mute);font-size:13.5px}

/* weekly diagram */
.aq-wsteps{list-style:none;margin:28px 0 0;padding:0;counter-reset:s}
.aq-wsteps li{display:grid;grid-template-columns:34px 1fr;padding:14px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--mute)}
.aq-wsteps li b{color:var(--paper);font-weight:600}
.aq-wsteps li::before{counter-increment:s;content:"0" counter(s);font:500 11px ui-monospace,monospace;color:var(--dim);padding-top:3px}
.aq-diag rect,.aq-diag line,.aq-diag path,.aq-diag circle,.aq-diag text{transition:opacity .6s var(--ease)}
.aq-diag .s{opacity:0}
.aq-diag.in .s1{opacity:1;transition-delay:.1s}.aq-diag.in .s2{opacity:1;transition-delay:.45s}.aq-diag.in .s3{opacity:1;transition-delay:.8s}.aq-diag.in .s4{opacity:1;transition-delay:1.15s}

/* method + closing + footer */
.aq-method{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:48px}
.aq-method p{margin:10px 0 0;color:var(--mute);font-size:14px}
.aq-method h4{margin:0;font-size:24px}
.aq-close{padding:150px 0;border-top:1px solid var(--rule)}
.aq-close h2{font-size:clamp(44px,6vw,84px);line-height:1;margin:0 0 36px;max-width:900px}
.aq-foot{border-top:1px solid var(--rule);padding:48px 0 40px;font-size:12.5px;color:var(--dim)}
.aq-foot .row{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.aq-foot a{color:var(--mute);margin-right:22px;cursor:pointer}
.aq-foot a:hover{color:var(--paper)}
.aq-foot .disc{margin-top:28px;max-width:820px;line-height:1.6}
.aq-mcta{display:none}

/* tablet */
@media (max-width:1024px){
  .aq .wrap{padding:0 28px}
  .aq-hero .wrap,.aq-head-split,.aq-split-lr,.aq-split-rl{grid-template-columns:1fr;gap:40px}
  .aq-split-rl .aq-media{order:2}
  .aq-index ol{grid-template-columns:repeat(4,1fr)}
  .aq-method{grid-template-columns:1fr;gap:32px}
}
/* mobile */
@media (max-width:640px){
  .aq .wrap{padding:0 20px}
  .aq-links .hide-m{display:none}
  .aq-hero{min-height:auto;padding:108px 0 52px}
  .aq-hero .ctas .aq-btn{flex:1;justify-content:center}
  .aq-index{padding:0 0 56px}
  .aq-index ol{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:22px;scrollbar-width:none}
  .aq-index li{flex:0 0 auto;scroll-snap-align:start}
  .aq-sec{padding:72px 0}
  .aq-bleed{margin:0 -20px}.aq-bleed .aq-shot{border-radius:0;border-left:0;border-right:0}
  .aq-anno{grid-template-columns:1fr;gap:20px}
  .aq-specs li{grid-template-columns:1fr;gap:4px}
  .aq-close{padding:92px 0 120px}
  .aq-mcta{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;gap:8px;padding:8px;background:rgba(16,19,23,.96);border:1px solid var(--rule);border-radius:6px;
    transform:translateY(120%);transition:transform .42s var(--ease)}
  .aq-mcta.on{transform:none}
  .aq-mcta .aq-btn{flex:1;justify-content:center;height:42px}
}
@media (prefers-reduced-motion:reduce){
  .aq *,.aq *::before,.aq *::after{transition:none!important;animation:none!important}
  .aq-rv,.aq-fade,.aq-scale{opacity:1!important;transform:none!important}
  .aq-hero h1 .w>span{transform:none!important}
  .aq-mark path,.aq-line path.l{stroke-dashoffset:0!important}
  .aq-line path.a,.aq-diag .s{opacity:1!important}
}
`;

function useAqReveal() {
  React.useEffect(() => {
    const els = document.querySelectorAll('.aq [data-rv]');
    if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.14, rootMargin: '0px 0px -6% 0px' });
    els.forEach(e => io.observe(e));
    return () => io.disconnect();
  }, []);
}

const aqFmt = (n, d = 2) => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
const aqPct = n => n == null ? '—' : `${n >= 0 ? '+' : ''}${Number(n).toFixed(2)}%`;

function AqShot({ src, alt, label, meta, scale }) {
  return (
    <div data-rv className={`${scale ? 'aq-scale' : 'aq-rv d1'} aq-bleed aq-media`}>
      <div className="aq-shot">
        <div className="bar">
          <span>{label}</span>
          <span className="aq-live">{meta}</span>
        </div>
        <div className="imgw">
          <img src={src} alt={alt} loading="lazy" decoding="async" />
        </div>
      </div>
    </div>
  );
}

function PublicLandingPage({ onOpenLogin, onOpenRegister, onOpenLegal }) {
  const [go, setGo] = React.useState(false);
  const [navOn, setNavOn] = React.useState(false);
  const [breadth, setBreadth] = React.useState(null);
  const [charts, setCharts] = React.useState(null);

  useAqReveal();

  React.useEffect(() => {
    if (!document.getElementById('aq-landing-css')) {
      const s = document.createElement('style'); s.id = 'aq-landing-css'; s.textContent = AQ_LANDING_CSS; document.head.appendChild(s);
      const f = document.createElement('link'); f.rel = 'stylesheet'; f.href = 'https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap'; document.head.appendChild(f);
    }
    const t = setTimeout(() => setGo(true), 80);
    const onScroll = () => setNavOn(window.scrollY > 24);
    onScroll(); window.addEventListener('scroll', onScroll, { passive: true });
    fetch('/api/v1/screener/breadth').then(r => r.ok ? r.json() : null).then(d => d && setBreadth(d)).catch(() => {});
    fetch('/assets/landing/charts.json').then(r => r.ok ? r.json() : null).then(d => d && setCharts(d)).catch(() => {});
    return () => { clearTimeout(t); window.removeEventListener('scroll', onScroll); };
  }, []);

  const scrollTo = id => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  };

  const n50 = breadth?.indices?.find(i => i.symbol === 'NIFTY 50');
  const bs = breadth?.breadth_summary;
  const niftyLine = React.useMemo(() => {
    const c = charts?.['NIFTY 50']; if (!c) return null;
    const pts = c.map(x => x[4]); const W = 560, H = 200, mn = Math.min(...pts), mx = Math.max(...pts);
    const xy = pts.map((p, i) => [(i / (pts.length - 1)) * W, H - ((p - mn) / (mx - mn)) * (H - 16) - 8]);
    const d = xy.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
    return { d, a: `${d}L${W},${H}L0,${H}Z`, first: c[0][0], last: c[c.length - 1][0], chg: ((pts[pts.length - 1] / pts[0]) - 1) * 100 };
  }, [charts]);

  const dateStr = ts => new Date(ts * 1000).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
  const words = [['Precision', 'in', 'Research.'], ['Discipline', 'in', 'Analysis.']];

  const modules = [
    ['breadth', 'Market Breadth'],
    ['screener', 'Screener Tools'],
    ['hps-stocks', 'HPS Stocks'],
    ['hps-selected', 'HPS Selected'],
    ['hps-mr', 'HPS Mean Reversion'],
    ['weekly', 'Weekly Position'],
    ['backtest', 'Strategy Backtest'],
    ['watchlist', 'Watchlist'],
  ];

  return (
    <div className="aq">
      <nav className={`aq-nav ${navOn ? 'on' : ''}`} aria-label="Primary">
        <div className="wrap">
          <a href="#top" className="aq-brand" onClick={e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
            <img src="/assets/alphaquant_favicon.svg" alt="" /> AlphaQuant
          </a>
          <div className="aq-links">
            <a href="#platform" className="ul hide-m" onClick={e => { e.preventDefault(); scrollTo('platform'); }}>Platform</a>
            <a href="#method" className="ul hide-m" onClick={e => { e.preventDefault(); scrollTo('method'); }}>Method</a>
            <a href="#" className="ul" onClick={e => { e.preventDefault(); onOpenLogin(); }}>Login</a>
            <button className="aq-btn solid sm" onClick={onOpenRegister}>Request Access</button>
          </div>
        </div>
      </nav>

      <header id="top" className={`aq-hero ${go ? 'go' : ''}`}>
        <div className="wrap">
          <div>
            <svg className="aq-mark" viewBox="0 0 44 44" fill="none" aria-hidden="true">
              <path d="M6 36 L18 12 L26 26 L32 18 L38 36" stroke="#E8E6E1" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" />
            </svg>
            <h1 className="serif">
              {words.map((line, li) => (
                <span key={li} style={{ display: 'block' }}>
                  {line.map((w, wi) => (
                    <span key={wi} className="w">
                      <span style={{ transitionDelay: `${0.35 + (li * 3 + wi) * 0.06}s` }}>{wi === 1 ? <em>{w}</em> : w}</span>{wi < line.length - 1 ? '\u00a0' : ''}
                    </span>
                  ))}
                </span>
              ))}
            </h1>
            <p className="sub aq-fade" style={{ transitionDelay: '.9s' }}>Quantitative Research · Market Intelligence · Systematic Strategies</p>
            <div className="ctas aq-fade" style={{ transitionDelay: '1.05s' }}>
              <button className="aq-btn solid" onClick={onOpenRegister}>Request Access <span className="arr">→</span></button>
              <button className="aq-btn line" onClick={() => scrollTo('platform')}>Explore Platform</button>
            </div>
          </div>

          <div className="aq-chartpanel aq-fade" style={{ transitionDelay: '.6s' }}>
            <div className="head">
              <div>
                <div className="eyebrow">Nifty 50</div>
                <div className="px mono">{n50 ? aqFmt(n50.ltp) : <span style={{ color: '#5A606A' }}>—</span>}
                  {n50 && <span className={`mono ${n50.change_pct >= 0 ? 'up' : 'dn'}`} style={{ fontSize: 14, marginLeft: 10 }}>{aqPct(n50.change_pct)}</span>}
                </div>
              </div>
              <span className="eyebrow aq-live">{breadth?.candle_time || 'NSE Feed'}</span>
            </div>
            <svg className="aq-line" viewBox="0 0 560 200" preserveAspectRatio="none" style={{ width: '100%', height: 200, display: 'block' }} aria-label="Nifty 50 daily close">
              {niftyLine && <>
                <defs><linearGradient id="aqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="#E8E6E1" stopOpacity=".07" /><stop offset="1" stopColor="#E8E6E1" stopOpacity="0" /></linearGradient></defs>
                <path className="a" d={niftyLine.a} fill="url(#aqg)" />
                <path className="l" d={niftyLine.d} fill="none" stroke="#E8E6E1" strokeWidth="1.2" vectorEffect="non-scaling-stroke" />
              </>}
            </svg>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 10, fontSize: 11, color: '#5A606A' }} className="mono">
              <span>{niftyLine ? dateStr(niftyLine.first) : ''}</span>
              <span>{niftyLine ? `Daily close · ${aqPct(niftyLine.chg)}` : ''}</span>
              <span>{niftyLine ? dateStr(niftyLine.last) : ''}</span>
            </div>
            {bs && <div style={{ marginTop: 22 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12 }} className="mono">
                <span className="up">{bs.advances} advancing</span><span style={{ color: '#5A606A' }}>{bs.index_name}</span><span className="dn">{bs.declines} declining</span>
              </div>
              <div className="aq-adbar"><i style={{ width: `${bs.advances_pct}%`, background: '#3ECF7D' }} /><i style={{ width: `${bs.unchanged_pct}%`, background: '#5A606A' }} /><i style={{ width: `${bs.declines_pct}%`, background: '#E5675B' }} /></div>
            </div>}
          </div>
        </div>
      </header>

      <section className="aq-index" aria-label="Platform Modules">
        <div className="wrap">
          <ol>
            {modules.map(([id, t], i) => (
              <li key={id}><a href={`#${id}`} onClick={e => { e.preventDefault(); scrollTo(id); }}><span className="n">0{i + 1}</span>{t}</a></li>
            ))}
          </ol>
        </div>
      </section>

      <div id="platform" />

      {/* 01 MARKET BREADTH */}
      <section id="breadth" className="aq-sec">
        <div className="wrap">
          <div className="aq-head-split">
            <div>
              <div data-rv className="aq-rv"><span className="eyebrow">01 · Market Breadth</span></div>
              <h2 data-rv className="aq-rv d1 serif">The whole market,<br />before the first trade.</h2>
            </div>
            <p data-rv className="aq-rv d2 lede">Live Today-in-Brief summary, Nifty 500 and F&amp;O advance/decline ratios, 24-sector performance heat map, and one-click constituent drilldowns.</p>
          </div>
          <div style={{ marginTop: 48 }}>
            <AqShot
              src="/assets/landing/01_market_breadth.png"
              alt="AlphaQuant Market Breadth Analyser showing Today in Brief, 24-Sector Performance Heat Map and constituent stocks"
              label="Market Breadth Analyser"
              meta="24 Sectors · Live Feed"
              scale
            />
          </div>
        </div>
      </section>

      {/* 02 SCREENER TOOLS */}
      <section id="screener" className="aq-sec">
        <div className="wrap">
          <div className="aq-head-split">
            <div>

            src="/assets/landing/03_hps_stocks.png"

              <li><b>Segments</b><span>Switch cleanly between Nifty 500 and Nifty F&amp;O universes</span></li>
            </ul>
          </div>
        </div>
      </section>

      <section id="hps-mr" className="aq-sec">
        <div className="wrap">
          <div className="aq-head-split">

              meta="Level-1 · Level-2 · Level-3"
              scale

      <section id="weekly" className="aq-sec">
        <div className="wrap aq-split-lr">
          <div>
            <div data-rv className="aq-rv"><span className="eyebrow">06 · Weekly Position</span></div>
            <h2 data-rv className="aq-rv d1 serif">One candle sets<br />the week.</h2>
            <p data-rv className="aq-rv d2 lede">A rule-based Nifty 50 positional framework anchored on Tuesday's first hour, with automated Telegram alerts.</p>
            <ol className="aq-wsteps aq-rv d3" data-rv>
              <li><span><b>Reference.</b> Tuesday's 09:15–10:15 candle marks the range. When Tuesday is an NSE holiday, Monday's first hour is used automatically.</span></li>
              <li><span><b>Trigger.</b> The first subsequent hourly close outside the range establishes direction.</span></li>
              <li><span><b>Entry Alert.</b> A break of the trigger candle's high or low fires a Telegram alert.</span></li>
              <li><span><b>Exit Alert.</b> A break of the opposite side of the reference range signals exit.</span></li>
            </ol>
          </div>
          <AqShot
            src="/assets/landing/06_weekly_position.png?v=2"
            alt="AlphaQuant Weekly Position Nifty 50 1-Hour Price and Trigger Levels chart with Entry Alert, Exit Alert and Recent Cycles"

            meta="Tuesday 09:15 · Monday if Holiday"

          <AqShot
            src="/assets/landing/08_watchlist.png"

            meta="Sector · Nifty 50 · Nifty 500"

              <li><b>Benchmarks</b><span>Relative Strength vs Sector, Nifty 50 and Nifty 500</span></li>

              <li><b>Organization</b><span>Automatic sector grouping with live LTP, volume and 52W levels</span></li>
            </ul>
          </div>
        </div>
      </section>

      {/* METHOD */}
      <section id="method" className="aq-sec">
        <div className="wrap">
          <div data-rv className="aq-rv"><span className="eyebrow">Method</span></div>
          <h2 data-rv className="aq-rv d1 serif" style={{ maxWidth: 760 }}>A research platform. Not a broker.</h2>
          <div className="aq-method">
            <div data-rv className="aq-rv d1"><h4 className="serif">Rules first</h4><p>Every scan follows a written, repeatable definition. Nothing is discretionary or hidden.</p></div>
            <div data-rv className="aq-rv d2"><h4 className="serif">Data you can verify</h4><p>Prices, breadth and historical simulations are presented with clear timestamps and assumptions.</p></div>
            <div data-rv className="aq-rv d3"><h4 className="serif">You decide</h4><p>AlphaQuant surfaces candidates and monitors structure. It does not place trades or give investment advice.</p></div>
          </div>
        </div>
      </section>

      <section className="aq-close">
        <div className="wrap">
          <h2 data-rv className="aq-rv serif">Access is reviewed<br /><em style={{ color: '#8A8F98' }}>individually.</em></h2>
          <div data-rv className="aq-rv d1" style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
            <button className="aq-btn solid" onClick={onOpenRegister}>Request Access <span className="arr">→</span></button>
            <button className="aq-btn line" onClick={onOpenLogin}>Login</button>

      <footer className="aq-foot">

      <div className={`aq-mcta ${navOn ? 'on' : ''}`}>
        <button className="aq-btn line" onClick={onOpenLogin}>Login</button>
        <button className="aq-btn solid" onClick={onOpenRegister}>Request Access</button>
