  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const api = axios.create({ baseURL: '/api/v1' });
    api.interceptors.request.use((cfg) => {
      const token = localStorage.getItem('alphaquant_token');
      if (token) cfg.headers.Authorization = `Bearer ${token}`;
      return cfg;
    });
    // Expired or invalid session: clear stale credentials and return to sign-in
    api.interceptors.response.use(
      (res) => res,
      (err) => {
        const status = err.response?.status;
        const url = err.config?.url || '';
        if (status === 401 && !url.includes('/auth/login') && localStorage.getItem('alphaquant_token')) {
          localStorage.removeItem('alphaquant_token');
          localStorage.removeItem('alphaquant_user');
          window.location.reload();
        }
        return Promise.reject(err);
      }
    );

    const formatPrice = (val) => Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const formatVolShort = (val) => {
      const num = Number(val);
      if (num >= 10000000) return (num / 10000000).toFixed(2) + ' Cr';
      if (num >= 100000) return (num / 100000).toFixed(2) + ' L';
      if (num >= 1000) return (num / 1000).toFixed(1) + ' K';
      return num.toLocaleString('en-IN');
    };

    function Sparkline({ isBull, points = [30, 28, 35, 32, 40, 38, 48, 45, 55, 52, 60] }) {
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = max - min || 1;
      const height = 20;
      const width = 56;
      const step = width / (points.length - 1);
      
      const polyPoints = points.map((p, idx) => {
        const x = idx * step;
        const y = height - ((p - min) / range) * (height - 4) - 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const strokeColor = isBull ? '#10B981' : '#F43F5E';
      return (
        <svg width={width} height={height} className="overflow-visible opacity-90 inline-block">
          <polyline
            fill="none"
            stroke={strokeColor}
            strokeWidth="1.5"
            strokeLinecap="round"
            strokeLinejoin="round"
            points={polyPoints}
          />
        </svg>
      );
    }

        // =========================================================================
    // ALPHAQUANT BRAND LOGO SYSTEM (INSTITUTIONAL QUANTITATIVE IDENTITY)
    // =========================================================================

    /**
     * Standalone Animated AlphaQuant Vector Emblem
     * Supports animated line-drawing, glow flares, sizing, and theme variants
     */
    function AlphaQuantSymbol({ size = 28, animated = false, variant = 'dark', className = '' }) {
      const isLight = variant === 'light';
      return (
        <svg
          viewBox="0 0 64 64"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          style={{ width: size, height: size }}
          className={`shrink-0 overflow-visible select-none aq-animated-vector ${className}`}
        >

    /**
     * Professional Cinematic Intro Animation Component
     * Runs once per browser session with smooth sequential line drawing and progressive content reveal.
     */
    function BrandEntrySplash({ onComplete }) {
      const [stage, setStage] = useState(1); // 1: Background & Start, 2: Wordmark/Tagline, 3: Fade out

      useEffect(() => {
        // Stage 1: Pennant animation runs for 2.2s
        const t1 = setTimeout(() => setStage(2), 1600);
        // Stage 2: Fade out overlay cleanly into dashboard at 2700ms
        const t2 = setTimeout(() => setStage(3), 2700);
        // Unmount callback at 3200ms
        const t3 = setTimeout(() => {
          if (onComplete) onComplete();
        }, 3200);

        return () => {
          clearTimeout(t1);
          clearTimeout(t2);
          clearTimeout(t3);
        };
      }, [onComplete]);

      return (
        <div 
          className={`fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-[#070A10] pointer-events-none select-none transition-opacity duration-700 ease-out ${
            stage === 3 ? 'opacity-0' : 'opacity-100'
          }`}
          style={{ willChange: 'opacity' }}
        >
          {/* Subtle Ambient Radial Glow */}
          <div className="absolute w-[560px] h-[560px] rounded-full bg-blue-600/[0.10] blur-[120px] pointer-events-none animate-pulse"></div>

          <div className="relative z-10 flex flex-col items-center">
            {/* Bullish Pennant Pattern with full 5-stage line-drawing animation */}
            <div className="p-5 rounded-2xl bg-[#0B101A]/90 border border-white/[0.08] shadow-[0_12px_40px_rgba(0,0,0,0.7)] backdrop-blur-md mb-5">
              <AlphaQuantSymbol size={80} animated={true} variant="dark" />
            </div>

            {/* Wordmark and Tagline */}
            <div 
              className={`flex flex-col items-center transition-all duration-700 ease-out ${
                stage >= 2 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'
              }`}
            >
              <h1 className="text-2xl font-semibold tracking-tight text-white flex items-center space-x-1.5">
                <span>Alpha</span>
                <span className="font-normal text-slate-400">Quant</span>
              </h1>
            </div>
          </div>
        </div>
      );
    }

    // USER ACCESS MANAGEMENT (ADMIN PANEL)

    function UserAccessManagement({ onBack }) {
      const [tab, setTab] = useState('pending'); // 'pending', 'approved', 'rejected'
      const [requests, setRequests] = useState([]);
      const [summary, setSummary] = useState({ pending_count: 0, approved_count: 0, rejected_count: 0, suspended_count: 0 });
      const [users, setUsers] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [feedback, setFeedback] = useState({ type: '', text: '' });
      const [actionLoading, setActionLoading] = useState(null);

      const fetchAllData = async () => {
        try {
          const [sumRes, reqRes, userRes, logRes] = await Promise.all([
            api.get('/users/access-requests/summary'),
            api.get('/users/access-requests'),
            api.get('/users/'),
            api.get('/users/audit-logs?limit=30')
          ]);
          setSummary(sumRes.data || { pending_count: 0, approved_count: 0, rejected_count: 0, suspended_count: 0 });
          setRequests(reqRes.data || []);
          setUsers(userRes.data || []);
          setAuditLogs(logRes.data || []);
        } catch (e) {
          console.error('Failed to load access management data:', e);
          setFeedback({ type: 'error', text: 'Failed to refresh access requests' });
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchAllData();
        const interval = setInterval(fetchAllData, 10000); // 10s auto-refresh
        return () => clearInterval(interval);
      }, []);

      const handleApprove = async (reqId) => {
        setActionLoading(reqId);
        try {
          const res = await api.post(`/users/access-requests/${reqId}/approve`, { notes: 'Approved via Admin Panel' });
          setFeedback({ type: 'success', text: res.data.message || 'Access approved successfully' });
          fetchAllData();
        } catch (e) {
          setFeedback({ type: 'error', text: e.response?.data?.detail || 'Failed to approve request' });
        } finally {
          setActionLoading(null);
        }
      };

      const handleReject = async (reqId) => {
        if (!confirm('Are you sure you want to decline this applicant?')) return;
        setActionLoading(reqId);
        try {
          const res = await api.post(`/users/access-requests/${reqId}/reject`, { notes: 'Declined by Administrator' });
          setFeedback({ type: 'success', text: res.data.message || 'Access request rejected' });
          fetchAllData();
        } catch (e) {
          setFeedback({ type: 'error', text: e.response?.data?.detail || 'Failed to reject request' });
        } finally {
          setActionLoading(null);
        }
      };

      const handleSuspendUser = async (userId, username) => {
        if (!confirm(`Are you sure you want to suspend access for ${username}? This immediately revokes their session.`)) return;
        setActionLoading(`suspend-${userId}`);
        try {
          const res = await api.post(`/users/${userId}/suspend`);
          setFeedback({ type: 'success', text: res.data.message || `User ${username} suspended.` });

          setFeedback({ type: 'error', text: e.response?.data?.detail || 'Failed to suspend user' });
        } finally {
          setActionLoading(null);
        }

        setActionLoading(`reinstate-${userId}`);
        try {
          const res = await api.post(`/users/${userId}/reinstate`);
          setFeedback({ type: 'success', text: res.data.message || `User ${username} reinstated.` });
          fetchAllData();

          setFeedback({ type: 'error', text: e.response?.data?.detail || 'Failed to reinstate user' });

          setActionLoading(null);

    function AuthModalView({ initialMode = 'login', isOpen, onClose, onLoginSuccess, onOpenLegal }) {

      // Registration form states
      const [fullName, setFullName] = useState('');

      const [phone, setPhone] = useState('');

      const [regLoading, setRegLoading] = useState(false);
      const [regError, setRegError] = useState('');
      const [registeredUserSummary, setRegisteredUserSummary] = useState(null);

      useEffect(() => {
        setMode(initialMode);
        setLoginError('');
        setLoginStatusAlert(null);
        setRegError('');
      }, [initialMode, isOpen]);

      if (!isOpen) return null;

      // Password strength calculation
      const getPasswordStrength = (pwd) => {
        if (!pwd) return { score: 0, text: 'Empty', color: 'bg-slate-700' };
        let score = 0;
        if (pwd.length >= 8) score += 1;
        if (/[A-Z]/.test(pwd)) score += 1;
        if (/[0-9]/.test(pwd)) score += 1;
        if (/[^a-zA-Z0-9]/.test(pwd)) score += 1;
        if (score <= 1) return { score: 1, text: 'Weak', color: 'bg-rose-500' };
        if (score === 2) return { score: 2, text: 'Fair', color: 'bg-amber-500' };
        if (score === 3) return { score: 3, text: 'Good', color: 'bg-sky-400' };
        return { score: 4, text: 'Strong', color: 'bg-emerald-400' };
      };

      const strength = getPasswordStrength(regPassword);

        e.preventDefault();
        setLoginError('');
        setLoginStatusAlert(null);
        setLoginLoading(true);

          const res = await api.post('/auth/login', {
            username: loginIdent.trim(),
            password: loginPwd
          });
          if (res.data && res.data.access_token) {
            onLoginSuccess(
              { username: res.data.username, role: res.data.role },
              res.data.access_token
            );
            onClose();
          }
        } catch (err) {
          const status = err.response?.status;
          const detail = err.response?.data?.detail || 'Authentication failed';
          
          if (status === 403) {
            // Check for specific account status keyword
            if (detail.includes('under review')) {
              setLoginStatusAlert({
                type: 'pending',
                title: 'Access Request Under Review',
                message: detail

            } else if (detail.includes('declined') || detail.includes('rejected')) {
              setLoginStatusAlert({
                type: 'rejected',
                title: 'Application Not Approved',
                message: detail
              });
            } else {
              setLoginStatusAlert({
                type: 'suspended',
                title: 'Account Suspended',
                message: detail
              });
            }
          } else {
            setLoginError(detail);
          }
        } finally {
          setLoginLoading(false);
        }

      const handleRegisterSubmit = async (e) => {

    // ----------------- FEATURE 2: TERMINAL SCREENER TOOLS ----------------- //
    function TerminalScreener({ onSelectStock }) {
      const [stocks, setStocks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [universe, setUniverse] = useState('NIFTY50');
      const [search, setSearch] = useState('');
      const [filterTab, setFilterTab] = useState('ALL');
      const [sortCol, setSortCol] = useState('change_pct');
      const [sortDir, setSortDir] = useState('desc');

      const fetchQuotes = async (isManual = false) => {
        if (isManual) setRefreshing(true);
        try {
          const res = await api.get(`/screener/results?universe=${universe}`);
          setStocks(res.data);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      const scanNow = async () => {
        setRefreshing(true);
        try {
          const res = await api.post(`/screener/scan?universe=${universe}`);
          setStocks(res.data);
        } catch (e) {
          console.error(e);
        } finally {
          setRefreshing(false);
        }
      };

      useEffect(() => {
        fetchQuotes();
        const t = setInterval(fetchQuotes, 15000);
        return () => clearInterval(t);
      }, [universe]);

      const handleSort = (col) => {
        if (sortCol === col) {
          setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        } else {
          setSortCol(col);
          setSortDir('desc');
        }
      };

      const processedData = useMemo(() => {
        let list = stocks.filter(s => {
          const q = search.trim().toLowerCase();
          const matches = !q || s.symbol.toLowerCase().includes(q) || s.name.toLowerCase().includes(q);
          if (!matches) return false;
          if (filterTab === 'GAINERS') return s.change_pct > 0;
          if (filterTab === 'LOSERS') return s.change_pct < 0;
          if (filterTab === 'VOL_SURGE') return s.volume_surge_x >= 1.5;
          if (filterTab === 'BULL_MOMENTUM') return s.rsi >= 60;
          if (filterTab === 'OVERSOLD') return s.rsi <= 40;
          return true;
        });

        list.sort((a, b) => {
          let vA = a[sortCol];
          let vB = b[sortCol];
          if (typeof vA === 'string') return sortDir === 'asc' ? vA.localeCompare(vB) : vB.localeCompare(vA);
          return sortDir === 'asc' ? vA - vB : vB - vA;
        });

        return list;
      }, [stocks, search, filterTab, sortCol, sortDir]);

      return (
        <section className="pt-2">
          {/* Section Header */}
          <div className="flex items-center space-x-3 pb-3 border-b border-[#1A2538] mb-4">

              {universe}
            </span>
            <span className="text-xs text-slate-500 font-mono">
              {processedData.length} symbols matched
            </span>
          </div>

          {/* Split Two-Column: Left Tools Sidebar + Right Data Table */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            {/* Left Sidebar: Screener Controls & Filter Tools */}
            <aside className="lg:col-span-3 bg-[#0E1524] border border-[#1A2538] rounded-xl p-4 space-y-5 shadow-sm">
              <div className="border-b border-[#1A2538] pb-3">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Screener Tools</h3>
                <p className="text-[11px] text-slate-500 mt-0.5">Parameters & Strategy Filters</p>
              </div>

              {/* 1. Universe Selection */}
              <div className="space-y-1.5">
                <label className="text-[11px] font-semibold text-slate-300 uppercase tracking-wide">
                  Universe
                </label>
                <select
                  value={universe}
                  onChange={(e) => setUniverse(e.target.value)}
                  className="w-full bg-[#101726] border border-[#223049] text-slate-200 text-xs rounded-lg px-3 py-2 font-medium focus:outline-none focus:border-blue-500"
                >
                  <option value="NIFTY50">NSE: NIFTY 50 Benchmark</option>
                  <option value="BANKNIFTY">NSE: BANK NIFTY (Banking)</option>
                </select>
              </div>

              {/* 2. Execute Scan Button */}
              <div>
                <button
                  onClick={scanNow}
                  disabled={refreshing}
                  className="w-full flex items-center justify-center space-x-2 px-3.5 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-semibold rounded-lg text-xs transition-all shadow-md shadow-blue-600/20"
                >
                  <span className={`text-[12px] ${refreshing ? 'animate-spin inline-block' : ''}`}>↻</span>
                  <span>{refreshing ? 'Scanning Pipeline...' : 'Run Screener Scan'}</span>
                </button>
              </div>

              {/* 3. Search Instrument */}
              <div className="space-y-1.5">
                <label className="text-[11px] font-semibold text-slate-300 uppercase tracking-wide">
                  Search Symbol
                </label>
                <div className="relative">
                  <input
                    type="text"
                    placeholder="E.g. RELIANCE, TCS..."
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    className="w-full bg-[#101726] border border-[#1E293B] rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 font-mono"

                  {search && (

                      className="absolute right-2.5 top-2 text-slate-500 hover:text-slate-300 text-xs"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>

              {/* 4. Strategy Filter Presets */}
              <div className="space-y-2">
                <label className="text-[11px] font-semibold text-slate-300 uppercase tracking-wide">
                  Strategy Filter
                </label>
                <div className="space-y-1">
                  {[
                    { id: 'ALL', label: 'All Equities', count: stocks.length },
                    { id: 'GAINERS', label: 'Gainers Only', count: stocks.filter(s => s.change_pct > 0).length },
                    { id: 'LOSERS', label: 'Decliners Only', count: stocks.filter(s => s.change_pct < 0).length },
                    { id: 'VOL_SURGE', label: 'Volume Breakouts (>1.5x)', count: stocks.filter(s => s.volume_surge_x >= 1.5).length },
                    { id: 'BULL_MOMENTUM', label: 'Bullish RSI (>60)', count: stocks.filter(s => s.rsi >= 60).length },
                    { id: 'OVERSOLD', label: 'Oversold RSI (<40)', count: stocks.filter(s => s.rsi <= 40).length }
                  ].map(t => {
                    const isSelected = filterTab === t.id;
                    return (
                      <button
                        key={t.id}
                        onClick={() => setFilterTab(t.id)}
                        className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-all ${
                          isSelected
                            ? 'bg-blue-600 text-white font-semibold shadow-sm'
                            : 'bg-[#101726] text-slate-400 hover:text-slate-200 hover:bg-[#152033] border border-[#1A2538]'
                        }`}
                      >
                        <span>{t.label}</span>
                        <span className={`text-[10px] font-mono px-1.5 py-0.2 rounded ${
                          isSelected ? 'bg-white/20 text-white' : 'bg-[#182338] text-slate-400'
                        }`}>
                          {t.count}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 5. Tool Info Card */}
              <div className="p-3 bg-[#0A0E17] border border-[#1A2538] rounded-lg text-[11px] space-y-1 text-slate-400">
                <div className="flex items-center justify-between text-slate-300 font-semibold">
                  <span>Feed Status</span>
                  <span className="text-emerald-400 font-mono">LIVE 15s</span>
                </div>
                <div>Automated periodic refresh running. Click symbol row to inspect candle metrics.</div>
              </div>
            </aside>

            {/* Right Main Table: Screener Results */}
            <div className="lg:col-span-9 bg-[#0E1524] border border-[#1C273C] rounded-xl overflow-hidden shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs tabular-nums border-collapse">
                  <thead className="bg-[#090E18] text-slate-400 uppercase font-mono text-[10px] tracking-wider border-b border-[#1C273C]">
                    <tr>
                      <th className="py-3 px-3.5 cursor-pointer hover:text-white" onClick={() => handleSort('symbol')}>
                        Instrument {sortCol === 'symbol' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('ltp')}>
                        LTP (₹) {sortCol === 'ltp' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('change_pct')}>
                        Chg % {sortCol === 'change_pct' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-center">Trend (Intraday)</th>
                      <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('high')}>
                        Day High / Low
                      </th>
                      <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('volume')}>
                        Volume {sortCol === 'volume' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-center cursor-pointer hover:text-white" onClick={() => handleSort('volume_surge_x')}>
                        Vol Spike {sortCol === 'volume_surge_x' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-center cursor-pointer hover:text-white" onClick={() => handleSort('rsi')}>
                        RSI (14) {sortCol === 'rsi' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3.5">Triggered Signal</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#162133]">
                    {loading ? (
                      <tr>
                        <td colSpan={9} className="py-12 text-center text-slate-500 font-mono text-xs">
                          Loading market feed...
                        </td>
                      </tr>
                    ) : processedData.length === 0 ? (
                      <tr>
                        <td colSpan={9} className="py-12 text-center text-slate-500 font-mono text-xs">
                          No symbols matched the selected filter criteria.
                        </td>
                      </tr>
                    ) : (
                      processedData.map((s, idx) => {
                        const isBull = s.change_pct >= 0;
                        return (
                          <tr 
                            key={s.symbol} 
                            onClick={() => onSelectStock(s)}
                            className={`hover:bg-[#151F33] transition-colors cursor-pointer group ${
                              idx % 2 === 0 ? 'bg-[#0E1524]' : 'bg-[#0B111D]'
                            }`}
                          >
                            <td className="py-2.5 px-3.5">
                              <div className="font-semibold text-white tracking-wide text-xs">{s.symbol}</div>
                              <div className="text-[10px] text-slate-400 truncate max-w-[170px]">{s.name}</div>
                            </td>

                            <td className="py-2.5 px-3 text-right font-mono font-semibold text-white text-xs">
                              ₹{formatPrice(s.ltp)}
                            </td>

                            <td className="py-2.5 px-3 text-right font-mono font-semibold text-xs">
                              <span className={isBull ? 'text-emerald-400' : 'text-rose-400'}>
                                {isBull ? `+${s.change_pct.toFixed(2)}%` : `${s.change_pct.toFixed(2)}%`}
                              </span>
                            </td>

                            <td className="py-2.5 px-3 text-center">
                              <Sparkline isBull={isBull} points={isBull ? [20, 22, 28, 25, 34, 30, 42, 40, 52] : [55, 50, 48, 52, 40, 42, 35, 30, 22]} />
                            </td>

                            <td className="py-2.5 px-3 text-right font-mono text-[11px] text-slate-300 leading-tight">
                              <div>H: ₹{formatPrice(s.high)}</div>
                              <div className="text-slate-500 text-[10px]">L: ₹{formatPrice(s.low)}</div>
                            </td>

                            <td className="py-2.5 px-3 text-right font-mono text-slate-300 text-xs">
                              {formatVolShort(s.volume)}
                            </td>

                            <td className="py-2.5 px-3 text-center font-mono text-xs">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-semibold ${
                                s.volume_surge_x >= 1.5
                                  ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30'
                                  : 'text-slate-400'
                              }`}>
                                {s.volume_surge_x}x
                              </span>
                            </td>

                            <td className="py-2.5 px-3 text-center font-mono text-xs">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-semibold ${
                                s.rsi >= 60 ? 'text-emerald-400' : s.rsi <= 40 ? 'text-blue-400' : 'text-slate-300'
                              }`}>
                                {s.rsi}
                              </span>
                            </td>

                            <td className="py-2.5 px-3.5">
                              <div className="flex flex-wrap gap-1">
                                {s.triggered_criteria?.map((c, i) => (
                                  <span key={i} className="text-[10px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-300 border border-slate-700 font-medium">
                                    {c}
                                  </span>
                                ))}
                              </div>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ----------------- FEATURE 3: HPS STOCKS (HIGH PROBABILITY SCREENER) ----------------- //
    function HpsScreenerSection({ onSelectStock }) {
      const [universe, setUniverse] = useState('nifty500'); // 'nifty500' or 'fo'
      const [activeTimeframe, setActiveTimeframe] = useState('daily'); // '4h', 'daily', 'weekly', 'monthly'
      const [dataByTimeframe, setDataByTimeframe] = useState({ '4h': [], 'daily': [], 'weekly': [], 'monthly': [] });
      const [counts, setCounts] = useState({ '4h': 0, 'daily': 0, 'weekly': 0, 'monthly': 0 });
      const [lastUpdated, setLastUpdated] = useState('');
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [breakoutFilter, setBreakoutFilter] = useState('ALL'); // 'ALL', 'BROKEN_ABOVE', 'BROKEN_BELOW'
      const [sortField, setSortField] = useState('spread'); // 'symbol', 'name', 'ltp', 'spread', 'adx'
      const [sortAsc, setSortAsc] = useState(false);
      const [copiedSymbol, setCopiedSymbol] = useState(null);
      const [exportSuccess, setExportSuccess] = useState(false);

      const fetchHpsData = async () => {
        setLoading(true);
        try {
          const res = await api.get(`/screener/hps?timeframe=all&universe=${universe}`);
          if (res.data && res.data.status === 'success') {
            setDataByTimeframe(res.data.data || {});
            setCounts(res.data.counts || {});
            setLastUpdated(res.data.last_updated || 'Updated recently');
          }
        } catch (e) {
          console.error("Failed to load HPS stock screener data:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchHpsData();
        const intervalId = setInterval(fetchHpsData, 10000);
        return () => clearInterval(intervalId);
      }, [universe]);

      const currentList = dataByTimeframe[activeTimeframe] || [];
      const bullishCount = currentList.filter(s => s.status === 'BROKEN_ABOVE').length;
      const bearishCount = currentList.filter(s => s.status === 'BROKEN_BELOW').length;

      const filteredList = useMemo(() => {
        const result = currentList.filter(stk => {
          const matchesSearch = !searchQuery || 
            stk.symbol.toLowerCase().includes(searchQuery.toLowerCase()) || 
            (stk.name && stk.name.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (stk.industry && stk.industry.toLowerCase().includes(searchQuery.toLowerCase()));
          
          if (!matchesSearch) return false;
          if (breakoutFilter === 'BROKEN_ABOVE') return stk.status === 'BROKEN_ABOVE';
          if (breakoutFilter === 'BROKEN_BELOW') return stk.status === 'BROKEN_BELOW';
          return true;
        });

        return result.sort((a, b) => {
          let valA, valB;
          if (sortField === 'symbol') {
            valA = a.symbol || ''; valB = b.symbol || '';
            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
          } else if (sortField === 'name') {
            valA = a.name || ''; valB = b.name || '';
            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
          } else if (sortField === 'ltp') {
            valA = Number(a.ltp || 0); valB = Number(b.ltp || 0);
          } else if (sortField === 'adx') {
            valA = Number(a.adx || 0); valB = Number(b.adx || 0);
          } else {
            valA = Number(a.diff_pct != null ? a.diff_pct : a.spread_pct || 0);
            valB = Number(b.diff_pct != null ? b.diff_pct : b.spread_pct || 0);
          }
          return sortAsc ? valA - valB : valB - valA;
        });
      }, [currentList, searchQuery, breakoutFilter, sortField, sortAsc]);

      const toggleSort = (field) => {
        if (sortField === field) {
          setSortAsc(!sortAsc);
        } else {
          setSortField(field);
          setSortAsc(false);
        }
      };

      const handleCopySymbol = (e, sym) => {
        e.stopPropagation();
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(sym).then(() => {
          setCopiedSymbol(sym);
          setTimeout(() => setCopiedSymbol(null), 1500);
        });
      };

      const handleExportCSV = () => {
        if (!filteredList || filteredList.length === 0) return;
        const headers = ['Symbol', 'Company Name', 'Sector', 'LTP (INR)', 'Spread (%)', 'ADX (14)', 'Timeframe', 'Breakout Signal', 'Segment'];
        const rows = filteredList.map(stk => [
          `"${stk.symbol || ''}"`,
          `"${(stk.name || '').replace(/"/g, '""')}"`,
          `"${(stk.industry || '').replace(/"/g, '""')}"`,
          stk.ltp != null ? stk.ltp : '',
          stk.diff_pct != null ? stk.diff_pct : (stk.spread_pct != null ? stk.spread_pct : ''),
          stk.adx != null ? stk.adx : '',
          `"${stk.timeframe || activeTimeframe.toUpperCase()}"`,
          `"${stk.status === 'BROKEN_ABOVE' ? 'Bullish Breakout' : 'Bearish Breakdown'}"`,
          `"${stk.is_fo ? 'NIFTY F&O' : 'Cash (EQ)'}"`
        ]);
        const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `HPS_Stocks_${universe}_${activeTimeframe}_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setExportSuccess(true);
        setTimeout(() => setExportSuccess(false), 2400);
      };

      const timeframes = [
        { id: '4h', label: '4-Hour', badge: '4H', desc: 'Intraday Swing Structure' },
        { id: 'daily', label: 'Daily', badge: '1D', desc: 'Session Trend Breakout' },
        { id: 'weekly', label: 'Weekly', badge: '1W', desc: 'Multi-Day Positional Bias' },
        { id: 'monthly', label: 'Monthly', badge: '1M', desc: 'Macro Institutional Cycle' }
      ];

      return (
        <section className="space-y-6 max-w-7xl mx-auto py-2 px-1 font-sans apple-page-view">
          {/* Header Section */}
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-5 pb-6 border-b border-white/[0.08]">
            <div className="space-y-2">
              <div className="flex items-center space-x-2.5">
                <span className="inline-flex items-center justify-center w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.7)] animate-pulse"></span>
                <span className="text-[11px] font-mono uppercase tracking-widest text-cyan-400 font-semibold">
                  Institutional Breakout Architecture
                </span>
                <span className="text-slate-600">·</span>
                <span className="text-[11px] font-mono text-slate-400">{lastUpdated || 'Live Terminal'}</span>
              </div>
              <h1 className="text-3xl sm:text-4xl font-semibold tracking-tight text-white">
                HPS Stocks
              </h1>
              <p className="text-xs sm:text-sm text-slate-400 max-w-2xl font-normal leading-relaxed">
                Multi-Timeframe Breakout Tracker monitoring structural price pivots across key time horizons with live Dhan and TradingView feeds.
              </p>
            </div>

            {/* Universe Segmented Control */}
            <div className="flex items-center bg-[#070B12]/80 backdrop-blur-md p-1 rounded-xl border border-white/[0.07] shrink-0 self-start md:self-end">
              <button
                type="button"
                onClick={() => setUniverse('nifty500')}
                className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-medium transition-all ${
                  universe === 'nifty500'
                    ? 'bg-white/[0.1] text-white shadow-sm border border-white/[0.12]'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>NIFTY 500</span>
                <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded ${
                  universe === 'nifty500' ? 'bg-cyan-500/20 text-cyan-300' : 'bg-white/[0.05] text-slate-500'
                }`}>500</span>
              </button>
              <button
                type="button"
                onClick={() => setUniverse('fo')}
                className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-medium transition-all ${
                  universe === 'fo'
                    ? 'bg-white/[0.1] text-white shadow-sm border border-white/[0.12]'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>NIFTY F&O</span>
                <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded ${
                  universe === 'fo' ? 'bg-purple-500/20 text-purple-300' : 'bg-white/[0.05] text-slate-500'
                }`}>213</span>
              </button>
            </div>
          </div>

          {/* Timeframe Selection Cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            {timeframes.map(tf => {
              const isSelected = activeTimeframe === tf.id;
              const count = counts[tf.id] || 0;
              return (
                <button
                  key={tf.id}
                  type="button"
                  onClick={() => setActiveTimeframe(tf.id)}
                  className={`group relative p-4 rounded-2xl border text-left transition-all duration-300 ${
                    isSelected
                      ? 'bg-gradient-to-b from-[#111A2B] to-[#0B111D] border-cyan-500/40 shadow-[0_8px_24px_-6px_rgba(6,182,212,0.18)]'
                      : 'bg-[#0B101B]/70 border-white/[0.06] hover:border-white/[0.14] hover:bg-[#0E1524]'
                  }`}
                >
                  <div className="flex items-center justify-between mb-2">
                    <span className="inline-flex items-center space-x-1.5">
                      <span className={`w-1.5 h-1.5 rounded-full transition-colors ${
                        isSelected ? 'bg-cyan-400' : 'bg-slate-600 group-hover:bg-slate-400'
                      }`}></span>
                      <span className={`text-xs font-semibold tracking-wide uppercase font-mono ${
                        isSelected ? 'text-white' : 'text-slate-300'
                      }`}>
                        {tf.label}
                      </span>
                    </span>
                    <span className={`text-xs font-mono font-bold px-2 py-0.5 rounded-md transition-all ${
                      isSelected
                        ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'
                        : 'bg-white/[0.04] text-slate-400 border border-white/[0.05]'
                    }`}>
                      {count}
                    </span>
                  </div>
                  <div className="text-[11px] text-slate-400 font-normal leading-relaxed truncate">
                    {tf.desc}
                  </div>
                  {isSelected && (
                    <div className="absolute bottom-0 left-6 right-6 h-[2px] bg-gradient-to-r from-transparent via-cyan-400 to-transparent"></div>
                  )}
                </button>
              );
            })}
          </div>

          {/* Institutional Toolbar: Search, Signal Filter, Export, Refresh */}
          <div className="bg-[#0B101B]/80 backdrop-blur-md border border-white/[0.07] rounded-2xl p-3 sm:p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
            {/* Search Input */}
            <div className="relative flex-1 max-w-md">
              <span className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-500 text-xs">
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
              </span>
              <input
                type="text"
                placeholder="Search symbol, company, or sector..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="w-full bg-[#070B13] border border-white/[0.08] rounded-xl pl-9 pr-8 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500/60 focus:ring-1 focus:ring-cyan-500/20 font-sans transition-all"
              />
              {searchQuery && (
                <button
                  type="button"
                  onClick={() => setSearchQuery('')}
                  className="absolute inset-y-0 right-2.5 flex items-center text-slate-400 hover:text-white text-xs"
                >
                  ✕
                </button>
              )}
            </div>

            {/* Filter Pills and Actions */}
            <div className="flex flex-wrap items-center gap-2">
              {/* Direction Filter Segment */}
              <div className="flex items-center bg-[#070B13] border border-white/[0.08] p-0.5 rounded-xl text-xs">
                <button
                  type="button"
                  onClick={() => setBreakoutFilter('ALL')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all ${
                    breakoutFilter === 'ALL'
                      ? 'bg-white/[0.12] text-white shadow-sm'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  All ({currentList.length})
                </button>
                <button
                  type="button"
                  onClick={() => setBreakoutFilter('BROKEN_ABOVE')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all flex items-center space-x-1.5 ${
                    breakoutFilter === 'BROKEN_ABOVE'
                      ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                      : 'text-emerald-400/80 hover:text-emerald-300'
                  }`}
                >
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  <span>Bullish ({bullishCount})</span>
                </button>
                <button
                  type="button"
                  onClick={() => setBreakoutFilter('BROKEN_BELOW')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all flex items-center space-x-1.5 ${
                    breakoutFilter === 'BROKEN_BELOW'
                      ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                      : 'text-rose-400/80 hover:text-rose-300'
                  }`}
                >
                  <span className="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
                  <span>Bearish ({bearishCount})</span>
                </button>
              </div>

              {/* Export CSV Button */}
              <button
                type="button"
                onClick={handleExportCSV}
                disabled={loading || filteredList.length === 0}
                className="flex items-center space-x-1.5 px-3.5 py-1.5 bg-white/[0.04] hover:bg-white/[0.08] text-slate-300 hover:text-white text-xs font-medium rounded-xl border border-white/[0.08] transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                title="Export filtered records to CSV"
              >
                <svg className="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>{exportSuccess ? 'Exported!' : 'Export CSV'}</span>
              </button>

              {/* Refresh Button */}
              <button
                type="button"
                onClick={fetchHpsData}
                disabled={loading}
                className="flex items-center space-x-1.5 px-3 py-1.5 bg-white/[0.04] hover:bg-white/[0.08] text-slate-300 hover:text-white text-xs font-medium rounded-xl border border-white/[0.08] transition-all"
                title="Refresh real-time data"
              >
                <span className={`inline-block text-cyan-400 ${loading ? 'animate-spin' : ''}`}>↻</span>
                <span className="hidden sm:inline">Refresh</span>
              </button>
            </div>
          </div>

          {/* Premium Financial Data Table */}
          <div className="bg-[#0B101B]/90 backdrop-blur-md border border-white/[0.08] rounded-2xl overflow-hidden shadow-2xl">
            <div className="overflow-x-auto custom-scrollbar">
              <table className="w-full text-left text-xs font-sans tabular-nums border-collapse">
                <thead>
                  <tr className="border-b border-white/[0.08] bg-[#070C16]/95 text-slate-400 text-[11px] uppercase tracking-wider font-mono font-medium table-blur-header">
                    <th className="py-3.5 px-4 w-12 text-center">#</th>
                    <th 
                      onClick={() => toggleSort('symbol')}
                      className="py-3.5 px-4 cursor-pointer hover:text-white transition-colors select-none"
                    >
                      <div className="flex items-center space-x-1">
                        <span>Symbol</span>
                        {sortField === 'symbol' && <span className="text-cyan-400 font-bold">{sortAsc ? '↑' : '↓'}</span>}
                      </div>
                    </th>
                    <th 
                      onClick={() => toggleSort('name')}
                      className="py-3.5 px-4 cursor-pointer hover:text-white transition-colors select-none"
                    >
                      <div className="flex items-center space-x-1">
                        <span>Company Name</span>

                <tbody className="divide-y divide-white/[0.04]">
                  {loading && filteredList.length === 0 ? (

                        <div className="max-w-md mx-auto space-y-1">
                          <p className="font-medium text-slate-300">No breakout signals detected</p>
                          <p className="text-slate-500 text-[11px]">No stocks currently matching your filters on the {activeTimeframe.toUpperCase()} timeframe in {universe.toUpperCase()}.</p>

                      </td>
                    </tr>
                  ) : (
                    filteredList.map((stk, i) => {
                      const isBull = stk.status === 'BROKEN_ABOVE';
                      const adxVal = Number(stk.adx || 0);
                      const spreadVal = Number(stk.diff_pct != null ? stk.diff_pct : stk.spread_pct || 0);

                      return (

                          className="hover:bg-white/[0.04] cursor-pointer transition-colors group"

                          <td className="py-3.5 px-4 font-mono font-bold text-white text-xs tracking-wide">
                            <div className="flex items-center space-x-2">
                              <span className="group-hover:text-cyan-400 transition-colors">{stk.symbol}</span>
                              <button
                                type="button"
                                onClick={(e) => handleCopySymbol(e, stk.symbol)}

                                className="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-slate-300 text-[10px] transition-opacity p-0.5"
                              >
                                {copiedSymbol === stk.symbol ? '✓' : '⧉'}
                              </button>
                            </div>
                          </td>
                          <td className="py-3.5 px-4 text-slate-300 text-xs truncate max-w-[200px] font-normal">
                            {stk.name}

                          <td className="py-3.5 px-4 text-slate-400 text-[11px] truncate max-w-[150px]">
                            <span className="px-2 py-0.5 rounded-md bg-white/[0.03] border border-white/[0.05] text-slate-300">
                              {stk.industry || 'Equities'}
                            </span>
                          </td>
                          <td className="py-3.5 px-4 text-right font-mono font-semibold text-white text-xs">
                            ₹{Number(stk.ltp || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                          </td>
                          <td className="py-3.5 px-4 text-right font-mono font-semibold text-xs">
                            <span className={`inline-flex items-center space-x-0.5 ${isBull ? 'text-emerald-400' : 'text-rose-400'}`}>
                              <span>{spreadVal >= 0 ? `+${spreadVal.toFixed(2)}%` : `${spreadVal.toFixed(2)}%`}</span>
                            </span>
                          </td>
                          <td className="py-3.5 px-4 text-center">
                            <span className={`font-mono text-[11px] px-2 py-0.5 rounded-md font-semibold ${
                              adxVal >= 30
                                ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30'
                                : adxVal >= 20
                                ? 'bg-white/[0.05] text-slate-300 border border-white/[0.08]'
                                : 'text-slate-500'
                            }`}>
                              {adxVal > 0 ? adxVal.toFixed(1) : '—'}
                            </span>
                          </td>
                          <td className="py-3.5 px-4 text-center">
                            <span className="px-2 py-0.5 rounded text-[10px] font-mono font-semibold bg-white/[0.04] text-slate-300 border border-white/[0.06]">
                              {activeTimeframe.toUpperCase()}
                            </span>

                          <td className="py-3.5 px-4 text-center">
                            <span className={`inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-semibold tracking-wide ${
                              isBull
                                ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/25'
                                : 'bg-rose-500/10 text-rose-400 border border-rose-500/25'
                            }`}>
                              <span className={`w-1 h-1 rounded-full ${isBull ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                              <span>{isBull ? 'Bullish Breakout' : 'Bearish Breakdown'}</span>
                            </span>
                          </td>
                          <td className="py-3.5 px-4 text-center">
                            {stk.is_fo ? (
                              <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-purple-500/15 text-purple-300 border border-purple-500/25">
                                F&O
                              </span>
                            ) : (
                              <span className="px-2 py-0.5 rounded text-[10px] font-mono font-medium bg-white/[0.04] text-slate-400 border border-white/[0.06]">
                                CASH
                              </span>
                            )}
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>

            {/* Table Footer */}
            <div className="p-3.5 border-t border-white/[0.06] bg-[#070C15]/70 flex flex-col sm:flex-row items-center justify-between text-[11px] font-mono text-slate-400 gap-2">
              <div className="flex items-center space-x-2">
                <span>Displaying</span>
                <span className="text-white font-semibold">{filteredList.length}</span>
                <span>qualifying stocks on</span>
                <span className="text-cyan-400 font-semibold">{activeTimeframe.toUpperCase()}</span>
                <span>({universe.toUpperCase()})</span>
              </div>
              <div className="flex items-center space-x-3 text-slate-400">
                <span className="hidden sm:inline">Click any row to inspect deep metrics</span>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ----------------- FEATURE 3B: HPS SELECTED (TOP 10 BY ADX PER TIMEFRAME + SAVED TOP 3 F&O 7-DAY HISTORY) ----------------- //
    function HpsSelectedSection({ onSelectStock }) {
      const [viewMode, setViewMode] = useState('live'); // 'live' (Live Top 10) or 'history' (Saved Top 3 F&O 7-Day History)
      const [universe, setUniverse] = useState('nifty500'); // 'nifty500' or 'fo'
      const [activeTimeframe, setActiveTimeframe] = useState('daily'); // '4h', 'daily', 'weekly', 'monthly'
      const [dataByTimeframe, setDataByTimeframe] = useState({ '4h': [], daily: [], weekly: [], monthly: [] });
      const [totalHpsCounts, setTotalHpsCounts] = useState({ '4h': 0, daily: 0, weekly: 0, monthly: 0 });
      const [lastUpdated, setLastUpdated] = useState('');
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [breakoutFilter, setBreakoutFilter] = useState('ALL'); // 'ALL', 'BROKEN_ABOVE', 'BROKEN_BELOW'
      const [copiedSymbol, setCopiedSymbol] = useState(null);
      const [exportSuccess, setExportSuccess] = useState(false);

      // History state (7-day rolling Top 3 F&O snapshots every 30 mins)
      const [historySnapshots, setHistorySnapshots] = useState([]);
      const [historyDates, setHistoryDates] = useState([]);
      const [selectedDate, setSelectedDate] = useState('ALL');
      const [historyLoading, setHistoryLoading] = useState(false);

      const fetchHpsSelected = async () => {
        try {
          const res = await api.get(`/screener/hps?timeframe=all&universe=${universe}`);
          if (res.data && res.data.status === 'success') {
            setDataByTimeframe(res.data.data || {});
            setTotalHpsCounts(res.data.counts || {});
            setLastUpdated(res.data.last_updated || 'Updated recently');
          }
        } catch (e) {
          console.error("Failed to load HPS Selected data:", e);
        } finally {
          setLoading(false);
        }
      };

      const fetchHpsHistory = async () => {
        try {
          setHistoryLoading(true);
          const res = await api.get('/screener/hps-selected-history?timeframe=all');
          if (res.data && res.data.status === 'success') {
            setHistorySnapshots(res.data.snapshots || []);
            setHistoryDates(res.data.available_dates || []);
          }
        } catch (e) {
          console.error("Failed to load HPS Selected Top 3 F&O history:", e);
        } finally {
          setHistoryLoading(false);
        }
      };

      useEffect(() => {
        setLoading(true);
        fetchHpsSelected();
        fetchHpsHistory();
        const intervalId = setInterval(() => {
          fetchHpsSelected();
          if (viewMode === 'history') {
            fetchHpsHistory();
          }
        }, 10000);
        return () => clearInterval(intervalId);
      }, [universe, viewMode]);

      const rawTfList = dataByTimeframe[activeTimeframe] || [];

      // Filter by direction first if selected, then rank by timeframe ADX descending and take Top 10
      const rankedTop10 = useMemo(() => {
        const dirFiltered = rawTfList.filter(stk => {
          if (breakoutFilter === 'BROKEN_ABOVE' && stk.status !== 'BROKEN_ABOVE') return false;
          if (breakoutFilter === 'BROKEN_BELOW' && stk.status !== 'BROKEN_BELOW') return false;
          return true;
        });
        const sorted = [...dirFiltered].sort((a, b) => Number(b.adx || 0) - Number(a.adx || 0));
        return sorted.slice(0, 10);
      }, [rawTfList, breakoutFilter]);

      const filteredList = useMemo(() => {
        return rankedTop10.filter(stk => {
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return stk.symbol.toLowerCase().includes(q) || 
            (stk.name && stk.name.toLowerCase().includes(q)) ||
            (stk.industry && stk.industry.toLowerCase().includes(q));
        });
      }, [rankedTop10, searchQuery]);

      // Flattened & filtered history rows for the selected timeframe, date, breakout direction, and search
      const filteredHistoryRows = useMemo(() => {
        const rows = [];
        for (const snap of historySnapshots) {
          if (selectedDate !== 'ALL' && snap.date !== selectedDate) continue;
          const tfItems = (snap.top3 && snap.top3[activeTimeframe]) || [];
          for (const item of tfItems) {
            if (breakoutFilter === 'BROKEN_ABOVE' && item.status !== 'BROKEN_ABOVE') continue;
            if (breakoutFilter === 'BROKEN_BELOW' && item.status !== 'BROKEN_BELOW') continue;
            if (searchQuery) {
              const q = searchQuery.toLowerCase();
              const symMatch = item.symbol && item.symbol.toLowerCase().includes(q);
              const nameMatch = item.name && item.name.toLowerCase().includes(q);
              const indMatch = item.industry && item.industry.toLowerCase().includes(q);
              if (!symMatch && !nameMatch && !indMatch) continue;
            }
            rows.push({
              ...item,
              date: item.date || snap.date,
              time: item.time || snap.time,
              slot_id: item.slot_id || snap.slot_id,
              saved_at: item.saved_at || snap.saved_at
            });
          }
        }
        return rows;
      }, [historySnapshots, activeTimeframe, selectedDate, breakoutFilter, searchQuery]);

      const bullishCount = rawTfList.filter(s => s.status === 'BROKEN_ABOVE').length;
      const bearishCount = rawTfList.filter(s => s.status === 'BROKEN_BELOW').length;

      const handleCopySymbol = (e, sym) => {
        e.stopPropagation();
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(sym).then(() => {
          setCopiedSymbol(sym);
          setTimeout(() => setCopiedSymbol(null), 1500);
        });
      };

      const handleExportSelectedCSV = () => {
        const isHist = viewMode === 'history';
        const sourceRows = isHist ? filteredHistoryRows : filteredList;
        if (!sourceRows || sourceRows.length === 0) return;

        let headers, rows;
        if (isHist) {
          headers = ['Date', 'Time (IST)', 'Rank', 'Symbol', 'Company Name', 'Sector', 'Saved LTP', 'Live LTP', 'Saved Spread (%)', 'Move Since Saved (%)', 'ADX (14)', 'Signal', 'Segment'];
          rows = sourceRows.map(row => [
            `"${row.date || ''}"`,
            `"${row.time || ''}"`,
            row.rank || '',
            `"${row.symbol || ''}"`,
            `"${(row.name || '').replace(/"/g, '""')}"`,
            `"${(row.industry || '').replace(/"/g, '""')}"`,
            row.saved_ltp != null ? row.saved_ltp : '',
            row.live_ltp != null ? row.live_ltp : '',
            row.saved_spread_pct != null ? row.saved_spread_pct : '',
            row.move_since_saved_pct != null ? row.move_since_saved_pct : '',
            row.adx != null ? row.adx : '',
            `"${row.status === 'BROKEN_ABOVE' ? 'Bullish Breakout' : 'Bearish Breakdown'}"`,
            `"NIFTY F&O"`
          ]);
        } else {
          headers = ['Rank', 'Symbol', 'Company Name', 'Sector', 'LTP (INR)', 'Spread (%)', 'ADX (14)', 'Trend Strength', 'Breakout Signal', 'Segment'];
          rows = sourceRows.map((stk, i) => [
            i + 1,
            `"${stk.symbol || ''}"`,
            `"${(stk.name || '').replace(/"/g, '""')}"`,
            `"${(stk.industry || '').replace(/"/g, '""')}"`,
            stk.ltp != null ? stk.ltp : '',
            stk.diff_pct != null ? stk.diff_pct : (stk.spread_pct != null ? stk.spread_pct : ''),
            stk.adx != null ? stk.adx : '',
            `"${Number(stk.adx || 0) >= 40 ? 'Very Strong' : Number(stk.adx || 0) >= 25 ? 'Strong Trend' : 'Developing'}"`,
            `"${stk.status === 'BROKEN_ABOVE' ? 'Bullish Breakout' : 'Bearish Breakdown'}"`,
            `"${stk.is_fo ? 'NIFTY F&O' : 'Cash (EQ)'}"`
          ]);
        }

        const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', isHist ? `HPS_Selected_Top3_FO_History_${activeTimeframe}_${new Date().toISOString().slice(0, 10)}.csv` : `HPS_Selected_Top10_${universe}_${activeTimeframe}_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setExportSuccess(true);
        setTimeout(() => setExportSuccess(false), 2400);
      };

      const timeframes = [
        { id: '4h', label: '4-Hour', badge: '4H', desc: viewMode === 'history' ? 'Saved Top 3 F&O (4H ADX)' : 'Top 10 Ranked by 4H ADX' },
        { id: 'daily', label: 'Daily', badge: '1D', desc: viewMode === 'history' ? 'Saved Top 3 F&O (Daily ADX)' : 'Top 10 Ranked by Daily ADX' },
        { id: 'weekly', label: 'Weekly', badge: '1W', desc: viewMode === 'history' ? 'Saved Top 3 F&O (Weekly ADX)' : 'Top 10 Ranked by Weekly ADX' },
        { id: 'monthly', label: 'Monthly', badge: '1M', desc: viewMode === 'history' ? 'Saved Top 3 F&O (Monthly ADX)' : 'Top 10 Ranked by Monthly ADX' }
      ];

      return (
        <section className="space-y-6 max-w-7xl mx-auto py-2 px-1 font-sans apple-page-view">
          {/* Header Section */}
          <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-5 pb-6 border-b border-white/[0.08]">
            <div className="space-y-2">
              <div className="flex items-center space-x-2.5">
                <span className="inline-flex items-center justify-center w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.7)] animate-pulse"></span>
                <span className="text-[11px] font-mono uppercase tracking-widest text-amber-400 font-semibold">
                  {viewMode === 'history' ? 'Rolling 7-Day Audit Log' : 'Quantitative Momentum Selection'}
                </span>
                <span className="text-slate-600">·</span>
                <span className="text-[11px] font-mono text-slate-400">{lastUpdated || 'Live Terminal'}</span>
              </div>
              <h1 className="text-3xl sm:text-4xl font-semibold tracking-tight text-white">
                {viewMode === 'history' ? 'HPS Selected Log' : 'HPS Selected'}
              </h1>
              <p className="text-xs sm:text-sm text-slate-400 max-w-2xl font-normal leading-relaxed">
                {viewMode === 'history'
                  ? 'Historical 30-minute snapshot archive recording the Top 3 institutional NIFTY F&O candidates with real-time relative excursion.'
                  : `High Trend Strength algorithm prioritizing the Top 10 breakout candidates ranked by maximum ADX (14) trend power on the ${activeTimeframe.toUpperCase()} timeframe.`}
              </p>
            </div>

            {/* View Mode & Universe Switchers */}
            <div className="flex flex-wrap items-center gap-3 shrink-0">
              {/* Live vs History Mode */}
              <div className="flex items-center bg-[#070B12]/80 backdrop-blur-md p-1 rounded-xl border border-white/[0.07]">
                <button
                  type="button"
                  onClick={() => setViewMode('live')}
                  className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-medium transition-all ${
                    viewMode === 'live'
                      ? 'bg-amber-500/20 text-amber-300 shadow-sm border border-amber-500/30 font-semibold'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <span>Live Top 10</span>
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setViewMode('history');
                    fetchHpsHistory();
                  }}
                  className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-medium transition-all ${
                    viewMode === 'history'
                      ? 'bg-purple-500/20 text-purple-300 shadow-sm border border-purple-500/30 font-semibold'
                      : 'text-purple-400/80 hover:text-purple-300'
                  }`}
                >
                  <span>Saved Top 3 (7D)</span>
                  <span className="text-[10px] font-mono px-1.5 py-0.2 rounded bg-purple-950/50 text-purple-300 border border-purple-500/30">
                    {historySnapshots.length}
                  </span>
                </button>
              </div>

              {/* Universe Selector (Active in Live Mode) */}
              {viewMode === 'live' && (
                <div className="flex items-center bg-[#070B12]/80 backdrop-blur-md p-1 rounded-xl border border-white/[0.07]">
                  <button
                    type="button"
                    onClick={() => setUniverse('nifty500')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                      universe === 'nifty500'
                        ? 'bg-white/[0.1] text-white shadow-sm border border-white/[0.12]'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    NIFTY 500
                  </button>
                  <button
                    type="button"
                    onClick={() => setUniverse('fo')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                      universe === 'fo'
                        ? 'bg-white/[0.1] text-white shadow-sm border border-white/[0.12]'
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    NIFTY F&O
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* Timeframe Selection Cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            {timeframes.map(tf => {
              const isSelected = activeTimeframe === tf.id;
              return (
                <button
                  key={tf.id}
                  type="button"
                  onClick={() => setActiveTimeframe(tf.id)}
                  className={`group relative p-4 rounded-2xl border text-left transition-all duration-300 ${
                    isSelected
                      ? 'bg-gradient-to-b from-[#1C160F] to-[#0D1017] border-amber-500/40 shadow-[0_8px_24px_-6px_rgba(245,158,11,0.18)]'
                      : 'bg-[#0B101B]/70 border-white/[0.06] hover:border-white/[0.14] hover:bg-[#0E1524]'
                  }`}
                >
                  <div className="flex items-center justify-between mb-2">
                    <span className="inline-flex items-center space-x-1.5">
                      <span className={`w-1.5 h-1.5 rounded-full transition-colors ${
                        isSelected ? 'bg-amber-400' : 'bg-slate-600 group-hover:bg-slate-400'
                      }`}></span>
                      <span className={`text-xs font-semibold tracking-wide uppercase font-mono ${
                        isSelected ? 'text-white' : 'text-slate-300'
                      }`}>
                        {tf.label}
                      </span>
                    </span>
                    <span className={`text-xs font-mono font-bold px-2 py-0.5 rounded-md transition-all ${
                      isSelected
                        ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                        : 'bg-white/[0.04] text-slate-400 border border-white/[0.05]'
                    }`}>
                      {viewMode === 'live' ? 'Top 10' : 'Top 3'}
                    </span>
                  </div>
                  <div className="text-[11px] text-slate-400 font-normal leading-relaxed truncate">
                    {tf.desc}
                  </div>
                  {isSelected && (
                    <div className="absolute bottom-0 left-6 right-6 h-[2px] bg-gradient-to-r from-transparent via-amber-400 to-transparent"></div>
                  )}
                </button>
              );
            })}
          </div>

          {/* Institutional Toolbar: Search, Filters, Dates (if History), Export, Refresh */}

      const [sortField, setSortField] = useState('spread'); // 'symbol', 'name', 'ltp', 'spread', 'level'
      const [sortAsc, setSortAsc] = useState(true);
      const [copiedSymbol, setCopiedSymbol] = useState(null);
      const [exportSuccess, setExportSuccess] = useState(false);

      const fetchMeanReversionData = async () => {
        setLoading(true);
        try {
          const res = await api.get(`/screener/hps-mean-reversion?timeframe=all&level=all&universe=${universe}`);
          if (res.data && res.data.status === 'success') {
            setDataByTimeframe(res.data.data || {});
            setCounts(res.data.counts || {});
            setLastUpdated(res.data.last_updated || 'Updated recently');
          }
        } catch (e) {
          console.error("Failed to load HPS Mean Reversion screener data:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchMeanReversionData();
        const intervalId = setInterval(fetchMeanReversionData, 10000);
        return () => clearInterval(intervalId);
      }, [universe]);

      const tfData = dataByTimeframe[timeframe] || { level1: [], level2: [], level3: [] };
      const tfCounts = counts[timeframe] || { level1: 0, level2: 0, level3: 0 };
      const totalTfCount = (tfCounts.level1 || 0) + (tfCounts.level2 || 0) + (tfCounts.level3 || 0);

      // Determine active stocks list based on level selection
      const activeList = useMemo(() => {
        if (level === 'all') {
          return [
            ...(tfData.level1 || []),
            ...(tfData.level2 || []),
            ...(tfData.level3 || [])
          ];
        }
        return tfData[level] || [];
      }, [tfData, level]);

      const supportCount = activeList.filter(s => s.status === 'At Support Level').length;
      const testingCount = activeList.filter(s => s.status === 'Testing Level').length;

      // Filter & Sort
      const filteredList = useMemo(() => {
        const result = activeList.filter(stk => {
          const matchesSearch = !searchQuery || 
            stk.symbol.toLowerCase().includes(searchQuery.toLowerCase()) || 
            (stk.name && stk.name.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (stk.industry && stk.industry.toLowerCase().includes(searchQuery.toLowerCase()));
          
          if (!matchesSearch) return false;
          if (statusFilter === 'SUPPORT') return stk.status === 'At Support Level';
          if (statusFilter === 'TESTING') return stk.status === 'Testing Level';
          return true;
        });

        return result.sort((a, b) => {
          let valA, valB;
          if (sortField === 'symbol') {
            valA = a.symbol || ''; valB = b.symbol || '';
            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
          } else if (sortField === 'name') {
            valA = a.name || ''; valB = b.name || '';
            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
          } else if (sortField === 'ltp') {
            valA = Number(a.ltp || 0); valB = Number(b.ltp || 0);
          } else if (sortField === 'level') {
            valA = a.level || ''; valB = b.level || '';
            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
          } else {
            // default: absolute proximity to support zone (closest first)
            valA = Math.abs(Number(a.spread_pct != null ? a.spread_pct : 0));
            valB = Math.abs(Number(b.spread_pct != null ? b.spread_pct : 0));
          }
          return sortAsc ? valA - valB : valB - valA;
        });
      }, [activeList, searchQuery, statusFilter, sortField, sortAsc]);

      const toggleSort = (field) => {
        if (sortField === field) {
          setSortAsc(!sortAsc);
        } else {
          setSortField(field);
          setSortAsc(true);
        }
      };

      const handleCopySymbol = (e, sym) => {
        e.stopPropagation();
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(sym).then(() => {
          setCopiedSymbol(sym);
          setTimeout(() => setCopiedSymbol(null), 1500);
        });
      };

      const handleExportCSV = () => {
        if (!filteredList || filteredList.length === 0) return;
        const headers = ['Symbol', 'Company Name', 'Sector', 'LTP (INR)', 'Distance to Level (%)', 'Reversion Level', 'Timeframe', 'Setup Condition', 'Segment'];
        const rows = filteredList.map(stk => [
          `"${stk.symbol || ''}"`,
          `"${(stk.name || '').replace(/"/g, '""')}"`,
          `"${(stk.industry || '').replace(/"/g, '""')}"`,
          stk.ltp != null ? stk.ltp : '',
          stk.spread_pct != null ? stk.spread_pct : '',
          `"${stk.level || level.toUpperCase()}"`,
          `"${stk.timeframe || timeframe.toUpperCase()}"`,
          `"${stk.status || ''}"`,
          `"${stk.is_fo ? 'NIFTY F&O' : 'Cash (EQ)'}"`
        ]);
        const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `HPS_Mean_Reversion_${universe}_${timeframe}_${level}_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setExportSuccess(true);
        setTimeout(() => setExportSuccess(false), 2400);
      };

        { id: 'daily', label: 'Daily', badge: '1D', desc: 'Short-Term Dynamic Band' },
        { id: 'weekly', label: 'Weekly', badge: '1W', desc: 'Major Swing Reversal Anchor' },
        { id: 'monthly', label: 'Monthly', badge: '1M', desc: 'Macro Equilibrium Baseline' }
      ];

      const levels = [
        { id: 'all', label: 'All Levels', desc: 'Comprehensive Support Spectrum', count: totalTfCount, accent: 'violet' },
        { id: 'level1', label: 'Level-1', desc: 'Primary Dynamic Moving Support', count: tfCounts.level1 || 0, accent: 'emerald' },
        { id: 'level2', label: 'Level-2', desc: 'Secondary Intermediate Pivot Zone', count: tfCounts.level2 || 0, accent: 'cyan' },
        { id: 'level3', label: 'Level-3', desc: 'Deep Institutional Value Base', count: tfCounts.level3 || 0, accent: 'amber' }

        <section className="space-y-6 max-w-7xl mx-auto py-2 px-1 font-sans apple-page-view">

          {/* Timeframe Horizon Tabs */}

            {timeframes.map(tf => {
              const isSelected = timeframe === tf.id;
              const tfCount = (counts[tf.id]?.level1 || 0) + (counts[tf.id]?.level2 || 0) + (counts[tf.id]?.level3 || 0);
              return (
                <button
                  key={tf.id}
                  type="button"
                  onClick={() => setTimeframe(tf.id)}
                  className={`group relative p-4 rounded-2xl border text-left transition-all duration-300 ${
                    isSelected

                      {tfCount} Setups

                  <div className="text-[11px] text-slate-400 font-normal leading-relaxed truncate">
                    {tf.desc}

                  {isSelected && (
                    <div className="absolute bottom-0 left-6 right-6 h-[2px] bg-gradient-to-r from-transparent via-violet-400 to-transparent"></div>

                </button>

          </div>

          {/* Reversion Level Cards (Level-1, Level-2, Level-3) */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            {levels.map(lvl => {

              const accentColor = 
                lvl.accent === 'emerald' ? 'text-emerald-400' :
                lvl.accent === 'cyan' ? 'text-cyan-400' :
                lvl.accent === 'amber' ? 'text-amber-400' : 'text-violet-300';

                lvl.accent === 'emerald' ? 'bg-gradient-to-b from-[#11241C] to-[#0A130F] border-emerald-500/40' :

                  className={`p-3.5 rounded-2xl border text-left transition-all duration-200 ${
                    isSelected

                >
                  <div className="flex items-center justify-between mb-1.5">
                    <span className={`text-xs font-mono font-bold tracking-wide ${accentColor}`}>
