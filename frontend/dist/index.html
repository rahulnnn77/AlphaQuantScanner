                    <span className={`text-xs font-mono font-bold px-2 py-0.5 rounded-md ${
                      isSelected ? 'bg-white/[0.1] text-white' : 'bg-white/[0.04] text-slate-400'
                    }`}>
                      {lvl.count}
                    </span>
                  </div>
                  <div className="text-[11px] text-slate-400 truncate font-normal">
                    {lvl.desc}
                  </div>
                </button>
              );
            })}
          </div>

          {/* Institutional Controls Bar: Search, Status Filter, Export, Refresh */}
          <div className="bg-[#0B101B]/80 backdrop-blur-md border border-white/[0.07] rounded-2xl p-3 sm:p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
            {/* Search Input */}
            <div className="relative flex-1 max-w-md">
              <span className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-500 text-xs">
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
              </span>
              <input
                type="text"
                placeholder="Search symbol, company, or sector in active level..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="w-full bg-[#070B13] border border-white/[0.08] rounded-xl pl-9 pr-8 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-violet-500/60 focus:ring-1 focus:ring-violet-500/20 font-sans transition-all"
              />
              {searchQuery && (
                <button
                  type="button"
                  onClick={() => setSearchQuery('')}
                  className="absolute inset-y-0 right-2.5 flex items-center text-slate-400 hover:text-white text-xs"
                >
                  ✕
                </button>
              )}
            </div>

            {/* Condition Filters and Actions */}
            <div className="flex flex-wrap items-center gap-2">
              {/* Setup Condition Segment */}
              <div className="flex items-center bg-[#070B13] border border-white/[0.08] p-0.5 rounded-xl text-xs">
                <button
                  type="button"
                  onClick={() => setStatusFilter('ALL')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all ${
                    statusFilter === 'ALL'
                      ? 'bg-white/[0.12] text-white shadow-sm'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  All ({activeList.length})
                </button>
                <button
                  type="button"
                  onClick={() => setStatusFilter('SUPPORT')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all flex items-center space-x-1.5 ${
                    statusFilter === 'SUPPORT'
                      ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                      : 'text-emerald-400/80 hover:text-emerald-300'
                  }`}
                >
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  <span>At Support ({supportCount})</span>
                </button>
                <button
                  type="button"
                  onClick={() => setStatusFilter('TESTING')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all flex items-center space-x-1.5 ${
                    statusFilter === 'TESTING'
                      ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                      : 'text-amber-400/80 hover:text-amber-300'
                  }`}
                >
                  <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                  <span>Testing ({testingCount})</span>
                </button>
              </div>

              {/* Export CSV Button */}
              <button
                type="button"
                onClick={handleExportCSV}
                disabled={loading || filteredList.length === 0}
                className="flex items-center space-x-1.5 px-3.5 py-1.5 bg-white/[0.04] hover:bg-white/[0.08] text-slate-300 hover:text-white text-xs font-medium rounded-xl border border-white/[0.08] transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                title="Download CSV report"
              >
                <svg className="w-3.5 h-3.5 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>{exportSuccess ? 'Exported!' : 'Export CSV'}</span>
              </button>

              {/* Refresh Button */}
              <button
                type="button"
                onClick={fetchMeanReversionData}
                disabled={loading}
                className="flex items-center space-x-1.5 px-3 py-1.5 bg-white/[0.04] hover:bg-white/[0.08] text-slate-300 hover:text-white text-xs font-medium rounded-xl border border-white/[0.08] transition-all"
                title="Refresh real-time data"
              >
                <span className={`inline-block text-violet-400 ${loading ? 'animate-spin' : ''}`}>↻</span>
                <span className="hidden sm:inline">Refresh</span>
              </button>
            </div>
          </div>

          {/* Premium Financial Data Table */}
          <div className="bg-[#0B101B]/90 backdrop-blur-md border border-white/[0.08] rounded-2xl overflow-hidden shadow-2xl">
            <div className="overflow-x-auto custom-scrollbar">
              <table className="w-full text-left text-xs font-sans tabular-nums border-collapse">
                <thead>
                  <tr className="border-b border-white/[0.08] bg-[#070C16]/95 text-slate-400 text-[11px] uppercase tracking-wider font-mono font-medium table-blur-header">
                    <th className="py-3.5 px-4 w-12 text-center">#</th>
                    <th 
                      onClick={() => toggleSort('symbol')}
                      className="py-3.5 px-4 cursor-pointer hover:text-white transition-colors select-none"
                    >
                      <div className="flex items-center space-x-1">
                        <span>Symbol</span>
                        {sortField === 'symbol' && <span className="text-violet-400 font-bold">{sortAsc ? '↑' : '↓'}</span>}
                      </div>
                    </th>
                    <th 
                      onClick={() => toggleSort('name')}
                      className="py-3.5 px-4 cursor-pointer hover:text-white transition-colors select-none"
                    >
                      <div className="flex items-center space-x-1">
                        <span>Company Name</span>
                        {sortField === 'name' && <span className="text-violet-400 font-bold">{sortAsc ? '↑' : '↓'}</span>}
                      </div>
                    </th>
                    <th className="py-3.5 px-4">Sector</th>
                    <th 
                      onClick={() => toggleSort('ltp')}
                      className="py-3.5 px-4 text-right cursor-pointer hover:text-white transition-colors select-none"
                    >
                      <div className="flex items-center justify-end space-x-1">
                        <span>LTP (₹)</span>
                        {sortField === 'ltp' && <span className="text-violet-400 font-bold">{sortAsc ? '↑' : '↓'}</span>}
                      </div>

                      onClick={() => toggleSort('spread')}

                    >
                      <div className="flex items-center justify-center space-x-1">
                        <span>Reversion Level</span>
                        {sortField === 'level' && <span className="text-violet-400 font-bold">{sortAsc ? '↑' : '↓'}</span>}
                      </div>

                </thead>
                <tbody className="divide-y divide-white/[0.04]">
                  {loading && filteredList.length === 0 ? (

                <span>Displaying</span>
                <span className="text-white font-semibold">{filteredList.length}</span>
                <span>stocks in</span>
                <span className="text-violet-400 font-semibold">{level.toUpperCase()}</span>
                <span>on</span>
                <span className="text-cyan-400 font-semibold">{timeframe.toUpperCase()}</span>
                <span>({universe.toUpperCase()})</span>

              <div className="flex items-center space-x-3 text-slate-400">

              </div>

      );
    }

    // ----------------- WEEKLY POSITION STRATEGY SECTION ----------------- //
    function WeeklyPositionSection() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [selectedTueDate, setSelectedTueDate] = useState('');
      const [hoveredBar, setHoveredBar] = useState(null);

      const fetchStrategy = async (force = false) => {
        if (force) setRefreshing(true);
        else if (!data) setLoading(true);
        try {
          const res = await api.get(`/screener/weekly-position${force ? '?refresh=true' : ''}`);
          const json = res.data;
          setData(json);
          if (!selectedTueDate && json.current_week?.tuesday_date) {
            setSelectedTueDate(json.current_week.tuesday_date);
          }
        } catch (err) {
          console.error('Failed to fetch Weekly Position:', err);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      useEffect(() => {
        fetchStrategy(false);
        const timer = setInterval(() => fetchStrategy(false), 30000);
        return () => clearInterval(timer);
      }, []);

      const weeks = data?.weeks || [];
      const activeWeek = weeks.find(w => w.tuesday_date === selectedTueDate) || data?.current_week || weeks[0] || null;
      const isCurrentWeek = activeWeek && data?.current_week && activeWeek.tuesday_date === data.current_week.tuesday_date;
      const liveLtp = Number(data?.live_ltp || activeWeek?.current_price || 0);

      const ref = activeWeek?.reference_candle || null;
      const trig = activeWeek?.trigger_candle || null;
      const entry = activeWeek?.entry_alert || null;
      const exitAlert = activeWeek?.exit_alert || null;
      const bias = activeWeek?.bias || 'NEUTRAL';

      const fmtPrice = (val) => {
        if (val === null || val === undefined || isNaN(Number(val))) return '—';
        return Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

      const fmtPts = (val, signed = false) => {
        if (val === null || val === undefined || isNaN(Number(val))) return '—';
        const num = Number(val);
        const prefix = signed && num > 0 ? '+' : '';
        return `${prefix}${num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} pts`;
      };

      const buildChartModel = () => {
        const bars = activeWeek?.candles || [];
        if (!bars.length || !ref) return null;

        const allPrices = [
          ref.high,
          ref.low,
          trig?.trigger_level,
          entry?.entry_price,
          exitAlert?.exit_price,
          isCurrentWeek ? liveLtp : activeWeek?.current_price
        ].filter(v => typeof v === 'number' && v > 0);

        bars.forEach(b => {
          allPrices.push(b.high, b.low);
        });

        const rawMin = Math.min(...allPrices);
        const rawMax = Math.max(...allPrices);
        const rawSpan = Math.max(rawMax - rawMin, 80);
        const pad = rawSpan * 0.14;
        const minP = rawMin - pad;
        const maxP = rawMax + pad;
        const spanP = maxP - minP;

        const W = 960;
        const H = 380;
        const padLeft = 24;
        const padRight = 104;
        const padTop = 28;
        const padBottom = 38;
        const plotW = W - padLeft - padRight;
        const plotH = H - padTop - padBottom;

        const yOf = (p) => padTop + ((maxP - p) / spanP) * plotH;
        const count = Math.max(bars.length, 1);
        const stepX = plotW / count;
        const candleW = Math.max(6, Math.min(20, stepX * 0.56));

        const priceTicks = [];
        for (let i = 0; i <= 4; i++) {
          const val = minP + (spanP * i) / 4;
          priceTicks.push({ price: val, y: yOf(val) });
        }

        return {
          bars,
          W,
          H,
          padLeft,
          padRight,
          padTop,
          padBottom,
          plotW,
          plotH,
          yOf,
          stepX,
          candleW,
          priceTicks,
          refHighY: yOf(ref.high),
          refLowY: yOf(ref.low),
          trigY: trig ? yOf(trig.trigger_level) : null
        };
      };

      const chart = buildChartModel();
      const activeHoverCandle = hoveredBar || (activeWeek?.candles?.length ? activeWeek.candles[activeWeek.candles.length - 1] : null);
      const statusLabel = exitAlert
        ? 'Exit Triggered'
        : entry
        ? `${entry.direction} Active`
        : trig
        ? 'Signal Armed'
        : 'Monitoring';

      return (
        <section className="max-w-6xl mx-auto py-4 px-2 space-y-8 select-none">
          {/* 1. Minimal Apple-Style Header */}
          <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-6 border-b border-white/[0.07]">
            <div>
              <div className="flex items-center space-x-3">
                <h1 className="text-3xl font-semibold text-white tracking-tight">
                  Weekly Position
                </h1>
                <span className={`inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium ${
                  exitAlert
                    ? 'bg-rose-500/10 text-rose-400'
                    : entry
                    ? 'bg-emerald-500/10 text-emerald-400'
                    : trig
                    ? 'bg-amber-500/10 text-amber-300'
                    : 'bg-white/[0.06] text-slate-300'
                }`}>
                  <span className={`w-1.5 h-1.5 rounded-full ${
                    exitAlert ? 'bg-rose-400' : entry ? 'bg-emerald-400' : trig ? 'bg-amber-400' : 'bg-slate-400'
                  }`}></span>
                  <span>{statusLabel}</span>
                </span>
              </div>
              <p className="text-sm text-slate-400 mt-1">
                NIFTY 50
              </p>
            </div>

            <div className="flex items-center space-x-3">
              <select
                value={activeWeek?.tuesday_date || ''}
                onChange={(e) => {
                  setSelectedTueDate(e.target.value);
                  setHoveredBar(null);
                }}
                className="bg-white/[0.04] hover:bg-white/[0.07] border border-white/[0.08] rounded-full px-4 py-2 text-xs font-medium text-slate-200 focus:outline-none transition-colors cursor-pointer"
              >
                {weeks.map((wk, idx) => (
                  <option key={wk.tuesday_date} value={wk.tuesday_date} className="bg-[#0B0F17] text-white">
                    {idx === 0 ? `Current · ${wk.week_label}` : wk.week_label}
                  </option>
                ))}
              </select>

              <button
                onClick={() => fetchStrategy(true)}
                disabled={refreshing}
                className="px-4 py-2 rounded-full text-xs font-medium bg-white text-slate-950 hover:bg-slate-200 disabled:opacity-50 transition-colors"
              >
                {refreshing ? 'Updating...' : 'Refresh'}
              </button>
            </div>
          </div>

          {loading && !activeWeek ? (
            <div className="py-24 text-center text-sm text-slate-500">
              Loading position data...
            </div>
          ) : activeWeek ? (
            <>
              {/* 2. Essential Metrics Strip — Pure Typography, Staggered Apple Reveal */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-8 py-2">
                <div className="apple-metric-item apple-stagger-1">
                  <div className="text-xs font-medium text-slate-400">NIFTY 50</div>
                  <div className="text-2xl font-semibold text-white tabular-nums tracking-tight mt-1">
                    {fmtPrice(isCurrentWeek ? liveLtp : activeWeek?.current_price)}
                  </div>
                  {entry && (
                    <div className={`text-xs font-medium tabular-nums mt-1 ${
                      (activeWeek?.active_pnl_pts || 0) >= 0 ? 'text-emerald-400' : 'text-rose-400'
                    }`}>
                      {fmtPts(activeWeek?.active_pnl_pts, true)}
                    </div>
                  )}
                </div>

                <div className="apple-metric-item apple-stagger-2">
                  <div className="text-xs font-medium text-slate-400">Range</div>
                  <div className="text-2xl font-semibold text-white tabular-nums tracking-tight mt-1">
                    {ref ? `${ref.range_pts.toFixed(2)}` : '—'}
                    <span className="text-sm font-normal text-slate-400 ml-1">pts</span>
                  </div>
                  <div className="text-xs text-slate-400 tabular-nums mt-1">
                    {ref ? `${fmtPrice(ref.low)} – ${fmtPrice(ref.high)}` : '—'}
                  </div>
                </div>

                <div className="apple-metric-item apple-stagger-3">
                  <div className="text-xs font-medium text-slate-400">Entry Alert</div>
                  <div className="text-2xl font-semibold text-emerald-400 tabular-nums tracking-tight mt-1">
                    {entry ? fmtPrice(entry.entry_price) : trig ? fmtPrice(trig.trigger_level) : '—'}
                  </div>
                  <div className="text-xs text-slate-400 mt-1">
                    {entry ? entry.short_time : trig ? 'Armed' : 'Pending'}
                  </div>
                </div>

                <div className="apple-metric-item apple-stagger-4">
                  <div className="text-xs font-medium text-slate-400">Exit Alert</div>
                  <div className="text-2xl font-semibold text-rose-400 tabular-nums tracking-tight mt-1">
                    {ref ? fmtPrice(bias === 'BEARISH' ? ref.high : ref.low) : '—'}
                  </div>
                  <div className="text-xs text-slate-400 mt-1">
                    {exitAlert ? `Triggered · ${exitAlert.short_time}` : 'Protected Level'}
                  </div>
                </div>
              </div>

              {/* 3. Clean Candlestick Chart Canvas */}
              {chart && ref && (
                <div className="rounded-2xl bg-[#0D121D] border border-white/[0.06] p-6 apple-chart-surface">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-5">
                    <div className="text-sm font-medium text-slate-200">
                      Price & Trigger Levels
                    </div>
                    {activeHoverCandle && (
                      <div className="flex items-center space-x-4 text-xs text-slate-400 tabular-nums">
                        <span className="text-slate-200 font-medium">{activeHoverCandle.short_time}</span>
                        <span>O <strong className="text-white font-medium">{fmtPrice(activeHoverCandle.open)}</strong></span>
                        <span>H <strong className="text-white font-medium">{fmtPrice(activeHoverCandle.high)}</strong></span>
                        <span>L <strong className="text-white font-medium">{fmtPrice(activeHoverCandle.low)}</strong></span>
                        <span>C <strong className="text-white font-medium">{fmtPrice(activeHoverCandle.close)}</strong></span>
                      </div>
                    )}
                  </div>

                  <div className="overflow-x-auto">
                    <svg
                      viewBox={`0 0 ${chart.W} ${chart.H}`}
                      className="w-full h-[360px] select-none"
                      onMouseLeave={() => setHoveredBar(null)}
                    >
                      {/* Subtle Grid */}
                      {chart.priceTicks.map((t, idx) => (
                        <g key={idx}>
                          <line
                            x1={chart.padLeft}
                            x2={chart.W - chart.padRight}
                            y1={t.y}
                            y2={t.y}
                            stroke="rgba(255,255,255,0.04)"
                            strokeWidth="1"
                          />
                          <text
                            x={chart.W - chart.padRight + 12}
                            y={t.y + 3}
                            fill="#64748B"
                            fontSize="10.5"
                            fontFamily="-apple-system, BlinkMacSystemFont, SF Mono, monospace"
                          >
                            {fmtPrice(t.price)}
                          </text>
                        </g>
                      ))}

                      {/* Shaded Range Zone */}
                      <rect
                        x={chart.padLeft}
                        y={Math.min(chart.refHighY, chart.refLowY)}
                        width={chart.plotW}
                        height={Math.max(2, Math.abs(chart.refLowY - chart.refHighY))}
                        fill="#38BDF8"
                        fillOpacity="0.06"
                      />

                      {/* Range High Line */}
                      <line
                        x1={chart.padLeft}
                        x2={chart.W - chart.padRight}
                        y1={chart.refHighY}
                        y2={chart.refHighY}
                        stroke="#38BDF8"
                        strokeOpacity="0.5"
                        strokeWidth="1"
                        strokeDasharray="4 4"
                      />
                      <text
                        x={chart.W - chart.padRight + 12}
                        y={chart.refHighY + 3}
                        fill="#38BDF8"
                        fontSize="10.5"
                        fontWeight="500"
                        fontFamily="-apple-system, BlinkMacSystemFont, SF Mono, monospace"
                      >
                        {fmtPrice(ref.high)}
                      </text>

                      {/* Range Low / Exit Line */}
                      <line
                        x1={chart.padLeft}
                        x2={chart.W - chart.padRight}
                        y1={chart.refLowY}
                        y2={chart.refLowY}
                        stroke="#F43F5E"
                        strokeOpacity="0.6"
                        strokeWidth="1"
                        strokeDasharray="4 4"
                      />
                      <text
                        x={chart.W - chart.padRight + 12}
                        y={chart.refLowY + 3}
                        fill="#FB7185"
                        fontSize="10.5"
                        fontWeight="500"
                        fontFamily="-apple-system, BlinkMacSystemFont, SF Mono, monospace"
                      >
                        {fmtPrice(ref.low)}
                      </text>

                      {/* Entry Trigger Line */}
                      {chart.trigY !== null && (
                        <>
                          <line
                            x1={chart.padLeft}
                            x2={chart.W - chart.padRight}
                            y1={chart.trigY}
                            y2={chart.trigY}
                            stroke="#10B981"
                            strokeOpacity="0.8"
                            strokeWidth="1.2"
                          />
                          <text
                            x={chart.W - chart.padRight + 12}
                            y={chart.trigY + 3}
                            fill="#34D399"
                            fontSize="10.5"
                            fontWeight="600"
                            fontFamily="-apple-system, BlinkMacSystemFont, SF Mono, monospace"
                          >
                            {fmtPrice(trig.trigger_level)}
                          </text>
                        </>
                      )}

                      {/* Candles */}
                      {chart.bars.map((b, i) => {
                        const cx = chart.padLeft + chart.stepX * i + chart.stepX / 2;
                        const openY = chart.yOf(b.open);
                        const closeY = chart.yOf(b.close);
                        const highY = chart.yOf(b.high);
                        const lowY = chart.yOf(b.low);
                        const isBull = b.close >= b.open;

                        const isRef = b.role === 'REFERENCE_1H';
                        const isTrig = b.role === 'TRIGGER_2ND_CANDLE';
                        const isEntry = b.role === 'ENTRY_ALERT' || b.role === 'ENTRY_AND_EXIT';
                        const isExit = b.role === 'EXIT_ALERT' || b.role === 'ENTRY_AND_EXIT';

                        let color = isBull ? '#10B981' : '#F43F5E';
                        if (isRef) color = '#38BDF8';
                        else if (isTrig) color = '#F59E0B';

                        const bodyTop = Math.min(openY, closeY);
                        const bodyH = Math.max(2.5, Math.abs(closeY - openY));
                        const isHovered = activeHoverCandle && activeHoverCandle.bar_index === b.bar_index;

                        return (
                          <g
                            key={b.bar_index}
                            className="cursor-pointer apple-candle-group"
                            onMouseEnter={() => setHoveredBar(b)}
                          >
                            {isHovered && (
                              <line
                                x1={cx}
                                x2={cx}
                                y1={chart.padTop}
                                y2={chart.padTop + chart.plotH}
                                stroke="rgba(255,255,255,0.12)"
                                strokeWidth="1"
                              />
                            )}
                            <line
                              x1={cx}
                              x2={cx}
                              y1={highY}
                              y2={lowY}
                              stroke={color}
                              strokeWidth="1.2"
                            />
                            <rect
                              x={cx - chart.candleW / 2}
                              y={bodyTop}
                              width={chart.candleW}
                              height={bodyH}
                              rx="1.5"
                              fill={color}
                            />

                            {(isEntry || isExit) && (
                              <text
                                x={cx}
                                y={isEntry ? Math.max(14, highY - 10) : Math.min(chart.H - 24, lowY + 16)}
                                textAnchor="middle"
                                fill={isEntry ? '#34D399' : '#FB7185'}
                                fontSize="9.5"
                                fontWeight="600"
                                fontFamily="-apple-system, BlinkMacSystemFont, sans-serif"
                              >
                                {isEntry ? 'Entry' : 'Exit'}
                              </text>
                            )}

                            {(i === 0 || i === chart.bars.length - 1 || i % Math.max(1, Math.floor(chart.bars.length / 5)) === 0) && (
                              <text
                                x={cx}
                                y={chart.H - 10}
                                textAnchor="middle"
                                fill="#64748B"
                                fontSize="10"
                                fontFamily="-apple-system, BlinkMacSystemFont, sans-serif"
                              >
                                {b.short_time}
                              </text>
                            )}
                          </g>
                        );
                      })}
                    </svg>
                  </div>
                </div>
              )}

              {/* 4. Minimalist Recent Cycles Table */}
              <div className="pt-2 apple-scroll-item">
                <h2 className="text-sm font-medium text-slate-300 mb-4">
                  Recent Cycles
                </h2>
                <div className="overflow-x-auto border-t border-white/[0.07]">
                  <table className="w-full text-left text-sm tabular-nums">
                    <thead>
                      <tr className="text-xs font-medium text-slate-400 border-b border-white/[0.06]">
                        <th className="py-3.5 pr-4 font-medium">Week</th>
                        <th className="py-3.5 px-4 text-right font-medium">Range</th>
                        <th className="py-3.5 px-4 text-right font-medium">Entry</th>
                        <th className="py-3.5 px-4 text-right font-medium">Exit Level</th>
                        <th className="py-3.5 pl-4 text-right font-medium">Outcome</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-white/[0.04]">
                      {weeks.map((wk, idx) => {
                        const wRef = wk.reference_candle;
                        const wEntry = wk.entry_alert;
                        const isSelected = wk.tuesday_date === activeWeek?.tuesday_date;

                        return (
                          <tr
                            key={wk.tuesday_date}
                            onClick={() => setSelectedTueDate(wk.tuesday_date)}
                            className={`cursor-pointer transition-colors ${
                              isSelected ? 'bg-white/[0.04]' : 'hover:bg-white/[0.02]'
                            }`}
                          >
                            <td className="py-3.5 pr-4 font-medium text-white">
                              <span>{wk.week_label}</span>
                              {idx === 0 && (
                                <span className="ml-2 text-[11px] font-normal text-slate-400">Current</span>
                              )}
                            </td>
                            <td className="py-3.5 px-4 text-right text-slate-300">
                              {wRef ? `${fmtPrice(wRef.low)} – ${fmtPrice(wRef.high)}` : '—'}
                              {wRef && <span className="text-slate-500 text-xs ml-1.5">({wRef.range_pts.toFixed(0)}p)</span>}
                            </td>
                            <td className="py-3.5 px-4 text-right text-white font-medium">
                              {wEntry ? fmtPrice(wEntry.entry_price) : '—'}
                            </td>
                            <td className="py-3.5 px-4 text-right text-slate-400">
                              {wEntry ? fmtPrice(wEntry.stop_loss) : wRef ? fmtPrice(wRef.low) : '—'}
                            </td>
                            <td className={`py-3.5 pl-4 text-right font-medium ${
                              !wEntry
                                ? 'text-slate-500'
                                : (wk.active_pnl_pts || 0) >= 0
                                ? 'text-emerald-400'
                                : 'text-rose-400'
                            }`}>
                              {wEntry ? fmtPts(wk.active_pnl_pts, true) : '—'}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          ) : null}
        </section>
      );
    }

    // ----------------- PERSONALIZED USER WATCHLIST SECTION ----------------- //
    function WatchlistSection({ user }) {
      const prefKey = `alphaquant_wl_prefs_v2_${user?.username || 'default'}`;
      const [watchlists, setWatchlists] = useState([]);
      const [activeWlId, setActiveWlId] = useState(null);
      const [needsOnboarding, setNeedsOnboarding] = useState(false);
      const [benchmarks, setBenchmarks] = useState(null);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [lastUpdated, setLastUpdated] = useState('');
      const [toastMsg, setToastMsg] = useState('');

      // Active Timeframe across Dashboard, Sector Cards & Relative Strength Table
      const [selectedTf, setSelectedTf] = useState('1D');
      // Layout view: 'sectors' (Sector-wise + Table) or 'table' (Unified Table)
      const [viewMode, setViewMode] = useState('sectors');
      // Collapsible sectors map (default expanded)
      const [collapsedSectors, setCollapsedSectors] = useState({});
      // Table Filter & Sort
      const [tableFilterQuery, setTableFilterQuery] = useState('');
      const [tableSectorFilter, setTableSectorFilter] = useState('ALL');
      const [sortBy, setSortBy] = useState('custom'); // 'custom' | 'stock_perf' | 'sector_perf' | 'rel_sector' | 'rel_nifty50' | 'sector_name'
      const [sortDir, setSortDir] = useState('desc');

      // First-time Onboarding State
      const [onboardName, setOnboardName] = useState('Core Portfolio Watchlist');
      const [onboardStocks, setOnboardStocks] = useState([]);
      const [onboardQuery, setOnboardQuery] = useState('');
      const [onboardExch, setOnboardExch] = useState('ALL');
      const [onboardResults, setOnboardResults] = useState([]);
      const [onboardSearching, setOnboardSearching] = useState(false);
      const [creatingOnboard, setCreatingOnboard] = useState(false);

      // User preferences (Theme, Visible Columns)
      const [prefs, setPrefs] = useState(() => {
        try {
          const saved = localStorage.getItem(prefKey);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {
          theme: 'dark',
          columns: {
            sector: true,
            change_pct: true,
            sector_change_pct: true,
            nifty_change_pct: true,
            rel_sector: true,
            rel_nifty: true,
            volume: true,
            change: false,
            high_52w: false,
            low_52w: false
          }
        };
      });

      const isLight = prefs.theme === 'light';

      const updatePrefs = (updater) => {
        setPrefs(prev => {
          const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
          try {
            localStorage.setItem(prefKey, JSON.stringify(next));
          } catch (e) {}
          return next;
        });
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => {
          setToastMsg(prev => (prev === msg ? '' : prev));
        }, 2600);
      };

      // Modals & UI panels
      const [showSearchModal, setShowSearchModal] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchExch, setSearchExch] = useState('ALL');
      const [searchResults, setSearchResults] = useState([]);
      const [searching, setSearching] = useState(false);
      const [addingTicker, setAddingTicker] = useState('');

      const [showCreateInput, setShowCreateInput] = useState(false);
      const [newListName, setNewListName] = useState('');
      const [renamingList, setRenamingList] = useState(false);
      const [renameValue, setRenameValue] = useState('');
      const [showColumnMenu, setShowColumnMenu] = useState(false);
      const [moveMenuStockId, setMoveMenuStockId] = useState(null);

      // Detailed Stock Performance View state
      const [selectedDetailStock, setSelectedDetailStock] = useState(null);
      const [chartPeriod, setChartPeriod] = useState('1M');
      const [chartData, setChartData] = useState(null);
      const [chartLoading, setChartLoading] = useState(false);
      const [hoveredChartPoint, setHoveredChartPoint] = useState(null);

      const applyWatchlistPayload = (payload) => {
        const lists = payload?.watchlists || [];
        setWatchlists(lists);
        setNeedsOnboarding(Boolean(payload?.needs_onboarding) || lists.length === 0);
        if (payload?.benchmarks) setBenchmarks(payload.benchmarks);
        if (payload?.last_updated) setLastUpdated(payload.last_updated);
        if (lists.length > 0) {
          setActiveWlId(prev => {
            if (prev && lists.some(w => w.id === prev)) return prev;
            return lists[0].id;
          });
        }
      };

      const loadWatchlists = async (silent = false) => {
        if (!silent) setLoading(true);
        else setRefreshing(true);
        try {
          const res = await api.get('/watchlists');
          applyWatchlistPayload(res.data);
        } catch (e) {
          console.error('Failed to load user watchlists:', e);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      useEffect(() => {
        loadWatchlists(false);
        const timer = setInterval(() => loadWatchlists(true), 15000);
        return () => clearInterval(timer);
      }, []);

      const activeList = useMemo(() => {
        return watchlists.find(w => w.id === activeWlId) || watchlists[0] || null;
      }, [watchlists, activeWlId]);

      // Search API effect (Modal)
      useEffect(() => {
        if (!showSearchModal) return;
        let cancelled = false;
        const timer = setTimeout(async () => {
          setSearching(true);
          try {
            const res = await api.get(`/watchlists/search?q=${encodeURIComponent(searchQuery)}&exchange=${searchExch}`);
            if (!cancelled) {
              setSearchResults(res.data?.results || []);
            }
          } catch (e) {
            if (!cancelled) setSearchResults([]);
          } finally {
            if (!cancelled) setSearching(false);
          }
        }, 180);
        return () => {
          cancelled = true;
          clearTimeout(timer);
        };
      }, [showSearchModal, searchQuery, searchExch]);

      // Search API effect (First-Time Onboarding)
      useEffect(() => {
        if (!needsOnboarding) return;
        let cancelled = false;
        const timer = setTimeout(async () => {
          setOnboardSearching(true);
          try {
            const res = await api.get(`/watchlists/search?q=${encodeURIComponent(onboardQuery)}&exchange=${onboardExch}`);
            if (!cancelled) {
              setOnboardResults(res.data?.results || []);
            }
          } catch (e) {
            if (!cancelled) setOnboardResults([]);
          } finally {
            if (!cancelled) setOnboardSearching(false);
          }
        }, 180);
        return () => {
          cancelled = true;
          clearTimeout(timer);
        };
      }, [needsOnboarding, onboardQuery, onboardExch]);

      // Stock Performance Chart fetch effect
      useEffect(() => {
        if (!selectedDetailStock) return;
        let cancelled = false;
        const fetchHistory = async () => {
          setChartLoading(true);
          try {
            const res = await api.get(
              `/watchlists/history?symbol=${encodeURIComponent(selectedDetailStock.symbol)}&exchange=${encodeURIComponent(selectedDetailStock.exchange || 'NSE')}&period=${chartPeriod}`
            );
            if (!cancelled) {
              setChartData(res.data);
              setHoveredChartPoint(null);
            }
          } catch (e) {
            if (!cancelled) setChartData(null);
          } finally {
            if (!cancelled) setChartLoading(false);
          }
        };
        fetchHistory();
        return () => { cancelled = true; };
      }, [selectedDetailStock?.symbol, selectedDetailStock?.exchange, chartPeriod]);

      const handleCompleteOnboarding = async (e) => {
        if (e) e.preventDefault();
        const cleanName = (onboardName || 'My Watchlist').trim();
        if (!cleanName) return;
        setCreatingOnboard(true);
        try {
          const res = await api.post('/watchlists', {
            name: cleanName,
            initial_stocks: onboardStocks.map(s => ({
              symbol: s.symbol,
              exchange: s.exchange || 'NSE',
              company_name: s.name,
              sector: s.sector || 'Equities'
            }))
          });
          applyWatchlistPayload(res.data?.data);
          if (res.data?.watchlist_id) setActiveWlId(res.data.watchlist_id);
          setNeedsOnboarding(false);
          showToast(`Created "${cleanName}"`);
        } catch (err) {
          showToast(err.response?.data?.detail || 'Could not create watchlist');
        } finally {
          setCreatingOnboard(false);
        }
      };

      const toggleOnboardStock = (item) => {
        const key = `${item.exchange || 'NSE'}:${item.symbol}`;
        setOnboardStocks(prev => {
          const exists = prev.some(s => `${s.exchange || 'NSE'}:${s.symbol}` === key);
          if (exists) return prev.filter(s => `${s.exchange || 'NSE'}:${s.symbol}` !== key);
          return [...prev, item];
        });
      };

      const handleCreateWatchlist = async (e) => {
        e.preventDefault();
        if (!newListName.trim()) return;
        try {
          const res = await api.post('/watchlists', { name: newListName.trim() });
          applyWatchlistPayload(res.data?.data);
          if (res.data?.watchlist_id) setActiveWlId(res.data.watchlist_id);
          setNewListName('');
          setShowCreateInput(false);
          showToast('Watchlist created');
        } catch (err) {
          showToast(err.response?.data?.detail || 'Could not create watchlist');
        }
      };

      const handleRenameWatchlist = async (e) => {
        e.preventDefault();
        if (!activeList || !renameValue.trim()) return;
        try {
          const res = await api.put(`/watchlists/${activeList.id}`, { name: renameValue.trim() });
          applyWatchlistPayload(res.data?.data);
          setRenamingList(false);
          showToast('Watchlist renamed');
        } catch (err) {
          showToast(err.response?.data?.detail || 'Rename failed');
        }
      };

      const handleDuplicateWatchlist = async () => {
        if (!activeList) return;
        try {
          const res = await api.post(`/watchlists/${activeList.id}/duplicate`);
          applyWatchlistPayload(res.data?.data);
          if (res.data?.watchlist_id) setActiveWlId(res.data.watchlist_id);
          showToast(`Duplicated "${activeList.name}"`);
        } catch (err) {
          showToast(err.response?.data?.detail || 'Duplicate failed');
        }
      };

      const handleDeleteWatchlist = async () => {
        if (!activeList || watchlists.length <= 1) return;
        if (!confirm(`Delete watchlist "${activeList.name}"?`)) return;
        try {
          const res = await api.delete(`/watchlists/${activeList.id}`);
          applyWatchlistPayload(res.data?.data);
          const lists = res.data?.data?.watchlists || [];
          if (lists.length > 0) setActiveWlId(lists[0].id);
          showToast('Watchlist deleted');
        } catch (err) {
          showToast(err.response?.data?.detail || 'Delete failed');
        }
      };

      const handleAddStock = async (item) => {
        if (!activeList) return;
        const key = `${item.exchange || 'NSE'}:${item.symbol}`;
        setAddingTicker(key);
        try {
          const res = await api.post(`/watchlists/${activeList.id}/stocks`, {
            symbol: item.symbol,
            exchange: item.exchange || 'NSE',
            company_name: item.name,
            sector: item.sector || 'Equities'
          });
          applyWatchlistPayload(res.data?.data);
          showToast(`Added ${item.symbol} to ${activeList.name}`);
        } catch (err) {
          showToast(err.response?.data?.detail || 'Could not add stock');
        } finally {
          setAddingTicker('');
        }
      };

      const handleRemoveStock = async (stockItem, e) => {
        if (e) e.stopPropagation();
        if (!activeList) return;
        try {
          const res = await api.delete(`/watchlists/${activeList.id}/stocks/${stockItem.id}`);
          applyWatchlistPayload(res.data?.data);
          if (selectedDetailStock?.id === stockItem.id) {
            setSelectedDetailStock(null);
          }
          showToast(`Removed ${stockItem.symbol}`);
        } catch (err) {
          showToast('Could not remove stock');
        }
      };

      const handleMoveStock = async (stockItem, targetWlId, keepCopy = false) => {
        if (!activeList) return;
        try {
          const res = await api.post(`/watchlists/${activeList.id}/stocks/${stockItem.id}/move`, {
            target_watchlist_id: targetWlId,
            keep_copy: keepCopy
          });
          applyWatchlistPayload(res.data?.data);
          setMoveMenuStockId(null);
          const targetObj = watchlists.find(w => w.id === targetWlId);
          showToast(`${keepCopy ? 'Copied' : 'Moved'} ${stockItem.symbol} to ${targetObj?.name || 'list'}`);
        } catch (err) {
          showToast('Move failed');
        }
      };

      const handleStepOrder = async (index, direction, e) => {
        if (e) e.stopPropagation();
        if (!activeList || !activeList.stocks) return;
        const arr = [...activeList.stocks];
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= arr.length) return;
        const temp = arr[index];
        arr[index] = arr[targetIndex];
        arr[targetIndex] = temp;
        const orderedIds = arr.map(s => s.id);
        try {
          const res = await api.put(`/watchlists/${activeList.id}/reorder`, {
            ordered_item_ids: orderedIds
          });
          applyWatchlistPayload(res.data?.data);
        } catch (err) {}
      };

      const fmtNum = (val) => {
        if (val === null || val === undefined || isNaN(Number(val))) return '—';
        return Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

      const fmtPct = (val, withSign = true) => {
        if (val === null || val === undefined || isNaN(Number(val))) return '—';
        const n = Number(val);
        const sign = withSign && n > 0 ? '+' : '';
        return `${sign}${n.toFixed(2)}%`;
      };

      const fmtPts = (val) => {
        if (val === null || val === undefined || isNaN(Number(val))) return '—';
        const n = Number(val);
        const sign = n > 0 ? '+' : '';
        return `${sign}${n.toFixed(2)} pts`;
      };

      // Helpers to extract timeframe-aware metrics for a stock
      const getStockPerf = (stk, tf = selectedTf) => {
        if (stk?.perf && stk.perf[tf] !== undefined && stk.perf[tf] !== null) return Number(stk.perf[tf]);
        if (tf === '1D' && stk?.change_pct !== undefined && stk?.change_pct !== null) return Number(stk.change_pct);
        return null;
      };
      const getSectorPerf = (stk, tf = selectedTf) => {
        if (stk?.sector_perf && stk.sector_perf[tf] !== undefined && stk.sector_perf[tf] !== null) return Number(stk.sector_perf[tf]);
        return null;
      };
      const getNifty50Perf = (stk, tf = selectedTf) => {
        if (stk?.nifty50_perf && stk.nifty50_perf[tf] !== undefined && stk.nifty50_perf[tf] !== null) return Number(stk.nifty50_perf[tf]);
        if (benchmarks?.nifty50?.perf && benchmarks.nifty50.perf[tf] !== undefined) return Number(benchmarks.nifty50.perf[tf]);
        return null;
      };
      const getNifty500Perf = (stk, tf = selectedTf) => {
        if (stk?.nifty500_perf && stk.nifty500_perf[tf] !== undefined && stk.nifty500_perf[tf] !== null) return Number(stk.nifty500_perf[tf]);
        if (benchmarks?.nifty500?.perf && benchmarks.nifty500.perf[tf] !== undefined) return Number(benchmarks.nifty500.perf[tf]);
        return null;
      };
      const getRelVsSector = (stk, tf = selectedTf) => {
        if (stk?.rel_vs_sector && stk.rel_vs_sector[tf] !== undefined && stk.rel_vs_sector[tf] !== null) return Number(stk.rel_vs_sector[tf]);
        const sp = getStockPerf(stk, tf);
        const secp = getSectorPerf(stk, tf);
        if (sp !== null && secp !== null) return Number((sp - secp).toFixed(2));
        return null;
      };
      const getRelVsNifty50 = (stk, tf = selectedTf) => {
        if (stk?.rel_vs_nifty50 && stk.rel_vs_nifty50[tf] !== undefined && stk.rel_vs_nifty50[tf] !== null) return Number(stk.rel_vs_nifty50[tf]);
        const sp = getStockPerf(stk, tf);
        const np = getNifty50Perf(stk, tf);
        if (sp !== null && np !== null) return Number((sp - np).toFixed(2));
        return null;
      };
      const getRelVsNifty500 = (stk, tf = selectedTf) => {
        if (stk?.rel_vs_nifty500 && stk.rel_vs_nifty500[tf] !== undefined && stk.rel_vs_nifty500[tf] !== null) return Number(stk.rel_vs_nifty500[tf]);
        const sp = getStockPerf(stk, tf);
        const np500 = getNifty500Perf(stk, tf);
        if (sp !== null && np500 !== null) return Number((sp - np500).toFixed(2));
        return null;
      };

      // Filtered and sorted stocks for the main Stock vs Sector vs Market table
      const filteredSortedStocks = useMemo(() => {
        const list = activeList?.stocks || [];
        const q = tableFilterQuery.trim().toLowerCase();
        const filtered = list.filter(s => {
          if (tableSectorFilter !== 'ALL' && s.sector !== tableSectorFilter) return false;
          if (!q) return true;
          return (
            (s.symbol || '').toLowerCase().includes(q) ||
            (s.name || '').toLowerCase().includes(q) ||
            (s.sector || '').toLowerCase().includes(q)
          );
        });

        if (sortBy === 'custom') return filtered;

        const sorted = [...filtered].sort((a, b) => {
          if (sortBy === 'sector_name') {
            const cmp = (a.sector || '').localeCompare(b.sector || '');
            return sortDir === 'asc' ? cmp : -cmp;
          }
          let va = -999999;
          let vb = -999999;
          if (sortBy === 'stock_perf') {
            va = getStockPerf(a, selectedTf) ?? -999999;
            vb = getStockPerf(b, selectedTf) ?? -999999;
          } else if (sortBy === 'sector_perf') {
            va = getSectorPerf(a, selectedTf) ?? -999999;
            vb = getSectorPerf(b, selectedTf) ?? -999999;
          } else if (sortBy === 'rel_sector') {
            va = getRelVsSector(a, selectedTf) ?? -999999;
            vb = getRelVsSector(b, selectedTf) ?? -999999;
          } else if (sortBy === 'rel_nifty50') {
            va = getRelVsNifty50(a, selectedTf) ?? -999999;
            vb = getRelVsNifty50(b, selectedTf) ?? -999999;
          }
          return sortDir === 'asc' ? va - vb : vb - va;
        });
        return sorted;
      }, [activeList?.stocks, tableFilterQuery, tableSectorFilter, sortBy, sortDir, selectedTf]);

      const toggleSort = (field) => {
        if (sortBy === field) {
          if (sortDir === 'desc') setSortDir('asc');
          else {
            setSortBy('custom');
            setSortDir('desc');
          }
        } else {
          setSortBy(field);
          setSortDir('desc');
        }
      };

      // Build SVG path for Stock Performance Modal
      const buildPerformanceChart = () => {
        const pts = chartData?.candles || [];
        if (pts.length < 2) return null;
        const closes = pts.map(p => p.close);
        const minP = Math.min(...closes);
        const maxP = Math.max(...closes);
        const span = Math.max(maxP - minP, 0.5);
        const W = 760;
        const H = 240;
        const padX = 16;
        const padY = 20;
        const plotW = W - padX * 2;
        const plotH = H - padY * 2;

        const coords = pts.map((p, i) => {
          const x = padX + (i / (pts.length - 1)) * plotW;
          const y = padY + ((maxP - p.close) / span) * plotH;
          return { x, y, raw: p };
        });

        const linePath = coords.map((c, idx) => `${idx === 0 ? 'M' : 'L'}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
        const areaPath = `${linePath} L${coords[coords.length - 1].x.toFixed(1)},${H - padY} L${coords[0].x.toFixed(1)},${H - padY} Z`;
        const isPositive = closes[closes.length - 1] >= closes[0];

        return { W, H, coords, linePath, areaPath, isPositive, minP, maxP };
      };

      const perfChart = buildPerformanceChart();
      const existingSet = new Set((activeList?.stocks || []).map(s => `${s.exchange}:${s.symbol}`));
      const onboardSet = new Set(onboardStocks.map(s => `${s.exchange || 'NSE'}:${s.symbol}`));

      // Active timeframe summary metrics
      const activeWlPerf = activeList?.perf_by_tf?.[selectedTf] ?? activeList?.avg_change_pct ?? 0;
      const activeAdvances = activeList?.advances_by_tf?.[selectedTf] ?? activeList?.advances ?? 0;
      const activeDeclines = activeList?.declines_by_tf?.[selectedTf] ?? activeList?.declines ?? 0;
      const nifty50TfPerf = benchmarks?.nifty50?.perf?.[selectedTf] ?? null;
      const nifty500TfPerf = benchmarks?.nifty500?.perf?.[selectedTf] ?? null;
      const wlVsNifty50 = nifty50TfPerf !== null && activeList?.stock_count > 0
        ? Number((activeWlPerf - nifty50TfPerf).toFixed(2))
        : null;
      const activeInsights = activeList?.intelligence?.[selectedTf] || [];
      const availableSectors = useMemo(() => {
        const secs = (activeList?.sectors || []).map(s => s.sector);
        return ['ALL', ...secs];
      }, [activeList?.sectors]);

      // FIRST-TIME ONBOARDING EXPERIENCE
      if (!loading && needsOnboarding) {
        return (
          <section className={`max-w-4xl mx-auto rounded-3xl p-6 sm:p-10 transition-colors duration-300 select-none ${
            isLight
              ? 'bg-[#F5F5F7] text-[#1D1D1F] border border-black/[0.06] shadow-sm'
              : 'bg-[#0B101B] text-slate-100 border border-white/[0.07]'
          }`}>
            <div className="max-w-2xl">
              <span className="text-[11px] font-semibold uppercase tracking-widest text-blue-400">
                Personal Research Workspace
              </span>
              <h1 className={`text-3xl sm:text-4xl font-semibold tracking-tight mt-2 ${isLight ? 'text-[#1D1D1F]' : 'text-white'}`}>
                Build Your First Watchlist
              </h1>
              <p className="text-sm text-slate-400 mt-2 leading-relaxed">
                Track NSE and BSE stocks organized automatically by sector, and measure every holding against its sector benchmark, Nifty 50, and Nifty 500.
              </p>
            </div>

            <form onSubmit={handleCompleteOnboarding} className="mt-8 space-y-6">
              <div>
                <label className="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">
                  1. Name Your Watchlist
                </label>
                <input
                  type="text"
                  required
                  value={onboardName}
                  onChange={e => setOnboardName(e.target.value)}
                  placeholder="e.g. Core Leaders, High Relative Strength, Swing Book..."
                  className={`w-full max-w-md px-4 py-2.5 rounded-2xl text-sm font-medium border focus:outline-none ${
                    isLight
                      ? 'bg-white border-black/15 text-slate-900'
                      : 'bg-[#111827] border-white/15 text-white'
                  }`}
                />
              </div>

              <div>
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
                  <label className="block text-xs font-medium uppercase tracking-wider text-slate-400">
                    2. Search & Select Stocks from NSE / BSE ({onboardStocks.length} Selected)
                  </label>
                  {onboardStocks.length > 0 && (
                    <div className="flex flex-wrap gap-1.5">
                      {onboardStocks.map(s => (
                        <button
                          key={`${s.exchange}:${s.symbol}`}
                          type="button"
                          onClick={() => toggleOnboardStock(s)}
                          className="px-2.5 py-1 rounded-full text-xs font-medium bg-blue-600/20 text-blue-300 border border-blue-500/30 hover:bg-rose-500/20 hover:text-rose-300 transition-colors"
                        >
                          {s.symbol} ×
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                <div className="flex flex-col sm:flex-row gap-2.5 mb-3">
                  <input
                    type="text"
                    placeholder="Search by symbol or company name (e.g. HDFCBANK, TCS, RELIANCE, SUNPHARMA)..."
                    value={onboardQuery}
                    onChange={e => setOnboardQuery(e.target.value)}
                    className={`flex-1 px-4 py-2.5 rounded-2xl text-sm border focus:outline-none ${
                      isLight
                        ? 'bg-white border-black/10 text-slate-900 placeholder-slate-400'
                        : 'bg-[#111827] border-white/10 text-white placeholder-slate-500'
                    }`}
                  />
                  <div className={`inline-flex rounded-2xl p-1 border ${
                    isLight ? 'bg-white border-black/10' : 'bg-[#111827] border-white/10'
                  }`}>
                    {['ALL', 'NSE', 'BSE'].map(ex => (
                      <button
                        key={ex}
                        type="button"
                        onClick={() => setOnboardExch(ex)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-medium ${
                          onboardExch === ex ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                        }`}
                      >
                        {ex}
                      </button>
                    ))}
                  </div>
                </div>

                <div className={`rounded-2xl border max-h-[300px] overflow-y-auto divide-y ${

    function RulesManager({ onBack }) {
      const [rules, setRules] = useState([]);

      const [minChange, setMinChange] = useState(1.0);
      const [minVol, setMinVol] = useState(1.5);

      const fetchRules = async () => {
        try {
          const res = await api.get('/screener/rules');
          setRules(res.data);
        } catch (e) {}
      };

      useEffect(() => { fetchRules(); }, []);

      const handleCreate = async (e) => {
        e.preventDefault();
        try {
          await api.post('/screener/rules', {
            name,
            universe,
            is_active: true,
            criteria: {
              min_change_pct: Number(minChange),
              min_volume_ratio: Number(minVol)
            }
          });
          setName('');
          fetchRules();

    // ----------------- USERS MANAGER ----------------- //
    function UsersManager({ onBack }) {
      const [users, setUsers] = useState([]);
      const [uName, setUName] = useState('');
      const [pwd, setPwd] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('viewer');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');

      const fetchUsers = async () => {
        setLoading(true);
        try {
          const res = await api.get('/users/');
          setUsers(Array.isArray(res.data) ? res.data : []);
        } catch (e) {
          setError('Failed to fetch user accounts');
        } finally {
          setLoading(false);
        }
      };

      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => { fetchUsers(); }, []);

      const handleAdd = async (e) => {
        e.preventDefault();
        setError('');
        setSuccess('');

        if (!uName.trim()) {
          setError('Please provide a username');
          return;
        }
        if (!pwd || pwd.length < 4) {
          setError('Password must be at least 4 characters');
          return;
        }

        setIsSubmitting(true);
        try {
          const payload = {
            username: uName.trim(),
            password: pwd,
            email: email.trim() || null,
            role: role
          };
          const res = await api.post('/users/', payload);
          if (res.data) {
            setUName('');
            setPwd('');
            setEmail('');
            setSuccess(`User "${res.data.username}" created successfully`);
            fetchUsers();
          }
        } catch (e) {
          const detail = e.response?.data?.detail;
          if (Array.isArray(detail)) {
            setError(detail.map(d => d.msg || d).join(', '));
          } else {
            setError(detail || e.message || 'Failed to create user');
          }
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleDelete = async (id, name) => {
        if (!confirm(`Are you sure you want to delete user "${name}"?`)) return;
        try {

    // ----------------- BROKER AUTH VIEW ----------------- //
    function BrokerAuthView({ brokerSession, onConnected, onBack }) {
      const [authMode, setAuthMode] = useState('token'); // 'token' | 'pintotp'
      const [clientId, setClientId] = useState(brokerSession?.client_id || '1105208739');
      const [apiSecret, setApiSecret] = useState('');
      const [token, setToken] = useState('');
      const [pin, setPin] = useState('');
      const [totp, setTotp] = useState('');
      const [loading, setLoading] = useState(false);
      const [verifying, setVerifying] = useState(false);
      const [disconnecting, setDisconnecting] = useState(false);
      const [msg, setMsg] = useState('');
      const [error, setError] = useState('');

      const isLive = Boolean(brokerSession?.authenticated);

      const handleVerifyNow = async () => {
        setVerifying(true);
        setMsg('');
        setError('');
        try {
          const res = await api.get('/auth/session-status');
          await onConnected();
          if (res.data?.authenticated) {
            setMsg(`Verified: Dhan Broker is LIVE (Client ID: ${res.data.client_id || clientId}).`);
          } else {
            setError('Dhan Broker is NOT CONNECTED or the access token has expired. Please authenticate below.');
          }
        } catch (err) {
          setError('Failed to verify broker connection status.');
        } finally {
          setVerifying(false);
        }
      };

      const handleDisconnect = async () => {
        if (!confirm('Disconnect Dhan Broker session on the server?')) return;
        setDisconnecting(true);
        setMsg('');
        setError('');
        try {
          await api.post('/auth/dhan-logout');
          await onConnected();
          setMsg('Dhan Broker session disconnected.');
        } catch (err) {
          setError(err.response?.data?.detail || 'Failed to disconnect broker session');
        } finally {
          setDisconnecting(false);
        }
      };

      const handleConnect = async (e) => {
        e.preventDefault();
        setMsg('');
        setError('');
        setLoading(true);
        try {
          const payload = authMode === 'pintotp'
            ? {
                api_key: clientId.trim(),
                pin: pin.trim(),
                totp: totp.trim()
              }
            : {
                api_key: clientId.trim(),
                api_secret: apiSecret.trim() || null,
                request_token: token.trim()
              };
          await api.post('/auth/dhan-login', payload);
          setToken('');
          setPin('');
          setTotp('');
          setMsg('Dhan Broker connection established and verified LIVE on server.');
          await onConnected();
        } catch (err) {
          setError(err.response?.data?.detail || 'Broker connection failed');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-2xl mx-auto space-y-5 text-xs font-sans animate-fade-in">
          <div className="flex items-center justify-between pb-3 border-b border-[#1A2538]">
            <div>
              <h2 className="text-base font-bold text-white">Dhan HQ Broker Control Panel (Admin)</h2>
              <p className="text-slate-400 text-xs">Monitor live broker feed health and manage API authentication</p>
            </div>
            <button onClick={onBack} className="px-3 py-1.5 bg-[#131B2E] text-slate-300 rounded-lg border border-[#223049] hover:text-white">
              ← Return
            </button>
          </div>

          {/* Live Connection Status Banner Card */}
          <div className={`rounded-xl p-5 border shadow-sm ${
            isLive
              ? 'bg-gradient-to-br from-[#0B1F1A] to-[#0C1422] border-emerald-500/40'
              : 'bg-gradient-to-br from-[#231016] to-[#0C1422] border-rose-500/40'
          }`}>
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-white/10">
              <div className="flex items-center space-x-3">
                <div className={`w-3.5 h-3.5 rounded-full shrink-0 ${
                  isLive ? 'bg-emerald-400 animate-pulse shadow-lg shadow-emerald-400/50' : 'bg-rose-500 shadow-lg shadow-rose-500/50'
                }`}></div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="text-sm font-bold text-white tracking-wide">
                      {isLive ? 'BROKER STATUS: LIVE & CONNECTED' : 'BROKER STATUS: NOT CONNECTED'}
                    </span>
                    <span className={`px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase ${
                      isLive
                        ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                        : 'bg-rose-500/20 text-rose-300 border border-rose-500/40'
                    }`}>
                      {isLive ? 'ACTIVE' : 'OFFLINE'}
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-300 mt-0.5">
                    {isLive
                      ? 'DhanHQ v2 API is actively streaming real-time NSE/BSE index & equity quotes.'
                      : 'No valid Dhan session token active. Authenticate below to restore live broker feed.'}
                  </p>
                </div>
              </div>

              <div className="flex items-center space-x-2 shrink-0 font-mono">
                <button
                  type="button"
                  onClick={handleVerifyNow}
                  disabled={verifying}
                  className="px-3 py-1.5 rounded-lg bg-[#142033] hover:bg-[#1B2C46] text-slate-200 border border-[#263A5C] text-[11px] font-semibold transition-colors disabled:opacity-50"
                >
                  {verifying ? 'Checking...' : '↻ Verify Status'}
                </button>
                {isLive && (
                  <button
                    type="button"
                    onClick={handleDisconnect}
                    disabled={disconnecting}
                    className="px-3 py-1.5 rounded-lg bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/30 text-[11px] font-semibold transition-colors disabled:opacity-50"
                  >
                    {disconnecting ? 'Disconnecting...' : 'Disconnect'}
                  </button>
                )}
              </div>
            </div>

            {/* Connection Details Grid */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-4 font-mono">
              <div className="bg-[#090E18]/80 border border-white/10 rounded-lg p-2.5">
                <span className="text-[10px] text-slate-400 uppercase block">Client ID</span>
                <span className="text-xs font-bold text-white">{isLive ? (brokerSession?.client_id || '1105208739') : '—'}</span>
              </div>
              <div className="bg-[#090E18]/80 border border-white/10 rounded-lg p-2.5">
                <span className="text-[10px] text-slate-400 uppercase block">Token Expiry</span>
                <span className="text-xs font-bold text-amber-300">{isLive ? (brokerSession?.token_validity || 'Active Session') : 'Expired / None'}</span>
              </div>
              <div className="bg-[#090E18]/80 border border-white/10 rounded-lg p-2.5">
                <span className="text-[10px] text-slate-400 uppercase block">Data Plan & Segments</span>
                <span className="text-xs font-bold text-cyan-300">
                  {isLive ? `${brokerSession?.data_plan || 'Active'} (${brokerSession?.active_segment || 'NSE, F&O'})` : '—'}
                </span>
              </div>
              <div className="bg-[#090E18]/80 border border-white/10 rounded-lg p-2.5">
                <span className="text-[10px] text-slate-400 uppercase block">NSE Market Hours</span>
                <span className={`text-xs font-bold ${brokerSession?.market_open ? 'text-emerald-400' : 'text-slate-300'}`}>
                  {brokerSession?.market_open ? 'OPEN (LIVE)' : 'CLOSED (EOD)'}
                </span>
              </div>
            </div>
          </div>

          <div className="bg-[#0E1524] border border-[#1C273C] rounded-xl p-5 space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-xs font-bold uppercase font-mono tracking-wider text-slate-300">
                {isLive ? 'Update / Renew Dhan Broker Token' : 'Connect Dhan Broker Account'}
              </h3>
              {brokerSession?.last_updated && (
                <span className="text-[10px] font-mono text-slate-500">
                  Last Updated: {new Date(brokerSession.last_updated).toLocaleString()}
                </span>
              )}
            </div>

            {/* Auth Mode Toggle */}
            <div className="grid grid-cols-2 gap-1 bg-[#090E18] p-1 rounded-lg border border-[#1A2538]">
              <button
                type="button"
                onClick={() => setAuthMode('token')}
                className={`py-1.5 rounded text-xs font-semibold transition-colors ${
                  authMode === 'token' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                Direct Access Token
              </button>
              <button
                type="button"
                onClick={() => setAuthMode('pintotp')}
                className={`py-1.5 rounded text-xs font-semibold transition-colors ${
                  authMode === 'pintotp' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                PIN + TOTP Auto-Gen
              </button>
            </div>

            {error && <div className="p-2.5 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded text-xs font-mono">{error}</div>}
            {msg && <div className="p-2.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded text-xs font-mono">{msg}</div>}

            <form onSubmit={handleConnect} className="space-y-3">
              <div>
                <label className="block text-slate-300 mb-1">Dhan Client ID *</label>
                <input type="text" required value={clientId} onChange={e => setClientId(e.target.value)} placeholder="10-digit Client ID (e.g. 1105208739)" className="w-full px-3 py-1.5 bg-[#090E18] border border-[#1F2B40] rounded text-white font-mono" />
              </div>

              {authMode === 'token' ? (
                <>
                  <div>
                    <label className="block text-slate-300 mb-1">API Secret (Optional)</label>
                    <input type="password" value={apiSecret} onChange={e => setApiSecret(e.target.value)} placeholder="Leave blank if pasting direct Access Token" className="w-full px-3 py-1.5 bg-[#090E18] border border-[#1F2B40] rounded text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-300 mb-1">Dhan Access Token *</label>
                    <textarea rows={3} required value={token} onChange={e => setToken(e.target.value)} placeholder="Paste JWT Access Token from web.dhan.co -> My Profile -> DhanHQ Trading APIs" className="w-full px-3 py-1.5 bg-[#090E18] border border-[#1F2B40] rounded text-white font-mono" />
                  </div>
                </>
              ) : (
                <>
                  <div>
                    <label className="block text-slate-300 mb-1">6-Digit Dhan PIN *</label>
                    <input type="password" required value={pin} onChange={e => setPin(e.target.value)} placeholder="e.g. 140503" className="w-full px-3 py-1.5 bg-[#090E18] border border-[#1F2B40] rounded text-white font-mono" />
                  </div>
                  <div>
                    <label className="block text-slate-300 mb-1">6-Digit Authenticator TOTP Code (or Base32 TOTP Secret) *</label>
                    <input type="text" required value={totp} onChange={e => setTotp(e.target.value)} placeholder="Enter live 6-digit TOTP code or Base32 Secret Key" className="w-full px-3 py-1.5 bg-[#090E18] border border-[#1F2B40] rounded text-white font-mono" />
                  </div>
                </>
              )}

              <button type="submit" disabled={loading} className="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded transition-colors">
                {loading ? 'Validating with Dhan HQ...' : (isLive ? 'Update / Re-Connect Dhan Token' : 'Connect Dhan Broker Account')}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function TelegramAlertsView({ onStatusChange, onBack }) {
      const [botToken, setBotToken] = useState('');
      const [channelId, setChannelId] = useState('');
      const [isEnabled, setIsEnabled] = useState(false);
      const [alertHps, setAlertHps] = useState(true);
      const [alertMeanRev, setAlertMeanRev] = useState(true);
      const [botUsername, setBotUsername] = useState('');
      const [botTokenMasked, setBotTokenMasked] = useState('');
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [toggling, setToggling] = useState(false);
      const [broadcasting, setBroadcasting] = useState(false);
      const [testing, setTesting] = useState(false);
      const [statusMsg, setStatusMsg] = useState({ type: '', text: '' });
      const [testChatId, setTestChatId] = useState('');

      const fetchConfig = async () => {
        setLoading(true);
        try {
          const res = await api.get('/telegram/config');
          if (res.data && res.data.status === 'success') {
            setIsEnabled(res.data.is_enabled);
            setBotUsername(res.data.bot_username || '');
            setBotTokenMasked(res.data.bot_token_masked || '');
            setChannelId(res.data.default_channel_id || '');
            setAlertHps(res.data.alert_on_hps_breakout !== false);
            setAlertMeanRev(res.data.alert_on_mean_reversion !== false);
            setTestChatId(res.data.default_channel_id || '');
          }
        } catch (e) {
          console.error("Failed to fetch telegram config:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchConfig();
      }, []);

      const handleQuickToggle = async (targetEnabled) => {
        setToggling(true);
        setStatusMsg({ type: '', text: '' });
        try {
          const res = await api.post('/telegram/toggle-pause', { is_enabled: targetEnabled });
          setIsEnabled(Boolean(res.data?.is_enabled));
          setStatusMsg({
            type: 'success',
            text: res.data?.message || (targetEnabled ? 'Telegram notifications resumed (Active).' : 'Telegram notifications paused.')
          });
          if (onStatusChange) onStatusChange();
        } catch (e) {
          setStatusMsg({ type: 'error', text: e.response?.data?.detail || 'Failed to toggle Telegram notification state' });
        } finally {
          setToggling(false);
        }
      };

      const handleBroadcastNow = async () => {
        setBroadcasting(true);
        setStatusMsg({ type: '', text: '' });
        try {
          const res = await api.post('/telegram/broadcast-now');
          setStatusMsg({
            type: 'success',
            text: res.data?.message || 'Live HPS scan notification dispatched to Telegram recipients!'
          });
        } catch (e) {
          setStatusMsg({ type: 'error', text: e.response?.data?.detail || 'Failed to dispatch live scan notification' });
        } finally {
          setBroadcasting(false);
        }
      };

      const handleSave = async (e) => {
        e.preventDefault();
        setSaving(true);
        setStatusMsg({ type: '', text: '' });
        try {
          const payload = {
            is_enabled: isEnabled,
            default_channel_id: channelId,
            alert_on_hps_breakout: alertHps,
            alert_on_mean_reversion: alertMeanRev
          };
          if (botToken.trim()) {
            payload.bot_token = botToken.trim();
          }
          const res = await api.put('/telegram/config', payload);
          setStatusMsg({ type: 'success', text: 'Telegram configuration updated successfully!' });
          setBotToken('');
          fetchConfig();
          if (onStatusChange) onStatusChange();
        } catch (e) {
          setStatusMsg({ type: 'error', text: e.response?.data?.detail || 'Failed to update configuration' });
        } finally {
          setSaving(false);
        }
      };

      const handleSendTest = async () => {
        if (!testChatId.trim()) {
          setStatusMsg({ type: 'error', text: 'Please enter a target Channel ID, Group ID or User Chat ID to test' });
          return;
        }
        setTesting(true);
        setStatusMsg({ type: '', text: '' });
        try {
          const res = await api.post('/telegram/send-test', { chat_id: testChatId.trim() });
          setStatusMsg({ type: 'success', text: 'Test alert sent successfully to ' + testChatId });

        }

            </button>

          {/* Quick Control Bar: Send / Pause Notifications + Instant Broadcast */}

            isEnabled
              ? 'bg-gradient-to-br from-[#0B1F1A] to-[#0C1422] border-emerald-500/40'

            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
