                }`}></span>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="text-sm font-bold text-white tracking-wide">
                      {isEnabled ? 'NOTIFICATIONS: ACTIVE (SENDING EVERY 1 HOUR)' : 'NOTIFICATIONS: PAUSED (MUTED)'}
                    </span>
                    <span className={`px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase ${

                  <div>
                    <h3 className="font-semibold text-white mb-1">3. Third-Party Services</h3>
                    <p>Optional Telegram alert delivery uses your explicitly provided Telegram Chat ID solely for dispatching technical scanner notifications. You may disable or unlink Telegram notifications at any time from your Account settings.</p>
                  </div>
                </>
              )}
            </div>
            <div className="px-6 py-3.5 border-t border-[#1E293B] flex justify-end">
              <button onClick={onClose} className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition-colors">
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ----------------- LOGIN SCREEN ----------------- //
    function LoginScreen({ onLoginSuccess, onOpenLegal, legalModal }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await api.post('/auth/login', { username, password });
          onLoginSuccess({ username: res.data.username, role: res.data.role }, res.data.access_token);
        } catch (err) {
          setError(err.response?.data?.detail || 'Invalid username or password');
        } finally {
          setLoading(false);
        }
      };

      const [showLoginSplash, setShowLoginSplash] = useState(true);

      return (
        <>
          {showLoginSplash && (
            <BrandEntrySplash onComplete={() => setShowLoginSplash(false)} />
          )}
          <div className="min-h-screen bg-[#070A10] flex flex-col justify-center items-center px-4 py-8 font-sans select-none apple-app-shell">
          <div className="text-center mb-8 apple-stagger-1">
            <div className="inline-flex items-center justify-center p-3.5 rounded-2xl bg-[#0B101A]/90 border border-white/[0.08] mb-4 shadow-[0_8px_32px_rgba(0,0,0,0.6)] backdrop-blur-md">
              <AlphaQuantSymbol size={52} animated={true} variant="dark" />
            </div>
            <h1 className="text-2xl sm:text-3xl font-semibold text-white tracking-tight flex items-center justify-center space-x-1">
              <span>Alpha</span>
              <span className="font-normal text-slate-400">Quant</span>
            </h1>
          </div>

          <div className="w-full max-w-md bg-[#0D1422] border border-[#1B273E] rounded-2xl p-8 shadow-2xl apple-stagger-2">
            <h2 className="text-base font-semibold text-white mb-1">Sign In</h2>
            <p className="text-xs text-slate-400 mb-6">Enter your credentials to access your trading workspace</p>

            {error && (
              <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs rounded-lg">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-sm">
              <div>
                <label className="block text-slate-300 font-medium text-xs mb-1.5">Username</label>
                <input
                  type="text"
                  required
                  placeholder="Enter username"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-[#080C14] border border-[#1E2B40] rounded-lg text-white focus:outline-none focus:border-blue-500 font-mono text-sm"
                />
              </div>

              <div>
                <label className="block text-slate-300 font-medium text-xs mb-1.5">Password</label>
                <input
                  type="password"
                  required
                  placeholder="••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-[#080C14] border border-[#1E2B40] rounded-lg text-white focus:outline-none focus:border-blue-500 font-mono text-sm"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-semibold rounded-lg transition-colors mt-2 text-sm shadow-md shadow-blue-600/25"
              >
                {loading ? 'Authenticating...' : 'Sign In to Workspace'}
              </button>
            </form>
          </div>

          <div className="max-w-md text-center mt-6 space-y-2 text-[11px] text-slate-500 leading-relaxed">
            <p>
              For educational and quantitative research purposes only. Not SEBI-registered investment advice.
            </p>
            {onOpenLegal && (
              <div className="flex items-center justify-center space-x-3 text-slate-400">
                <button type="button" onClick={() => onOpenLegal('terms')} className="hover:text-white transition-colors">Terms &amp; Risk Disclosure</button>
                <span>·</span>
                <button type="button" onClick={() => onOpenLegal('privacy')} className="hover:text-white transition-colors">Privacy Policy</button>
              </div>
            )}
          </div>

          {legalModal && onOpenLegal && (
            <LegalComplianceModal type={legalModal} onClose={() => onOpenLegal(null)} />
          )}
        </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
