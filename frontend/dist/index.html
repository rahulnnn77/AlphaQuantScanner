    const api = axios.create({ baseURL: '/api/v1' });
    api.interceptors.request.use((cfg) => {
      const token = localStorage.getItem('alphaquant_token');
      if (token) cfg.headers.Authorization = `Bearer ${token}`;
      return cfg;
    });

    const formatPrice = (val) => Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const formatVolShort = (val) => {
      const num = Number(val);
      if (num >= 10000000) return (num / 10000000).toFixed(2) + ' Cr';
      if (num >= 100000) return (num / 100000).toFixed(2) + ' L';
      if (num >= 1000) return (num / 1000).toFixed(1) + ' K';
      return num.toLocaleString('en-IN');
    };

    function Sparkline({ isBull, points = [30, 28, 35, 32, 40, 38, 48, 45, 55, 52, 60] }) {
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = max - min || 1;
      const height = 20;
      const width = 56;
      const step = width / (points.length - 1);
      
      const polyPoints = points.map((p, idx) => {
        const x = idx * step;
        const y = height - ((p - min) / range) * (height - 4) - 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const strokeColor = isBull ? '#10B981' : '#F43F5E';
      return (
        <svg width={width} height={height} className="overflow-visible opacity-90 inline-block">
          <polyline
            fill="none"
            stroke={strokeColor}
            strokeWidth="1.5"
            strokeLinecap="round"
            strokeLinejoin="round"
            points={polyPoints}
          />
        </svg>
      );
    }

        const val = Math.max(-4, Math.min(4, pct));
        let bg, border, text, badgeBg, shadow;
        
        if (val > 0) {
          // Green gradients: from deep emerald to vibrant electric green for top gainers
          if (val >= 2.5) {
            bg = 'linear-gradient(145deg, #00873E 0%, #005F2B 100%)';

            text = '#FFFFFF';

    // ----------------- FEATURE 2: TERMINAL SCREENER TOOLS ----------------- //
    function TerminalScreener({ onSelectStock }) {
      const [stocks, setStocks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [universe, setUniverse] = useState('NIFTY50');
      const [search, setSearch] = useState('');
      const [filterTab, setFilterTab] = useState('ALL');
      const [sortCol, setSortCol] = useState('change_pct');
      const [sortDir, setSortDir] = useState('desc');

      const fetchQuotes = async (isManual = false) => {
        if (isManual) setRefreshing(true);
        try {
          const res = await api.get(`/screener/results?universe=${universe}`);
          setStocks(res.data);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      const scanNow = async () => {
        setRefreshing(true);
        try {
          const res = await api.post(`/screener/scan?universe=${universe}`);
          setStocks(res.data);
        } catch (e) {
          console.error(e);
        } finally {
          setRefreshing(false);
        }
      };

      useEffect(() => {
        fetchQuotes();
        const t = setInterval(fetchQuotes, 15000);
        return () => clearInterval(t);
      }, [universe]);

      const handleSort = (col) => {
        if (sortCol === col) {
          setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        } else {
          setSortCol(col);
          setSortDir('desc');
        }
      };

      const processedData = useMemo(() => {
        let list = stocks.filter(s => {
          const q = search.trim().toLowerCase();
          const matches = !q || s.symbol.toLowerCase().includes(q) || s.name.toLowerCase().includes(q);
          if (!matches) return false;
          if (filterTab === 'GAINERS') return s.change_pct > 0;
          if (filterTab === 'LOSERS') return s.change_pct < 0;
          if (filterTab === 'VOL_SURGE') return s.volume_surge_x >= 1.5;
          if (filterTab === 'BULL_MOMENTUM') return s.rsi >= 60;
          if (filterTab === 'OVERSOLD') return s.rsi <= 40;
          return true;
        });

        list.sort((a, b) => {
          let vA = a[sortCol];
          let vB = b[sortCol];
          if (typeof vA === 'string') return sortDir === 'asc' ? vA.localeCompare(vB) : vB.localeCompare(vA);
          return sortDir === 'asc' ? vA - vB : vB - vA;
        });

        return list;
      }, [stocks, search, filterTab, sortCol, sortDir]);

      return (
        <section className="pt-2">
          {/* Section Header */}
          <div className="flex items-center space-x-3 pb-3 border-b border-[#1A2538] mb-4">
            <span className="w-2 h-2 rounded-sm bg-indigo-500"></span>
            <h2 className="text-sm font-bold text-white tracking-wide uppercase">Screener Tools & Watchlist</h2>
            <span className="text-[10px] font-mono font-semibold px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">
              {universe}
            </span>
            <span className="text-xs text-slate-500 font-mono">
              {processedData.length} symbols matched
            </span>
          </div>

          {/* Split Two-Column: Left Tools Sidebar + Right Data Table */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            {/* Left Sidebar: Screener Controls & Filter Tools */}
            <aside className="lg:col-span-3 bg-[#0E1524] border border-[#1A2538] rounded-xl p-4 space-y-5 shadow-sm">
              <div className="border-b border-[#1A2538] pb-3">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Screener Tools</h3>
                <p className="text-[11px] text-slate-500 mt-0.5">Parameters & Strategy Filters</p>
              </div>

              {/* 1. Universe Selection */}
              <div className="space-y-1.5">
                <label className="text-[11px] font-semibold text-slate-300 uppercase tracking-wide">
                  Universe
                </label>
                <select
                  value={universe}
                  onChange={(e) => setUniverse(e.target.value)}
                  className="w-full bg-[#101726] border border-[#223049] text-slate-200 text-xs rounded-lg px-3 py-2 font-medium focus:outline-none focus:border-blue-500"
                >
                  <option value="NIFTY50">NSE: NIFTY 50 Benchmark</option>
                  <option value="BANKNIFTY">NSE: BANK NIFTY (Banking)</option>
                </select>
              </div>

              {/* 2. Execute Scan Button */}
              <div>
                <button
                  onClick={scanNow}
                  disabled={refreshing}

                    { id: 'OVERSOLD', label: 'Oversold RSI (<40)', count: stocks.filter(s => s.rsi <= 40).length }

                    return (

                        key={t.id}
                        onClick={() => setFilterTab(t.id)}
                        className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-all ${
                          isSelected
                            ? 'bg-blue-600 text-white font-semibold shadow-sm'
                            : 'bg-[#101726] text-slate-400 hover:text-slate-200 hover:bg-[#152033] border border-[#1A2538]'

                      >
                        <span>{t.label}</span>
                        <span className={`text-[10px] font-mono px-1.5 py-0.2 rounded ${

                        }`}>
                          {t.count}
                        </span>
                      </button>
                    );

                </div>

              {/* 5. Tool Info Card */}
              <div className="p-3 bg-[#0A0E17] border border-[#1A2538] rounded-lg text-[11px] space-y-1 text-slate-400">
                <div className="flex items-center justify-between text-slate-300 font-semibold">
                  <span>Feed Status</span>
                  <span className="text-emerald-400 font-mono">LIVE 15s</span>
                </div>
                <div>Automated periodic refresh running. Click symbol row to inspect candle metrics.</div>
              </div>
            </aside>

            {/* Right Main Table: Screener Results */}
            <div className="lg:col-span-9 bg-[#0E1524] border border-[#1C273C] rounded-xl overflow-hidden shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs tabular-nums border-collapse">
                  <thead className="bg-[#090E18] text-slate-400 uppercase font-mono text-[10px] tracking-wider border-b border-[#1C273C]">
                    <tr>
                      <th className="py-3 px-3.5 cursor-pointer hover:text-white" onClick={() => handleSort('symbol')}>
                        Instrument {sortCol === 'symbol' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('ltp')}>
                        LTP (₹) {sortCol === 'ltp' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('change_pct')}>
                        Chg % {sortCol === 'change_pct' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-center">Trend (Intraday)</th>
                      <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('high')}>
                        Day High / Low
                      </th>
                      <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('volume')}>
                        Volume {sortCol === 'volume' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-center cursor-pointer hover:text-white" onClick={() => handleSort('volume_surge_x')}>
                        Vol Spike {sortCol === 'volume_surge_x' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3 text-center cursor-pointer hover:text-white" onClick={() => handleSort('rsi')}>
                        RSI (14) {sortCol === 'rsi' && (sortDir === 'asc' ? '▲' : '▼')}
                      </th>
                      <th className="py-3 px-3.5">Triggered Signal</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#162133]">
                    {loading ? (
                      <tr>
                        <td colSpan={9} className="py-12 text-center text-slate-500 font-mono text-xs">
                          Loading market feed...
                        </td>
                      </tr>
                    ) : processedData.length === 0 ? (
                      <tr>
                        <td colSpan={9} className="py-12 text-center text-slate-500 font-mono text-xs">
                          No symbols matched the selected filter criteria.
                        </td>
                      </tr>
                    ) : (
                      processedData.map((s, idx) => {
                        const isBull = s.change_pct >= 0;
                        return (
                          <tr 
                            key={s.symbol} 
                            onClick={() => onSelectStock(s)}
                            className={`hover:bg-[#151F33] transition-colors cursor-pointer group ${
                              idx % 2 === 0 ? 'bg-[#0E1524]' : 'bg-[#0B111D]'
                            }`}
                          >
                            <td className="py-2.5 px-3.5">
                              <div className="font-semibold text-white tracking-wide text-xs">{s.symbol}</div>
                              <div className="text-[10px] text-slate-400 truncate max-w-[170px]">{s.name}</div>
                            </td>

                            <td className="py-2.5 px-3 text-right font-mono font-semibold text-white text-xs">
                              ₹{formatPrice(s.ltp)}

                            <td className="py-2.5 px-3 text-right font-mono font-semibold text-xs">
                              <span className={isBull ? 'text-emerald-400' : 'text-rose-400'}>
                                {isBull ? `+${s.change_pct.toFixed(2)}%` : `${s.change_pct.toFixed(2)}%`}

                            </td>

                            <td className="py-2.5 px-3 text-center">
                              <Sparkline isBull={isBull} points={isBull ? [20, 22, 28, 25, 34, 30, 42, 40, 52] : [55, 50, 48, 52, 40, 42, 35, 30, 22]} />

                            <td className="py-2.5 px-3 text-right font-mono text-[11px] text-slate-300 leading-tight">
                              <div>H: ₹{formatPrice(s.high)}</div>
                              <div className="text-slate-500 text-[10px]">L: ₹{formatPrice(s.low)}</div>
                            </td>

                            <td className="py-2.5 px-3 text-right font-mono text-slate-300 text-xs">
                              {formatVolShort(s.volume)}
                            </td>

                            <td className="py-2.5 px-3 text-center font-mono text-xs">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-semibold ${
                                s.volume_surge_x >= 1.5
                                  ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30'
                                  : 'text-slate-400'
                              }`}>
                                {s.volume_surge_x}x
                              </span>
                            </td>

                            <td className="py-2.5 px-3 text-center font-mono text-xs">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-semibold ${

                </table>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ----------------- FEATURE 3: HPS STOCKS (HIGH PROBABILITY SCREENER) ----------------- //
    function HpsScreenerSection({ onSelectStock }) {
      const [universe, setUniverse] = useState('nifty500'); // 'nifty500' or 'fo'
      const [activeTimeframe, setActiveTimeframe] = useState('daily'); // '4h', 'daily', 'weekly', 'monthly'
      const [dataByTimeframe, setDataByTimeframe] = useState({ '4h': [], 'daily': [], 'weekly': [], 'monthly': [] });
      const [counts, setCounts] = useState({ '4h': 0, 'daily': 0, 'weekly': 0, 'monthly': 0 });
      const [lastUpdated, setLastUpdated] = useState('');
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [breakoutFilter, setBreakoutFilter] = useState('ALL'); // 'ALL', 'BROKEN_ABOVE', 'BROKEN_BELOW'

      const fetchHpsData = async () => {
        setLoading(true);
        try {
          const res = await api.get(`/screener/hps?timeframe=all&universe=${universe}`);
          if (res.data && res.data.status === 'success') {
            setDataByTimeframe(res.data.data || {});
            setCounts(res.data.counts || {});
            setLastUpdated(res.data.last_updated || 'Updated recently');
          }
        } catch (e) {
          console.error("Failed to load HPS stock screener data:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchHpsData();
      }, [universe]);

      const currentList = dataByTimeframe[activeTimeframe] || [];
      const filteredList = currentList.filter(stk => {
        const matchesSearch = !searchQuery || 
          stk.symbol.toLowerCase().includes(searchQuery.toLowerCase()) || 
          (stk.name && stk.name.toLowerCase().includes(searchQuery.toLowerCase()));
        
        if (!matchesSearch) return false;
        if (breakoutFilter === 'BROKEN_ABOVE') return stk.status === 'BROKEN_ABOVE';
        if (breakoutFilter === 'BROKEN_BELOW') return stk.status === 'BROKEN_BELOW';
        return true;
      });

      const bullishCount = currentList.filter(s => s.status === 'BROKEN_ABOVE').length;
      const bearishCount = currentList.filter(s => s.status === 'BROKEN_BELOW').length;

      const timeframes = [
        { id: '4h', label: '4-Hour (4H)', desc: 'Intraday Swing' },
        { id: 'daily', label: 'Daily (1D)', desc: 'Daily Trend Break' },
        { id: 'weekly', label: 'Weekly (1W)', desc: 'Positional Trend' },
        { id: 'monthly', label: 'Monthly (1M)', desc: 'Macro Cycle' }
      ];

      return (
        <section className="space-y-5 animate-fade-in font-sans">
          {/* Top Banner / Header */}
          <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl p-5 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-3">
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                <h1 className="text-lg font-bold text-white tracking-tight">HPS Stocks (Breakout Tracker)</h1>
                <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 font-bold border border-cyan-500/25">
                  Multi-Timeframe Strategy
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                Stocks that triggered high-probability breakout and breakdown signals across key timeframe levels.
              </p>
            </div>

            {/* Universe Selector (NIFTY 500 vs NIFTY F&O) */}
            <div className="flex items-center space-x-2">
              <span className="text-xs font-mono text-slate-400">Universe:</span>
              <div className="flex items-center bg-[#090F1B] border border-[#1C273C] p-0.5 rounded-lg font-mono text-xs">
                <button
                  onClick={() => setUniverse('nifty500')}
                  className={`px-3 py-1.5 rounded-md font-semibold transition-all ${
                    universe === 'nifty500'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  NIFTY 500 (500 Stocks)
                </button>
                <button
                  onClick={() => setUniverse('fo')}
                  className={`px-3 py-1.5 rounded-md font-semibold transition-all ${
                    universe === 'fo'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  NIFTY F&O (213 Stocks)
                </button>
              </div>
            </div>
          </div>

          {/* Timeframe Tabs Selector with Dynamic Badge Counters */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            {timeframes.map(tf => {
              const isSelected = activeTimeframe === tf.id;
              const count = counts[tf.id] || 0;
              return (
                <button
                  key={tf.id}
                  onClick={() => setActiveTimeframe(tf.id)}
                  className={`p-3.5 rounded-xl border text-left transition-all ${
                    isSelected
                      ? 'bg-gradient-to-br from-[#12213A] to-[#0D1829] border-cyan-500/50 shadow-md shadow-cyan-900/20'
                      : 'bg-[#0E1524] border-[#1A2538] hover:border-[#273854] hover:bg-[#121B2D]'
                  }`}
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className={`text-xs font-bold uppercase tracking-wider font-mono ${
                      isSelected ? 'text-cyan-400' : 'text-slate-300'
                    }`}>
                      {tf.label}
                    </span>
                    <span className={`text-xs font-mono font-bold px-2 py-0.5 rounded ${
                      isSelected
                        ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'
                        : 'bg-[#152033] text-slate-400 border border-[#22334E]'
                    }`}>
                      {count} Stocks
                    </span>
                  </div>
                  <div className="text-[11px] text-slate-400">{tf.desc}</div>
                </button>
              );
            })}
          </div>

          {/* Controls Bar: Search, Breakout Filter & Refresh */}
          <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl p-3.5 flex flex-col md:flex-row md:items-center justify-between gap-3 font-mono">
            <div className="flex items-center space-x-2 flex-1 max-w-md">
              <span className="text-slate-500 text-xs">🔍</span>
              <input
                type="text"
                placeholder="Search symbol or company..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="w-full bg-[#0A0F1A] border border-[#1A2538] rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="text-slate-400 hover:text-white text-xs">
                  ✕
                </button>
              )}
            </div>

            <div className="flex items-center space-x-2">
              {/* Breakout Direction Filter */}
              <div className="flex items-center bg-[#0A0F1A] border border-[#1C273C] p-0.5 rounded-lg text-[11px]">
                <button
                  onClick={() => setBreakoutFilter('ALL')}
                  className={`px-2.5 py-1 rounded transition-all ${
                    breakoutFilter === 'ALL' ? 'bg-blue-600 text-white font-semibold' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  All ({currentList.length})
                </button>
                <button
                  onClick={() => setBreakoutFilter('BROKEN_ABOVE')}
                  className={`px-2.5 py-1 rounded transition-all ${
                    breakoutFilter === 'BROKEN_ABOVE' ? 'bg-emerald-600 text-white font-semibold' : 'text-emerald-400/80 hover:text-emerald-300'
                  }`}
                >
                  ▲ Bullish Breakout ({bullishCount})
                </button>
                <button
                  onClick={() => setBreakoutFilter('BROKEN_BELOW')}
                  className={`px-2.5 py-1 rounded transition-all ${
                    breakoutFilter === 'BROKEN_BELOW' ? 'bg-rose-600 text-white font-semibold' : 'text-rose-400/80 hover:text-rose-300'
                  }`}
                >
                  ▼ Bearish Breakdown ({bearishCount})
                </button>
              </div>

              {/* Export CSV Button */}
              <button
                onClick={() => {
                  if (!filteredList || filteredList.length === 0) return;
                  const headers = ['Symbol', 'Company Name', 'Sector', 'LTP (INR)', 'Spread (%)', 'Timeframe', 'Breakout Signal', 'Segment'];
                  const rows = filteredList.map(stk => [
                    `"${stk.symbol || ''}"`,
                    `"${(stk.name || '').replace(/"/g, '""')}"`,
                    `"${(stk.industry || '').replace(/"/g, '""')}"`,
                    stk.ltp != null ? stk.ltp : '',
                    stk.spread_pct != null ? stk.spread_pct : '',
                    `"${stk.timeframe || activeTimeframe.toUpperCase()}"`,
                    `"${stk.status === 'BROKEN_ABOVE' ? 'Bullish Breakout' : 'Bearish Breakdown'}"`,
                    `"${stk.is_fo ? 'NIFTY F&O' : 'Cash (EQ)'}"`
                  ]);
                  const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                  const url = URL.createObjectURL(blob);
                  const link = document.createElement('a');
                  link.href = url;
                  link.setAttribute('download', `HPS_Stocks_${universe}_${activeTimeframe}_${new Date().toISOString().slice(0, 10)}.csv`);
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);
                  URL.revokeObjectURL(url);
                }}
                disabled={loading || filteredList.length === 0}
                className="flex items-center space-x-1.5 px-3 py-1.5 bg-[#142338] hover:bg-[#1C3252] text-cyan-300 hover:text-cyan-200 text-xs rounded-lg border border-cyan-500/30 transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-sm"
                title="Download filtered stocks as CSV"
              >
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>Export CSV</span>
              </button>

              {/* Refresh Button */}
              <button
                onClick={fetchHpsData}
                disabled={loading}
                className="px-3 py-1.5 bg-[#142033] hover:bg-[#1A2B45] text-slate-300 text-xs rounded-lg border border-[#223554] transition-colors"
                title="Refresh list"
              >
                ↻ Refresh
              </button>
            </div>
          </div>

          {/* Screener Results Table for Selected Timeframe */}
          <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl overflow-hidden shadow-sm">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs font-mono tabular-nums">
                <thead className="bg-[#090F1B] text-slate-400 text-[11px] uppercase font-semibold border-b border-[#1A2538]">
                  <tr>
                    <th className="py-3 px-3.5 w-10 text-center">#</th>
                    <th className="py-3 px-3.5">Symbol</th>
                    <th className="py-3 px-3.5">Company Name</th>
                    <th className="py-3 px-3.5">Sector</th>
                    <th className="py-3 px-3.5 text-right">LTP (₹)</th>
                    <th className="py-3 px-3.5 text-right">Spread (%)</th>
                    <th className="py-3 px-3.5 text-center">Timeframe</th>
                    <th className="py-3 px-3.5 text-center">Breakout Signal</th>
                    <th className="py-3 px-3.5 text-center">Segment</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#151F33]">
                  {loading ? (
                    <tr>
                      <td colSpan={9} className="py-12 text-center text-slate-500 font-mono text-xs">
                        Loading HPS breakout stocks...
                      </td>
                    </tr>
                  ) : filteredList.length === 0 ? (
                    <tr>
                      <td colSpan={9} className="py-12 text-center text-slate-400 font-mono text-xs">
                        No stocks matched the HPS breakout criteria on the {activeTimeframe.toUpperCase()} timeframe in {universe.toUpperCase()}.
                      </td>
                    </tr>
                  ) : (
                    filteredList.map((stk, i) => {
                      const isBull = stk.status === 'BROKEN_ABOVE';
                      return (
                        <tr
                          key={stk.symbol}
                          onClick={() => onSelectStock({
                            symbol: stk.symbol,
                            name: stk.name,
                            ltp: stk.ltp,
                            change_pct: stk.diff_pct,
                            volume: 2450000
                          })}
                          className={`hover:bg-[#18253D] cursor-pointer transition-colors ${
                            i % 2 === 0 ? 'bg-[#0E1524]' : 'bg-[#0B111D]'
                          }`}
                        >
                          <td className="py-3 px-3.5 text-center text-slate-500 font-bold text-[10px]">
                            {i + 1}
                          </td>
                          <td className="py-3 px-3.5 font-bold text-blue-400 text-xs tracking-wide">
                            {stk.symbol}
                          </td>
                          <td className="py-3 px-3.5 text-slate-200 text-xs truncate max-w-[180px]">
                            {stk.name}
                          </td>
                          <td className="py-3 px-3.5 text-slate-400 text-[11px] truncate max-w-[140px]">
                            {stk.industry || 'Equities'}
                          </td>
                          <td className="py-3 px-3.5 text-right font-bold text-white text-xs">
                            ₹{stk.ltp.toLocaleString('en-IN', { minimumFractionDigits: 1 })}
                          </td>
                          <td className="py-3 px-3.5 text-right font-bold text-xs">
                            <span className={isBull ? 'text-emerald-400' : 'text-rose-400'}>
                              {isBull ? `+${stk.diff_pct}%` : `${stk.diff_pct}%`}
                            </span>
                          </td>
                          <td className="py-3 px-3.5 text-center">
                            <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-[#142033] text-cyan-300 border border-[#233550]">
                              {activeTimeframe.toUpperCase()}
                            </span>

    // ----------------- FEATURE 4: HPS MEAN REVERSION SCREENER ----------------- //

      const [level, setLevel] = useState('all'); // 'all', 'level1', 'level2', 'level3'
      const [dataByTimeframe, setDataByTimeframe] = useState({
        daily: { level1: [], level2: [], level3: [] },
        weekly: { level1: [], level2: [], level3: [] },
        monthly: { level1: [], level2: [], level3: [] }
      });
      const [counts, setCounts] = useState({
        daily: { level1: 0, level2: 0, level3: 0 },
        weekly: { level1: 0, level2: 0, level3: 0 },

      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');

        setLoading(true);
        try {
          const res = await api.get(`/screener/hps-mean-reversion?timeframe=all&level=all&universe=${universe}`);
          if (res.data && res.data.status === 'success') {
            setDataByTimeframe(res.data.data || {});
            setCounts(res.data.counts || {});
            setLastUpdated(res.data.last_updated || 'Updated recently');
          }
        } catch (e) {
          console.error("Failed to load HPS Mean Reversion screener data:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchMeanReversionData();
      }, [universe]);

      const tfData = dataByTimeframe[timeframe] || { level1: [], level2: [], level3: [] };
      const tfCounts = counts[timeframe] || { level1: 0, level2: 0, level3: 0 };
      const totalTfCount = (tfCounts.level1 || 0) + (tfCounts.level2 || 0) + (tfCounts.level3 || 0);

          ...(tfData.level1 || []),

      const [minChange, setMinChange] = useState(1.0);
      const [minVol, setMinVol] = useState(1.5);

      const fetchRules = async () => {
        try {
          const res = await api.get('/screener/rules');
          setRules(res.data);
        } catch (e) {}
      };

      useEffect(() => { fetchRules(); }, []);

      const handleCreate = async (e) => {
        e.preventDefault();
        try {
          await api.post('/screener/rules', {
            name,
            universe,
            is_active: true,
            criteria: {
              min_change_pct: Number(minChange),
              min_volume_ratio: Number(minVol)
            }
          });
          setName('');
          fetchRules();
        } catch (e) {
          alert('Failed to save rule');

      };

        await api.delete(`/screener/rules/${id}`);

      };

      return (
        <div className="space-y-4 max-w-4xl mx-auto text-xs">
          <div className="flex items-center justify-between pb-3 border-b border-[#1A2538]">

            <div>
              <label className="block text-slate-300 mb-1">Rule Name</label>
              <input type="text" required value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Volume Spike" className="w-full px-2.5 py-1.5 bg-[#090E18] border border-[#1F2B40] rounded text-white" />
            </div>
            <div>
              <label className="block text-slate-300 mb-1">Universe</label>
              <select value={universe} onChange={e => setUniverse(e.target.value)} className="w-full px-2.5 py-1.5 bg-[#090E18] border border-[#1F2B40] rounded text-white">
                <option value="NIFTY50">NIFTY 50</option>
                <option value="BANKNIFTY">BANK NIFTY</option>
              </select>
            </div>
            <div>
              <label className="block text-slate-300 mb-1">Min % Change</label>
              <input type="number" step="0.1" value={minChange} onChange={e => setMinChange(e.target.value)} className="w-full px-2.5 py-1.5 bg-[#090E18] border border-[#1F2B40] rounded text-white" />
            </div>
            <div className="flex items-end">
              <button type="submit" className="w-full py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded transition-colors">Save Rule</button>
            </div>
          </form>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {rules.map(r => (
              <div key={r.id} className="bg-[#0E1524] border border-[#1C273C] rounded-lg p-3 flex justify-between items-start">
                <div>
                  <h3 className="font-semibold text-white">{r.name}</h3>
                  <span className="text-[10px] font-mono text-blue-400">{r.universe}</span>
                  <div className="mt-1 flex gap-1 text-[11px] text-slate-400">
                    {r.criteria.min_change_pct && <span>Change &gt;= {r.criteria.min_change_pct}%</span>}

                <button onClick={() => handleDelete(r.id)} className="text-slate-500 hover:text-rose-400 text-xs">Delete</button>

            ))}

    // ----------------- USERS MANAGER ----------------- //
    function UsersManager({ onBack }) {
      const [users, setUsers] = useState([]);
      const [uName, setUName] = useState('');
      const [pwd, setPwd] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('viewer');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');

      const fetchUsers = async () => {
        setLoading(true);
        try {
          const res = await api.get('/users/');
          setUsers(Array.isArray(res.data) ? res.data : []);
        } catch (e) {
          setError('Failed to fetch user accounts');
        } finally {
          setLoading(false);
        }
      };

      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => { fetchUsers(); }, []);

      const handleAdd = async (e) => {
        e.preventDefault();
        setError('');
        setSuccess('');

        if (!uName.trim()) {
          setError('Please provide a username');
          return;
        }
        if (!pwd || pwd.length < 4) {
          setError('Password must be at least 4 characters');
          return;
        }

        setIsSubmitting(true);
        try {
          const payload = {
            username: uName.trim(),
            password: pwd,
            email: email.trim() || null,
            role: role
          };
          const res = await api.post('/users/', payload);
          if (res.data) {
            setUName('');
            setPwd('');
            setEmail('');
            setSuccess(`User "${res.data.username}" created successfully`);
            fetchUsers();
          }
        } catch (e) {
          const detail = e.response?.data?.detail;
          if (Array.isArray(detail)) {
            setError(detail.map(d => d.msg || d).join(', '));
          } else {
            setError(detail || e.message || 'Failed to create user');
          }
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleDelete = async (id, name) => {
        if (!confirm(`Are you sure you want to delete user "${name}"?`)) return;
        try {
          await api.delete(`/users/${id}`);
          setSuccess(`User ${name} removed`);
          fetchUsers();
        } catch (e) {
          setError(e.response?.data?.detail || 'Cannot delete user');
        }
      };

      const handleToggleStatus = async (user) => {
        try {
          await api.patch(`/users/${user.id}`, { is_active: !user.is_active });
          fetchUsers();
        } catch (e) {
          setError('Failed to update user status');
        }
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto text-xs font-sans animate-fade-in">
          {/* Header */}
          <div className="flex items-center justify-between pb-4 border-b border-[#1A2538]">
            <div className="flex items-center space-x-3">
              <div className="p-2.5 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
              </div>
              <div>
                <h1 className="text-lg font-bold text-white tracking-tight">Team Accounts & Access Control</h1>
                <p className="text-slate-400 text-xs">Manage team member logins, roles, and linked alert channels.</p>
              </div>
            </div>
            <button onClick={onBack} className="px-3 py-1.5 bg-[#131B2E] text-slate-300 rounded-lg border border-[#223049] hover:text-white text-xs">
              ← Return
            </button>
          </div>

          {/* User Metrics Summary */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl p-4">
              <span className="text-[10px] font-mono uppercase text-slate-400 block mb-1">Total Registered Users</span>
              <div className="text-2xl font-bold font-mono text-white">{users.length}</div>
            </div>
            <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl p-4">
              <span className="text-[10px] font-mono uppercase text-slate-400 block mb-1">Administrators</span>
              <div className="text-2xl font-bold font-mono text-blue-400">
                {users.filter(u => u.role === 'admin').length}
              </div>
            </div>
            <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl p-4">
              <span className="text-[10px] font-mono uppercase text-slate-400 block mb-1">View-Only Traders</span>
              <div className="text-2xl font-bold font-mono text-emerald-400">
                {users.filter(u => u.role === 'viewer').length}
              </div>
            </div>
          </div>

          {/* Feedback messages */}
          {error && <div className="p-3 bg-rose-500/10 border border-rose-500/20 text-rose-300 rounded-lg text-xs font-mono">{error}</div>}
          {success && <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 rounded-lg text-xs font-mono">{success}</div>}

          {/* Add User Card */}
          <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl p-5 shadow-sm">

            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-5 gap-3">

                <label className="block text-[11px] font-mono text-slate-300 mb-1">Username *</label>
                <input type="text" required value={uName} onChange={e => setUName(e.target.value)} placeholder="e.g. rahul_trader" className="w-full px-3 py-1.5 bg-[#090F1B] border border-[#1F2C45] rounded-lg text-white font-mono text-xs focus:outline-none focus:border-blue-500" />
              </div>
              <div>
                <label className="block text-[11px] font-mono text-slate-300 mb-1">Email</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="trader@quant.in" className="w-full px-3 py-1.5 bg-[#090F1B] border border-[#1F2C45] rounded-lg text-white text-xs focus:outline-none focus:border-blue-500" />
              </div>
              <div>
                <label className="block text-[11px] font-mono text-slate-300 mb-1">Password *</label>
                <input type="password" required value={pwd} onChange={e => setPwd(e.target.value)} placeholder="Minimum 6 characters" className="w-full px-3 py-1.5 bg-[#090F1B] border border-[#1F2C45] rounded-lg text-white text-xs focus:outline-none focus:border-blue-500" />
              </div>
              <div>
                <label className="block text-[11px] font-mono text-slate-300 mb-1">Role *</label>
                <select value={role} onChange={e => setRole(e.target.value)} className="w-full px-3 py-1.5 bg-[#090F1B] border border-[#1F2C45] rounded-lg text-white text-xs focus:outline-none focus:border-blue-500">
                  <option value="viewer">Viewer (Read Only Screener)</option>
                  <option value="admin">Admin (Full Control)</option>
                </select>
              </div>
              <div className="flex items-end">
                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full py-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-semibold text-xs rounded-lg transition-colors shadow-sm"
                >
                  {isSubmitting ? 'Creating...' : '+ Create User'}
                </button>
              </div>
            </form>
          </div>

          {/* Users Table */}
          <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl overflow-hidden shadow-sm">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs font-mono">
                <thead className="bg-[#090F1B] text-slate-400 font-mono text-[11px] uppercase border-b border-[#1A2538]">
                  <tr>
                    <th className="py-3 px-4">User</th>
                    <th className="py-3 px-4">Email</th>
                    <th className="py-3 px-4 text-center">Role</th>
                    <th className="py-3 px-4 text-center">Telegram DMs</th>
                    <th className="py-3 px-4 text-center">Account Status</th>
                    <th className="py-3 px-4 text-center">Created At</th>
                    <th className="py-3 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#152033]">
                  {loading ? (
                    <tr>
                      <td colSpan={7} className="py-8 text-center text-slate-500">Loading team accounts...</td>
                    </tr>
                  ) : users.length === 0 ? (
                    <tr>
                      <td colSpan={7} className="py-8 text-center text-slate-500">No users found</td>
                    </tr>
                  ) : (
                    users.map(u => (
                      <tr key={u.id} className="hover:bg-[#131D30] transition-colors">
                        <td className="py-3 px-4">
                          <div className="flex items-center space-x-2.5">
                            <div className="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-slate-200">
                              {(u.username || 'U')[0].toUpperCase()}

                            <span className="font-bold text-white">{u.username || 'Unnamed'}</span>

                        <td className="py-3 px-4 text-slate-400">{u.email || '—'}</td>
                        <td className="py-3 px-4 text-center">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                            u.role === 'admin' 
                              ? 'bg-blue-500/10 text-blue-400 border border-blue-500/30' 
                              : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30'
                          }`}>
                            {u.role}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-center">
                          {u.telegram_chat_id ? (
                            <span className="px-2 py-0.5 rounded text-[10px] bg-sky-500/10 text-sky-300 border border-sky-500/25">

                        <td className="py-3 px-4 text-center">

    // Personal Telegram settings for viewer / admin
    function UserTelegramPreferenceCard() {
      const [chatId, setChatId] = useState('');
      const [enabled, setEnabled] = useState(true);
      const [saving, setSaving] = useState(false);
      const [msg, setMsg] = useState('');

      useEffect(() => {
        api.get('/telegram/user-pref').then(res => {
          if (res.data && res.data.status === 'success') {
            setChatId(res.data.telegram_chat_id || '');
            setEnabled(res.data.telegram_alerts_enabled !== false);
          }
        }).catch(err => console.error("Error loading user telegram prefs:", err));
      }, []);

      const handleSave = async (e) => {
        e.preventDefault();
        setSaving(true);
        setMsg('');
        try {
          await api.put('/telegram/user-pref', {
            telegram_chat_id: chatId,
            telegram_alerts_enabled: enabled
          });
          setMsg('Saved personal Telegram alert preferences');
        } catch (e) {
          setMsg('Failed to update preferences: ' + (e.response?.data?.detail || e.message));
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="bg-[#0E1524] border border-[#1C273C] rounded-lg p-5 mt-5">
          <div className="flex items-center space-x-3 mb-3">
            <svg className="w-5 h-5 text-sky-400" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
            </svg>
            <div>
              <h3 className="font-bold text-white text-sm">Personal Telegram Alerts (Direct DMs)</h3>
              <p className="text-xs text-slate-400">Receive private direct notifications when your watched setups trigger.</p>
            </div>
          </div>

          <form onSubmit={handleSave} className="space-y-4">
            <div>
              <label className="block text-xs font-mono text-slate-300 mb-1">Your Telegram Chat ID</label>
              <input
                type="text"
                placeholder="e.g. 123456789 (Obtain by messaging @userinfobot on Telegram)"
                value={chatId}
                onChange={e => setChatId(e.target.value)}
                className="w-full bg-[#090F1B] border border-[#1F2C45] rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 font-mono focus:outline-none focus:border-sky-500"
              />
            </div>

            <div className="flex items-center justify-between">
              <label className="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                <input
                  type="checkbox"
                  checked={enabled}
                  onChange={e => setEnabled(e.target.checked)}
                  className="rounded border-[#1F2C45] text-sky-500 focus:ring-0"
                />
                <span>Enable direct private Telegram alert delivery</span>
              </label>

              <button
                type="submit"
                disabled={saving}
                className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs rounded-lg transition-colors shadow-sm disabled:opacity-50"
              >
                {saving ? 'Saving...' : 'Update Telegram Alerts'}
              </button>
            </div>

            {msg && (
              <p className={`text-xs font-mono ${msg.includes('Failed') ? 'text-rose-400' : 'text-emerald-400'}`}>
                {msg}
              </p>
            )}
          </form>
        </div>
      );
    }

    // ----------------- FEATURE 5: TELEGRAM ALERTS CONTROL CENTER (ADMIN) ----------------- //
    function TelegramAlertsView({ onBack }) {
      const [botToken, setBotToken] = useState('');
      const [channelId, setChannelId] = useState('');
      const [isEnabled, setIsEnabled] = useState(false);
      const [alertHps, setAlertHps] = useState(true);
      const [alertMeanRev, setAlertMeanRev] = useState(true);
      const [botUsername, setBotUsername] = useState('');
      const [botTokenMasked, setBotTokenMasked] = useState('');
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [testing, setTesting] = useState(false);
      const [statusMsg, setStatusMsg] = useState({ type: '', text: '' });
      const [testChatId, setTestChatId] = useState('');

      const fetchConfig = async () => {
        setLoading(true);
        try {
          const res = await api.get('/telegram/config');
          if (res.data && res.data.status === 'success') {
            setIsEnabled(res.data.is_enabled);
            setBotUsername(res.data.bot_username || '');
            setBotTokenMasked(res.data.bot_token_masked || '');
            setChannelId(res.data.default_channel_id || '');
            setAlertHps(res.data.alert_on_hps_breakout !== false);
            setAlertMeanRev(res.data.alert_on_mean_reversion !== false);
            setTestChatId(res.data.default_channel_id || '');
          }
        } catch (e) {
          console.error("Failed to fetch telegram config:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchConfig();
      }, []);

      const handleSave = async (e) => {
        e.preventDefault();
        setSaving(true);
        setStatusMsg({ type: '', text: '' });
        try {
          const payload = {
            is_enabled: isEnabled,
            default_channel_id: channelId,
            alert_on_hps_breakout: alertHps,
            alert_on_mean_reversion: alertMeanRev
          };
          if (botToken.trim()) {
            payload.bot_token = botToken.trim();
          }
          const res = await api.put('/telegram/config', payload);
          setStatusMsg({ type: 'success', text: 'Telegram configuration updated successfully!' });
          setBotToken('');
          fetchConfig();
        } catch (e) {
          setStatusMsg({ type: 'error', text: e.response?.data?.detail || 'Failed to update configuration' });
        } finally {
          setSaving(false);
        }
      };

      const handleSendTest = async () => {
        if (!testChatId.trim()) {
          setStatusMsg({ type: 'error', text: 'Please enter a target Channel ID, Group ID or User Chat ID to test' });
          return;
        }
        setTesting(true);
        setStatusMsg({ type: '', text: '' });
        try {
          const res = await api.post('/telegram/send-test', { chat_id: testChatId.trim() });
          setStatusMsg({ type: 'success', text: 'Test alert sent successfully to ' + testChatId });
        } catch (e) {
          setStatusMsg({ type: 'error', text: e.response?.data?.detail || 'Failed to dispatch test message' });
        } finally {
          setTesting(false);
        }
      };

      return (
        <div className="space-y-6 max-w-4xl font-sans animate-fade-in">
          {/* Header */}
          <div className="flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="p-2.5 rounded-xl bg-sky-500/10 border border-sky-500/20 text-sky-400">
                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                </svg>
              </div>
              <div>
                <h1 className="text-lg font-bold text-white tracking-tight">Telegram Alert Notification System</h1>
                <p className="text-xs text-slate-400">
                  Hybrid broadcast engine: Send real-time screener alerts to shared groups and private member DMs.
                </p>
              </div>
            </div>
            <button onClick={onBack} className="px-3 py-1.5 bg-[#131B2E] text-slate-300 rounded-lg border border-[#223049] hover:text-white text-xs">
              ← Return
            </button>
          </div>

          {/* Architecture Details Box */}
          <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl p-4 text-xs space-y-2">
            <h2 className="font-bold text-white flex items-center space-x-2">
              <span className="w-2 h-2 rounded-full bg-sky-400"></span>
              <span>How Telegram Alerts Work (Hybrid Model)</span>
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-slate-400 pt-1">
              <div className="bg-[#090F1B] border border-[#192438] p-3 rounded-lg">
                <div className="font-semibold text-sky-300 mb-1">1. Group Channel Broadcasts</div>
                <div>Add your bot as an Admin to your Telegram Group or Broadcast Channel. Paste the Group ID (e.g. <code>-100xxxxxxx</code>) below. All community members receive alerts at once.</div>
              </div>
              <div className="bg-[#090F1B] border border-[#192438] p-3 rounded-lg">
                <div className="font-semibold text-emerald-300 mb-1">2. Private Direct DMs</div>
                <div>Individual team members can open the bot and enter their private Chat ID in their Profile to receive personal 1-on-1 notifications automatically.</div>
              </div>
            </div>
          </div>

          {/* Configuration Form */}
          <div className="bg-[#0E1524] border border-[#1A2538] rounded-xl p-5 shadow-sm">
            <form onSubmit={handleSave} className="space-y-5">
              {/* Bot Active Switch */}
              <div className="flex items-center justify-between pb-4 border-b border-[#1A2538]">
                <div>
                  <h3 className="font-bold text-white text-sm">Enable Telegram Alerts Dispatcher</h3>
                  <p className="text-xs text-slate-400">Activate or pause automated notification dispatches.</p>
                </div>
                <label className="relative inline-flex items-center cursor-pointer">
                  <input
                    type="checkbox"
                    checked={isEnabled}
                    onChange={e => setIsEnabled(e.target.checked)}
                    className="sr-only peer"
                  />
                  <div className="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-sky-600"></div>
                </label>
              </div>

              {/* Bot Token Input */}
              <div className="space-y-1.5">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-mono font-bold text-slate-300">
                    Telegram Bot Token (from @BotFather)
                  </label>
                  {botUsername && (
                    <span className="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                      Connected: @{botUsername}
                    </span>
                  )}
                </div>
                <input
                  type="password"
                  placeholder={botTokenMasked ? `Currently configured (${botTokenMasked}) — enter new to replace` : "e.g. 123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"}
                  value={botToken}
                  onChange={e => setBotToken(e.target.value)}
                  className="w-full bg-[#090F1B] border border-[#1A2538] rounded-lg px-3.5 py-2 text-xs text-white placeholder-slate-500 font-mono focus:outline-none focus:border-sky-500"
                />
                <p className="text-[11px] text-slate-500">
                  Create a bot on Telegram with <a href="https://t.me/BotFather" target="_blank" className="text-sky-400 underline">@BotFather</a> and paste the HTTP API bot token here.
                </p>
              </div>

              {/* Default Channel / Group Chat ID */}
              <div className="space-y-1.5">
                <label className="text-xs font-mono font-bold text-slate-300">
                  Shared Broadcast Group / Channel ID
                </label>
                <input
                  type="text"
                  placeholder="e.g. -1001234567890 or @YourPublicChannel"
                  value={channelId}
                  onChange={e => setChannelId(e.target.value)}
                  className="w-full bg-[#090F1B] border border-[#1A2538] rounded-lg px-3.5 py-2 text-xs text-white placeholder-slate-500 font-mono focus:outline-none focus:border-sky-500"
                />
                <p className="text-[11px] text-slate-500">
                  Add the bot as an administrator to your target group or channel, then provide the chat ID.
                </p>
              </div>

              {/* Alert Triggers */}
              <div className="space-y-2 pt-2">
                <div className="text-xs font-mono font-bold text-slate-300 uppercase">Alert Triggers</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <label className="flex items-center space-x-3 p-3 bg-[#090F1B] border border-[#1A2538] rounded-lg cursor-pointer">
                    <input
                      type="checkbox"
                      checked={alertHps}
                      onChange={e => setAlertHps(e.target.checked)}
                      className="rounded border-[#1A2538] text-sky-500 focus:ring-0"
                    />
                    <div>
                      <div className="text-xs font-bold text-white">HPS Breakout Alerts</div>
                      <div className="text-[11px] text-slate-400">Notify on Bullish & Bearish momentum breaks</div>
                    </div>
                  </label>

                  <label className="flex items-center space-x-3 p-3 bg-[#090F1B] border border-[#1A2538] rounded-lg cursor-pointer">
                    <input
                      type="checkbox"
                      checked={alertMeanRev}
                      onChange={e => setAlertMeanRev(e.target.checked)}
                      className="rounded border-[#1A2538] text-emerald-500 focus:ring-0"
                    />
                    <div>
                      <div className="text-xs font-bold text-white">HPS Mean Reversion Alerts</div>
                      <div className="text-[11px] text-slate-400">Notify when stocks enter Level-1, Level-2, or Level-3</div>
                    </div>
                  </label>
                </div>
              </div>

              {statusMsg.text && (
                <div className={`p-3 rounded-lg text-xs font-mono ${
                  statusMsg.type === 'success' ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-300 border border-rose-500/20'
                }`}>
                  {statusMsg.text}
                </div>
              )}

              {/* Action Buttons */}
              <div className="flex items-center justify-between pt-3 border-t border-[#1A2538]">
                <button
                  type="submit"
                  disabled={saving}
                  className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-lg transition-colors shadow-sm disabled:opacity-50"
                >
                  {saving ? 'Saving...' : 'Save Configuration'}
                </button>

                <div className="flex items-center space-x-2">
                  <input
                    type="text"
                    placeholder="Chat ID for test"
                    value={testChatId}
                    onChange={e => setTestChatId(e.target.value)}
                    className="w-48 bg-[#090F1B] border border-[#1A2538] rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-slate-500 font-mono focus:outline-none focus:border-sky-500"
                  />
                  <button
                    type="button"
                    onClick={handleSendTest}
                    disabled={testing}
                    className="px-3.5 py-2 bg-[#17253D] hover:bg-[#203456] text-sky-300 text-xs rounded-lg border border-sky-500/30 transition-colors font-mono disabled:opacity-50"
                  >
                    {testing ? 'Sending...' : 'Send Test Alert'}
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ----------------- LOGIN SCREEN ----------------- //
    function LoginScreen({ onLoginSuccess }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await api.post('/auth/login', { username, password });
          onLoginSuccess({ username: res.data.username, role: res.data.role }, res.data.access_token);
        } catch (err) {
          setError(err.response?.data?.detail || 'Invalid username or password');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#070A10] flex flex-col justify-center items-center px-4 font-sans select-none">
          <div className="text-center mb-7">
            <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-[#0C121E] border border-blue-500/30 mb-3 p-3 shadow-2xl shadow-blue-500/20">
              <img src="/assets/alphaquant_pennant_pro.svg" alt="AlphaQuant Logo" className="w-16 h-16 object-contain" />
            </div>
            <h1 className="text-2xl font-bold text-white tracking-tight">AlphaQuant Terminal</h1>
          </div>

          <div className="w-full max-w-md bg-[#0D1422] border border-[#1B273E] rounded-2xl p-8 shadow-2xl">
            <h2 className="text-base font-semibold text-white mb-1">Sign In</h2>
            <p className="text-xs text-slate-400 mb-6">Enter your credentials to access your trading workspace</p>

            {error && (
              <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs rounded-lg">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-sm">
              <div>
                <label className="block text-slate-300 font-medium text-xs mb-1.5">Username</label>
                <input
                  type="text"
                  required
                  placeholder="Enter username"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-[#080C14] border border-[#1E2B40] rounded-lg text-white focus:outline-none focus:border-blue-500 font-mono text-sm"
                />
              </div>

              <div>
                <label className="block text-slate-300 font-medium text-xs mb-1.5">Password</label>
                <input
                  type="password"
                  required
                  placeholder="••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-[#080C14] border border-[#1E2B40] rounded-lg text-white focus:outline-none focus:border-blue-500 font-mono text-sm"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-semibold rounded-lg transition-colors mt-2 text-sm shadow-md shadow-blue-600/25"
              >
                {loading ? 'Authenticating...' : 'Sign In to Workspace'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
